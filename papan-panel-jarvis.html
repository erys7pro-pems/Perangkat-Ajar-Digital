<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S. // Papan Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050a12;
  --bg-grid:#08111c;
  --panel:#0a1622;
  --panel-2:#0d1c2b;
  --cyan:#2be3ff;
  --cyan-dim:#0f7c94;
  --violet:#7b61ff;
  --amber:#ffb020;
  --red:#ff4d5e;
  --text:#d6f2ff;
  --muted:#5b7c95;
  --line:#173347;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse at top, #0a1826 0%, var(--bg) 55%),
    repeating-linear-gradient(0deg, rgba(43,227,255,.025) 0px, rgba(43,227,255,.025) 1px, transparent 1px, transparent 3px);
  color:var(--text);
  font-family:'Share Tech Mono', monospace;
  min-height:100vh;
  overflow-x:hidden;
}
.hud-font{font-family:'Orbitron', sans-serif;}

/* scanline sweep, one orchestrated moment on load */
.boot{
  position:fixed;inset:0;background:#020508;z-index:999;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;
  animation:bootOut .6s ease 1.4s forwards;
}
.boot-line{font-family:'Orbitron',sans-serif;color:var(--cyan);letter-spacing:.12em;font-size:13px;opacity:0;animation:bootIn .5s ease forwards;text-shadow:0 0 12px rgba(43,227,255,.7);}
.boot-line:nth-child(1){animation-delay:.1s;}
.boot-line:nth-child(2){animation-delay:.5s;}
.boot-line:nth-child(3){animation-delay:.9s;}
@keyframes bootIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
@keyframes bootOut{to{opacity:0;visibility:hidden;pointer-events:none;}}
.boot-ring{width:64px;height:64px;border-radius:50%;border:2px solid var(--cyan-dim);border-top-color:var(--cyan);animation:spin 1s linear infinite;box-shadow:0 0 24px rgba(43,227,255,.35);}
@keyframes spin{to{transform:rotate(360deg);}}

header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg, rgba(5,10,18,.97), rgba(5,10,18,.9));
  border-bottom:1px solid var(--line);
  padding:12px 16px 10px;
}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1100px;margin:0 auto 10px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:26px;height:26px;position:relative;flex-shrink:0;}
.brand-mark svg{width:100%;height:100%;}
.brand h1{font-size:15px;margin:0;letter-spacing:.16em;font-weight:700;color:var(--cyan);text-shadow:0 0 10px rgba(43,227,255,.5);}
.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:.14em;margin-top:1px;}
.status{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);cursor:pointer;padding:6px 10px;border:1px solid var(--line);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);background:var(--panel);}
.status:hover{border-color:var(--cyan-dim);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;}
.dot.online{background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse 2s ease-in-out infinite;}
.dot.local{background:var(--amber);box-shadow:0 0 8px var(--amber);}
.dot.error{background:var(--red);box-shadow:0 0 8px var(--red);}
.dot.sync{background:var(--violet);box-shadow:0 0 8px var(--violet);animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

.menu-row{display:flex;gap:8px;overflow-x:auto;max-width:1100px;margin:0 auto;padding-bottom:2px;}
.menu-tab{
  position:relative;padding:8px 26px 8px 14px;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  white-space:nowrap;cursor:pointer;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.08em;
  clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px);flex-shrink:0;
}
.menu-tab.active{color:var(--cyan);border-color:var(--cyan-dim);background:var(--panel-2);box-shadow:inset 0 0 12px rgba(43,227,255,.12);}
.menu-del{position:absolute;right:8px;top:50%;transform:translateY(-50%);opacity:.5;font-size:13px;}
.menu-del:hover{opacity:1;color:var(--red);}
#add-menu-btn{flex-shrink:0;padding:8px 14px;border:1px dashed var(--line);background:transparent;color:var(--muted);cursor:pointer;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.08em;}
#add-menu-btn:hover{color:var(--cyan);border-color:var(--cyan-dim);}

main{padding:20px 16px 60px;max-width:1100px;margin:0 auto;}
.add-panel-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 18px;padding:11px 16px;
  border:1px dashed var(--line);background:transparent;color:var(--muted);cursor:pointer;width:100%;
  font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.1em;
}
.add-panel-btn:hover{color:var(--cyan);border-color:var(--cyan-dim);}
.panels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;}

.panel-card{
  background:var(--panel);border:1px solid var(--line);padding:0;position:relative;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
}
.panel-card::before{
  content:'';position:absolute;top:0;left:0;width:100%;height:2px;
  background:linear-gradient(90deg, var(--cyan), transparent 60%);opacity:.6;
}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 10px;border-bottom:1px solid var(--line);}
.panel-head h3{margin:0;font-size:13px;font-family:'Orbitron',sans-serif;letter-spacing:.06em;color:var(--text);}
.icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:2px 6px;line-height:1;}
.icon-btn:hover{color:var(--red);}
.panel-body{padding:4px 14px 12px;}
.sub-card{border-top:1px solid var(--line);padding:10px 0;}
.sub-card:first-child{border-top:none;}
.sub-card img{max-width:100%;display:block;margin-top:8px;border:1px solid var(--line);filter:saturate(.85) contrast(1.05);}
.sub-title{font-weight:700;font-size:13px;color:var(--text);}
.sub-subtitle{color:var(--muted);font-size:11.5px;margin-top:2px;}
.sub-link{color:var(--cyan);font-size:11.5px;display:inline-block;margin-top:7px;text-decoration:none;border-bottom:1px solid var(--cyan-dim);}
.sub-link:hover{text-shadow:0 0 6px rgba(43,227,255,.6);}
.add-sub-btn{margin-top:8px;font-size:11px;background:none;border:1px dashed var(--line);color:var(--muted);padding:7px 10px;cursor:pointer;font-family:'Orbitron',sans-serif;letter-spacing:.06em;width:100%;}
.add-sub-btn:hover{color:var(--cyan);border-color:var(--cyan-dim);}
.empty{color:var(--muted);text-align:center;padding:60px 20px;font-size:12px;letter-spacing:.04em;border:1px dashed var(--line);grid-column:1/-1;}

/* Announcement (pengumuman) panel variant */
.panel-card.type-announcement{border-color:var(--amber);}
.panel-card.type-announcement::before{background:linear-gradient(90deg, var(--amber), transparent 60%);opacity:.75;}
.panel-card.type-announcement.expired{border-color:var(--line);}
.panel-card.type-announcement.expired::before{background:linear-gradient(90deg, var(--muted), transparent 60%);opacity:.35;}
.new-badge{
  position:absolute;top:-1px;right:14px;background:var(--amber);color:#1a0f00;font-family:'Orbitron',sans-serif;
  font-size:9.5px;font-weight:900;letter-spacing:.08em;padding:3px 9px 4px;
  clip-path:polygon(0 0,100% 0,100% 100%,6px 100%,0 60%);
  box-shadow:0 0 10px rgba(255,176,32,.6);animation:pulse 1.4s ease-in-out infinite;
}
.ann-body{font-size:12.5px;line-height:1.6;color:var(--text);white-space:pre-wrap;}
.ann-meta{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:10.5px;letter-spacing:.03em;}
.status-pill{font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:.07em;padding:3px 8px;border:1px solid var(--cyan-dim);color:var(--cyan);}
.status-pill.expired{border-color:var(--line);color:var(--muted);}
.ann-deadline{color:var(--muted);}
.panel-type-tag{font-size:9px;color:var(--muted);letter-spacing:.06em;font-family:'Orbitron',sans-serif;}

/* Type chooser modal */
.type-choice{display:flex;gap:10px;margin-top:4px;}
.type-choice button{
  flex:1;padding:16px 10px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer;
  font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.05em;display:flex;flex-direction:column;gap:6px;align-items:center;
}
.type-choice button:hover{border-color:var(--cyan);color:var(--cyan);}
.type-choice .ico{font-size:20px;}
.modal textarea{width:100%;padding:9px 10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:13px;font-family:'Share Tech Mono',monospace;resize:vertical;min-height:70px;}
.modal textarea:focus{outline:none;border-color:var(--cyan);}
.modal input[type="date"]{color-scheme:dark;}

/* Drag & drop */
.drag-handle{cursor:grab;color:var(--muted);font-size:15px;padding:6px 8px;user-select:none;touch-action:none;flex-shrink:0;line-height:1;}
.drag-handle:hover{color:var(--cyan);}
.drag-handle:active{cursor:grabbing;}
.move-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;padding:4px 5px;line-height:1;}
.move-btn:hover{color:var(--cyan);}
.move-btn:disabled{opacity:.25;cursor:default;}
.move-btn:disabled:hover{color:var(--muted);}
.panel-head-right{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.panel-head-left{display:flex;align-items:center;gap:6px;min-width:0;}
.panel-head-left h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.panel-card.type-info.dragging{opacity:.35;}
.panel-card.type-info.drag-over{outline:2px dashed var(--cyan);outline-offset:-3px;}
.sub-card{position:relative;}
.sub-card.dragging{opacity:.35;}
.sub-card.drag-over{outline:2px dashed var(--cyan);outline-offset:-2px;}
.sub-head-left{display:flex;align-items:flex-start;gap:6px;min-width:0;}
.sub-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}

.modal-overlay{position:fixed;inset:0;background:rgba(2,5,8,.75);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;}
.modal{
  background:var(--panel-2);border:1px solid var(--cyan-dim);padding:22px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto;
  box-shadow:0 0 40px rgba(43,227,255,.12);clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
}
.modal h4{margin:0 0 4px;font-family:'Orbitron',sans-serif;font-size:14px;letter-spacing:.08em;color:var(--cyan);}
.modal .sub{font-size:11px;color:var(--muted);margin-bottom:6px;}
.modal label{display:block;font-size:10.5px;color:var(--muted);margin:12px 0 5px;letter-spacing:.06em;font-family:'Orbitron',sans-serif;}
.modal input{width:100%;padding:9px 10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:13px;font-family:'Share Tech Mono',monospace;}
.modal input:focus{outline:none;border-color:var(--cyan);}
.modal-actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;}
.btn{padding:9px 16px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.06em;}
.btn:hover{color:var(--text);border-color:var(--muted);}
.btn-primary{background:var(--cyan-dim);border-color:var(--cyan);color:#02141a;font-weight:700;}
.btn-primary:hover{color:#02141a;box-shadow:0 0 14px rgba(43,227,255,.4);}
.hint{font-size:10.5px;color:var(--muted);margin-top:10px;line-height:1.5;}
.hint code{color:var(--cyan);}
/* Riwayat pengumuman */
.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.hist-btn{display:flex;align-items:center;gap:8px;font-family:'Orbitron',sans-serif;font-size:9.5px;letter-spacing:.07em;color:var(--amber);cursor:pointer;padding:6px 10px;border:1px solid var(--line);background:var(--panel);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);}
.hist-btn:hover{border-color:var(--amber);box-shadow:0 0 10px rgba(255,176,32,.2);}
.hist-count{background:var(--amber);color:#1a0f00;font-weight:900;padding:1px 6px;font-size:9px;min-width:16px;text-align:center;}
.modal.wide{max-width:560px;}
.hist-list{margin-top:10px;}
.hist-item{border-top:1px solid var(--line);padding:12px 0;}
.hist-item:first-child{border-top:none;}
.hist-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.hist-title{font-family:'Orbitron',sans-serif;font-size:12.5px;letter-spacing:.04em;color:var(--text);}
.hist-body{font-size:12px;line-height:1.6;color:var(--muted);white-space:pre-wrap;margin-top:6px;}
.hist-meta{font-size:10.5px;color:var(--muted);margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 12px;}
.hist-menu{color:var(--cyan);}
.hist-empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:12px;border:1px dashed var(--line);margin-top:10px;}
/* Peran guru / murid */
.header-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
.role-pill{font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:.07em;padding:5px 8px;border:1px solid var(--line);color:var(--muted);}
.role-pill.guru{color:var(--violet);border-color:var(--violet);box-shadow:0 0 8px rgba(123,97,255,.25);}
.role-btn{font-family:'Orbitron',sans-serif;font-size:9.5px;letter-spacing:.07em;color:var(--cyan);cursor:pointer;padding:6px 10px;border:1px solid var(--line);background:var(--panel);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);}
.role-btn:hover{border-color:var(--cyan-dim);box-shadow:0 0 10px rgba(43,227,255,.2);}
.status.readonly{cursor:default;}
.status.readonly:hover{border-color:var(--line);}
/* Toggle visibilitas: biru = tampil ke murid, kuning = hanya guru */
.vis-toggle{position:relative;display:inline-block;vertical-align:middle;width:26px;height:14px;border-radius:8px;border:1px solid var(--cyan);background:rgba(43,227,255,.18);cursor:pointer;flex-shrink:0;box-shadow:0 0 8px rgba(43,227,255,.4);transition:background .15s,border-color .15s,box-shadow .15s;}
.vis-toggle::after{content:'';position:absolute;top:2px;left:14px;width:8px;height:8px;border-radius:50%;background:var(--cyan);transition:left .15s,background .15s;}
.vis-toggle.off{border-color:var(--amber);background:rgba(255,176,32,.16);box-shadow:0 0 8px rgba(255,176,32,.4);}
.vis-toggle.off::after{left:2px;background:var(--amber);}
.menu-tab .vis-toggle{margin-left:8px;}
.sub-head-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.panel-head-right .vis-toggle{margin-right:6px;}
.teacher-only{opacity:.72;}
.panel-card.teacher-only,.menu-tab.teacher-only{border-style:dashed;}
.sub-card.teacher-only{background:repeating-linear-gradient(135deg, rgba(255,176,32,.05) 0 6px, transparent 6px 12px);}
.vis-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:10.5px;color:var(--muted);margin:0 0 14px;letter-spacing:.02em;}
.vis-legend .vis-toggle{cursor:default;}
</style>
</head>
<body>
<div class="boot">
  <div class="boot-ring"></div>
  <div class="boot-line hud-font">INITIALIZING INTERFACE</div>
  <div class="boot-line hud-font">LINKING MAINFRAME</div>
  <div class="boot-line hud-font">J.A.R.V.I.S. // PAPAN PANEL</div>
</div>
<div id="app"></div>

<script>
(function(){
  // Guru: isi URL Web App Apps Script di bawah ini sebelum file dibagikan ke murid,
  // supaya murid otomatis terhubung tanpa perlu mengatur apa pun.
  var DEFAULT_API_URL = '';

  var STORAGE_KEY = 'papan-panel-state-v1';
  var CONFIG_KEY = 'papan-panel-config-v1';
  var defaultState = {menus:[{id:'m1', name:'Umum'}], activeMenu:'m1', panels:[]};
  var state = normalizeState(loadState());
  var config = loadConfig();
  var syncStatus = 'idle'; // idle | local | online | syncing | error
  var syncTimer = null;

  // ---- Peran: 'murid' (hanya lihat) atau 'guru' (bisa mengubah) ----
  var role = 'murid';
  var teacherPw = '';
  try{
    if(sessionStorage.getItem('papan-panel-role')==='guru'){
      role = 'guru';
      teacherPw = sessionStorage.getItem('papan-panel-pw') || '';
    }
  }catch(e){}
  function isGuru(){ return role==='guru'; }
  var fullLoaded = false; // true jika state di memori adalah data lengkap (bukan versi yang sudah disaring untuk murid)
  var JSON_HDR = {'Content-Type':'text/plain;charset=utf-8'}; // avoids CORS preflight on Apps Script

  // ---- Visibilitas: item dengan hidden===true hanya tampil untuk guru ----
  function menuVisible(id){
    if(isGuru()) return true;
    var m = state.menus.find(function(x){ return x.id===id; });
    return !!m && !m.hidden;
  }
  function panelVisible(p){ return isGuru() || (!p.hidden && menuVisible(p.menuId)); }
  function visToggle(kind, id, hidden, panelId){
    return '<span class="vis-toggle'+(hidden?' off':'')+'" role="switch" aria-checked="'+(!hidden)+'" data-vis="'+kind+'" data-id="'+id+'"'+(panelId?' data-panel="'+panelId+'"':'')+
      ' title="'+(hidden?'KUNING: hanya tampil untuk guru (klik agar tampil ke murid)':'BIRU: tampil untuk murid (klik untuk sembunyikan dari murid)')+'"></span>';
  }
  function toggleVisibility(kind, id, panelId){
    if(!isGuru()) return;
    var item = null;
    if(kind==='menu') item = state.menus.find(function(m){ return m.id===id; });
    else if(kind==='panel') item = state.panels.find(function(p){ return p.id===id; });
    else { var pp = state.panels.find(function(x){ return x.id===panelId; }); item = pp && pp.subpanels.find(function(x){ return x.id===id; }); }
    if(!item) return;
    item.hidden = !item.hidden;
    save();
  }
  function setRole(r, pw){
    role = r; teacherPw = pw || '';
    if(r!=='guru') fullLoaded = false;
    try{
      if(r==='guru'){ sessionStorage.setItem('papan-panel-role','guru'); sessionStorage.setItem('papan-panel-pw', teacherPw); }
      else { sessionStorage.removeItem('papan-panel-role'); sessionStorage.removeItem('papan-panel-pw'); }
    }catch(e){}
    render();
  }
  function hashPw(str){ var h=5381; for(var i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))|0; } return String(h); }

  // Migrasi: panel yang dibuat versi file lama belum punya field "type"/"subpanels".
  // Tanpa ini, filter berbasis type==='info' akan mengabaikan panel lama tsb sepenuhnya
  // sehingga tombol panah & drag terlihat tidak merespons pada panel-panel tersebut.
  function normalizeState(s){
    if(s && Array.isArray(s.panels)){
      s.panels.forEach(function(p){
        if(p.type !== 'announcement') p.type = 'info';
        if(!Array.isArray(p.subpanels)) p.subpanels = [];
      });
    }
    return s;
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){ console.error(e); }
    return JSON.parse(JSON.stringify(defaultState));
  }
  function loadConfig(){
    try{
      var raw = localStorage.getItem(CONFIG_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return {apiUrl:''};
  }
  function persistLocal(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ console.error(e); }
  }
  function persistConfig(){
    try{ localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); }catch(e){}
  }

  function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
  function esc(s){ return (s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // ---- Pengumuman: label "BARU!" hilang otomatis setelah 3 hari ----
  var NEW_BADGE_DURATION_MS = 3 * 24 * 60 * 60 * 1000;
  function isFresh(p){
    if(!p.createdAt) return false;
    return (Date.now() - p.createdAt) < NEW_BADGE_DURATION_MS;
  }
  function isExpired(p){
    if(!p.deadline) return false;
    // deadline disimpan sebagai 'YYYY-MM-DD'; anggap berakhir di akhir hari itu
    var end = new Date(p.deadline+'T23:59:59').getTime();
    return Date.now() > end;
  }
  function formatDate(dstr){
    if(!dstr) return '';
    var d = new Date(dstr+'T00:00:00');
    if(isNaN(d.getTime())) return dstr;
    var bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    return d.getDate()+' '+bulan[d.getMonth()]+' '+d.getFullYear();
  }

  // ---- Google Apps Script sync layer ----
  function apiUrl(){ return ((config.apiUrl||'').trim()) || (DEFAULT_API_URL||'').trim(); }
  function hasApi(){ return !!apiUrl(); }

  // Guru memuat data LENGKAP lewat POST bersandi; murid memuat lewat GET (server sudah membuang item yang disembunyikan).
  function fetchState(){
    if(isGuru()){
      return fetch(apiUrl(), {method:'POST', headers:JSON_HDR, body:JSON.stringify({action:'load', password:teacherPw})})
        .then(function(r){ return r.json(); })
        .then(function(res){
          if(res && res.error==='unauthorized') throw {unauthorized:true};
          if(res && res.ok && res.state) return res.state;
          throw new Error((res && res.error) || 'Gagal memuat data guru');
        });
    }
    return fetch(apiUrl(), {method:'GET'}).then(function(r){ return r.json(); });
  }

  function loadFromApi(silent){
    if(!hasApi()){ syncStatus='local'; render(); return; }
    if(!silent){ syncStatus='syncing'; render(); }
    fetchState()
      .then(function(data){
        var changed = false;
        if(data && typeof data==='object' && data.menus){
          var fresh = normalizeState(data);
          var keep = state.activeMenu; // menu aktif bersifat lokal per pengguna
          changed = JSON.stringify(fresh.panels)!==JSON.stringify(state.panels) || JSON.stringify(fresh.menus)!==JSON.stringify(state.menus);
          state = fresh;
          if(isGuru()) fullLoaded = true;
          if(keep && state.menus.some(function(m){ return m.id===keep; })) state.activeMenu = keep;
          persistLocal();
        }
        syncStatus='online';
        if(!silent || changed) render(); else renderStatusOnly();
      })
      .catch(function(err){
        if(err && err.unauthorized){
          alert('Sesi guru tidak valid (kata sandi ditolak server). Kamu dikembalikan ke mode murid.');
          setRole('murid');
          loadFromApi();
          return;
        }
        console.error('Gagal memuat dari mainframe:', err);
        syncStatus='error';
        if(silent) renderStatusOnly(); else render();
      });
  }

  function pushToApi(){
    if(!hasApi() || !isGuru()) return;
    if(!fullLoaded){ // jangan menimpa server dengan data yang belum lengkap
      syncStatus='error'; renderStatusOnly(); return;
    }
    syncStatus='syncing'; renderStatusOnly();
    fetch(apiUrl(), {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // avoids CORS preflight on Apps Script
      body: JSON.stringify({action:'save', password:teacherPw, state:state})
    })
      .then(function(r){ return r.json(); })
      .then(function(res){
        if(res && res.error==='unauthorized'){
          alert('Sesi guru tidak valid (kata sandi ditolak server). Kamu dikembalikan ke mode murid.');
          setRole('murid');
          loadFromApi();
          return;
        }
        syncStatus = (res && res.ok) ? 'online' : 'error';
        renderStatusOnly();
      })
      .catch(function(err){
        console.error('Gagal menyimpan ke mainframe:', err);
        syncStatus='error';
        renderStatusOnly();
      });
  }

  function queueSync(){
    if(!hasApi() || !isGuru()) return;
    if(syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(pushToApi, 500); // debounce rapid edits
  }

  function statusLabel(){
    if(!hasApi()) return {cls:'local', text:'MODE LOKAL'};
    if(syncStatus==='syncing') return {cls:'sync', text:'SYNCING...'};
    if(syncStatus==='online') return {cls:'online', text:'MAINFRAME ONLINE'};
    if(syncStatus==='error') return {cls:'error', text:'SYNC GAGAL'};
    return {cls:'local', text:'MENGHUBUNGKAN...'};
  }

  // ---- Drag & drop wiring (native HTML5 DnD) ----
  function wireDragAndDrop(app){
    var draggedPanelId = null;
    app.querySelectorAll('[data-dragpanel]').forEach(function(handle){
      handle.addEventListener('dragstart', function(e){
        draggedPanelId = handle.getAttribute('data-dragpanel');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', draggedPanelId);
        var card = handle.closest('.panel-card');
        if(card) setTimeout(function(){ card.classList.add('dragging'); }, 0);
      });
      handle.addEventListener('dragend', function(){
        var card = handle.closest('.panel-card');
        if(card) card.classList.remove('dragging');
        draggedPanelId = null;
        app.querySelectorAll('.panel-card.drag-over').forEach(function(c){ c.classList.remove('drag-over'); });
      });
    });
    app.querySelectorAll('.panel-card.type-info').forEach(function(card){
      card.addEventListener('dragover', function(e){
        if(!draggedPanelId) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        card.classList.add('drag-over');
      });
      card.addEventListener('dragleave', function(){ card.classList.remove('drag-over'); });
      card.addEventListener('drop', function(e){
        e.preventDefault();
        card.classList.remove('drag-over');
        var targetId = card.getAttribute('data-pid');
        var dragId = draggedPanelId || e.dataTransfer.getData('text/plain');
        if(dragId) reorderInfoPanels(dragId, targetId);
      });
    });

    var draggedSubId = null, draggedSubPanel = null;
    app.querySelectorAll('[data-dragsub]').forEach(function(handle){
      handle.addEventListener('dragstart', function(e){
        draggedSubId = handle.getAttribute('data-dragsub');
        draggedSubPanel = handle.getAttribute('data-panel');
        e.stopPropagation();
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', draggedSubId);
        var sub = handle.closest('.sub-card');
        if(sub) setTimeout(function(){ sub.classList.add('dragging'); }, 0);
      });
      handle.addEventListener('dragend', function(){
        var sub = handle.closest('.sub-card');
        if(sub) sub.classList.remove('dragging');
        draggedSubId = null; draggedSubPanel = null;
        app.querySelectorAll('.sub-card.drag-over').forEach(function(c){ c.classList.remove('drag-over'); });
      });
    });
    app.querySelectorAll('.sub-card').forEach(function(sub){
      sub.addEventListener('dragover', function(e){
        if(!draggedSubId || draggedSubPanel!==sub.getAttribute('data-panel')) return;
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = 'move';
        sub.classList.add('drag-over');
      });
      sub.addEventListener('dragleave', function(){ sub.classList.remove('drag-over'); });
      sub.addEventListener('drop', function(e){
        e.preventDefault();
        e.stopPropagation();
        sub.classList.remove('drag-over');
        var targetId = sub.getAttribute('data-subid');
        var panelId = sub.getAttribute('data-panel');
        var dragId = draggedSubId || e.dataTransfer.getData('text/plain');
        if(dragId && panelId===draggedSubPanel) reorderSubpanels(panelId, dragId, targetId);
      });
    });
  }

  function openModal(title, sub, fields, onSave, saveLabel){
    var ov = document.createElement('div'); ov.className='modal-overlay';
    var f = fields.map(function(fl){
      if(fl.type==='textarea'){
        return '<label>'+fl.label+'</label><textarea data-f="'+fl.name+'" placeholder="'+(fl.placeholder||'')+'">'+esc(fl.value||'')+'</textarea>';
      }
      return '<label>'+fl.label+'</label><input data-f="'+fl.name+'" type="'+(fl.type||'text')+'" value="'+esc(fl.value||'')+'" placeholder="'+(fl.placeholder||'')+'">';
    }).join('');
    ov.innerHTML = '<div class="modal"><h4 class="hud-font">'+title+'</h4>'+(sub?'<div class="sub">'+sub+'</div>':'')+f+'<div class="modal-actions"><button class="btn" data-cancel>BATAL</button><button class="btn btn-primary" data-save>'+(saveLabel||'SIMPAN')+'</button></div></div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', function(e){ if(e.target===ov) ov.remove(); });
    ov.querySelector('[data-cancel]').onclick = function(){ ov.remove(); };
    ov.querySelectorAll('input').forEach(function(inp){ inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); ov.querySelector('[data-save]').click(); } }); });
    ov.querySelector('[data-save]').onclick = function(){
      var vals = {};
      fields.forEach(function(fl){ vals[fl.name] = ov.querySelector('[data-f="'+fl.name+'"]').value.trim(); });
      ov.remove();
      onSave(vals);
    };
    return ov;
  }

  // ---- Reorder via drag & drop ----
  function reorderInfoPanels(draggedId, targetId){
    if(!isGuru()) return;
    if(draggedId===targetId) return;
    var idxs = [];
    state.panels.forEach(function(p, i){ if(p.menuId===state.activeMenu && p.type!=='announcement') idxs.push(i); });
    var items = idxs.map(function(i){ return state.panels[i]; });
    var di = items.findIndex(function(p){ return p.id===draggedId; });
    var ti = items.findIndex(function(p){ return p.id===targetId; });
    if(di<0 || ti<0 || di===ti) return;
    var moved = items.splice(di, 1)[0];
    // ti is the target's index BEFORE removal; splicing at that same numeric
    // index on the shortened array correctly places moved right after the
    // target when dragging forward, and right before it when dragging
    // backward. Recomputing ti via findIndex after the splice (as before)
    // breaks the forward case and made adjacent-forward drags a no-op.
    items.splice(ti, 0, moved);
    idxs.forEach(function(origIdx, k){ state.panels[origIdx] = items[k]; });
    save();
  }
  function reorderSubpanels(panelId, draggedId, targetId){
    if(!isGuru()) return;
    if(draggedId===targetId) return;
    var p = state.panels.find(function(x){ return x.id===panelId; });
    if(!p) return;
    var arr = p.subpanels;
    var di = arr.findIndex(function(s){ return s.id===draggedId; });
    var ti = arr.findIndex(function(s){ return s.id===targetId; });
    if(di<0 || ti<0 || di===ti) return;
    var moved = arr.splice(di, 1)[0];
    arr.splice(ti, 0, moved); // see note above in reorderInfoPanels
    save();
  }
  function movePanelPosition(panelId, direction){
    if(!isGuru()) return;
    // direction: -1 = naik satu posisi, +1 = turun satu posisi, di antara panel informasi lain saja
    var idxs = [];
    state.panels.forEach(function(p, i){ if(p.menuId===state.activeMenu && p.type!=='announcement') idxs.push(i); });
    var items = idxs.map(function(i){ return state.panels[i]; });
    var pos = items.findIndex(function(p){ return p.id===panelId; });
    var newPos = pos + direction;
    if(pos<0 || newPos<0 || newPos>=items.length) return;
    var tmp = items[pos]; items[pos] = items[newPos]; items[newPos] = tmp;
    idxs.forEach(function(origIdx, k){ state.panels[origIdx] = items[k]; });
    save();
  }

  // ---- Riwayat pengumuman ----
  function historyItems(){
    return state.panels.filter(function(p){ return p.type==='announcement' && isExpired(p) && panelVisible(p); })
      .sort(function(a, b){ return (b.deadline||'').localeCompare(a.deadline||''); });
  }
  function menuName(id){
    var m = state.menus.find(function(x){ return x.id===id; });
    return m ? m.name : '-';
  }
  function historyModal(){
    var ov = document.createElement('div'); ov.className = 'modal-overlay';
    document.body.appendChild(ov);
    ov.addEventListener('click', function(e){ if(e.target===ov) ov.remove(); });
    function draw(){
      var items = historyItems();
      var list = items.length ? items.map(function(p){
        return '<div class="hist-item">'+
          '<div class="hist-top"><div class="hist-title">'+esc(p.title)+'</div>'+(isGuru()?'<button class="icon-btn" data-delhist="'+p.id+'" title="Hapus dari riwayat">\u00d7</button>':'')+'</div>'+
          (p.body?'<div class="hist-body">'+esc(p.body)+'</div>':'')+
          '<div class="hist-meta"><span class="hist-menu">Menu: '+esc(menuName(p.menuId))+'</span>'+
            '<span>Batas waktu: '+formatDate(p.deadline)+'</span>'+
            (p.createdAt?'<span>Dibuat: '+formatDate(new Date(p.createdAt).toISOString().slice(0,10))+'</span>':'')+
          '</div></div>';
      }).join('') : '<div class="hist-empty">BELUM ADA RIWAYAT PENGUMUMAN<br>Pengumuman yang lewat batas waktu akan tersimpan di sini.</div>';
      ov.innerHTML = '<div class="modal wide"><h4 class="hud-font">RIWAYAT PENGUMUMAN</h4>'+
        '<div class="sub">'+items.length+' pengumuman sudah diumumkan (lewat batas waktu).</div>'+
        '<div class="hist-list">'+list+'</div>'+
        '<div class="modal-actions"><button class="btn" data-close>TUTUP</button></div></div>';
      ov.querySelector('[data-close]').onclick = function(){ ov.remove(); };
      ov.querySelectorAll('[data-delhist]').forEach(function(b){
        b.onclick = function(){
          if(!isGuru()) return;
          if(!confirm('Hapus pengumuman ini dari riwayat secara permanen?')) return;
          var id = b.getAttribute('data-delhist');
          state.panels = state.panels.filter(function(p){ return p.id!==id; });
          save();
          draw();
        };
      });
    }
    draw();
  }

  function settingsModal(){
    if(!isGuru()) return;
    var ov = openModal('KONEKSI MAINFRAME', 'Tempel URL Web App Google Apps Script untuk menyimpan data ke Google Sheets. Kosongkan untuk mode lokal (localStorage saja).',
      [{name:'apiUrl', label:'Apps Script Web App URL', placeholder:'https://script.google.com/macros/s/.../exec', value:config.apiUrl||DEFAULT_API_URL}],
      function(v){
        config.apiUrl = v.apiUrl;
        persistConfig();
        if(hasApi()){ loadFromApi(); } else { syncStatus='local'; render(); }
      }, 'HUBUNGKAN');
    var hint = document.createElement('div');
    hint.className = 'hint';
    hint.innerHTML = 'Deploy skrip Apps Script sebagai Web App (Execute as: Me, Access: Anyone), lalu tempel URL <code>/exec</code> di atas.';
    ov.querySelector('.modal').appendChild(hint);
  }

  function save(){ if(!isGuru()){ render(); return; } render(); persistLocal(); queueSync(); }

  // ---- Login guru ----
  function loginModal(){
    var hdr = {'Content-Type':'text/plain;charset=utf-8'};
    if(hasApi()){
      openModal('MASUK SEBAGAI GURU', 'Kata sandi diperiksa oleh server (Google Apps Script).',
        [{name:'pw', label:'Kata sandi guru', type:'password'}],
        function(v){
          if(!v.pw) return;
          fetch(apiUrl(), {method:'POST', headers:hdr, body:JSON.stringify({action:'login', password:v.pw})})
            .then(function(r){ return r.json(); })
            .then(function(res){
              if(res && res.ok){
                if(res.state && typeof res.state==='object' && res.state.menus){
                  var keep = state.activeMenu;
                  state = normalizeState(res.state);
                  if(keep && state.menus.some(function(m){ return m.id===keep; })) state.activeMenu = keep;
                  persistLocal();
                }
                fullLoaded = true;
                setRole('guru', v.pw);
              }
              else alert('Kata sandi salah, atau Code.gs di server belum diperbarui ke versi yang mendukung peran guru.');
            })
            .catch(function(){ alert('Tidak dapat menghubungi mainframe. Periksa koneksi internet dan URL Web App.'); });
        }, 'MASUK');
    } else if(!config.localPw){
      openModal('BUAT KATA SANDI GURU', 'Mode lokal (belum terhubung ke Apps Script): kata sandi hanya disimpan di browser ini dan tidak mengamankan data dari orang lain yang memakai browser yang sama.',
        [{name:'pw', label:'Kata sandi baru', type:'password'}],
        function(v){
          if(!v.pw) return;
          config.localPw = hashPw(v.pw); persistConfig();
          setRole('guru', '');
        }, 'SIMPAN & MASUK');
    } else {
      openModal('MASUK SEBAGAI GURU', null,
        [{name:'pw', label:'Kata sandi guru', type:'password'}],
        function(v){
          if(hashPw(v.pw||'')===config.localPw){ setRole('guru', ''); }
          else alert('Kata sandi salah.');
        }, 'MASUK');
    }
  }

  render();
  loadFromApi();
  setInterval(function(){
    // murid: ambil data terbaru dari mainframe secara berkala; guru: cukup segarkan tampilan
    if(!isGuru() && hasApi()) loadFromApi(true); else render();
  }, 60 * 1000);
})();
</script>
