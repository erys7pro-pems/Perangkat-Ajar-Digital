<script>
const DS={XI:{k:'XI / F',r:[[1, "11.1 Mengaitkan hubungan antara struktur dan fungsi organel di dalam sel.", "MENJELAJAH SEL", "Mengidentifikasi struktur yang terdapat pada sel tumbuhan tetapi tidak terdapat pada sel darah merah", "L1"], [2, "11.1 Mengaitkan hubungan antara struktur dan fungsi organel di dalam sel.", "MENJELAJAH SEL", "Mengidentifikasi organisme yang memiliki sel tanpa inti bermembran", "L1"], [3, "11.1 Mengaitkan hubungan antara struktur dan fungsi organel di dalam sel.", "MENJELAJAH SEL", "Menentukan urutan jalur sintesis, pemrosesan, dan sekresi protein pada sel eukariotik", "L2"], [4, "11.1 Mengaitkan hubungan antara struktur dan fungsi organel di dalam sel.", "MENJELAJAH SEL", "Menentukan perlakuan enzimatis yang tepat untuk menghilangkan dinding sel tumbuhan sebelum fusi protoplas", "L2"], [5, "11.1 Mengaitkan hubungan antara struktur dan fungsi organel di dalam sel.", "MENJELAJAH SEL", "Menganalisis diagram himpunan unsur penyusun makromolekul untuk menentukan jenis makromolekul dan unsur penyusunnya", "L3"], [6, "11.2 Mekanisme transpor zat (difusi, osmosis, transpor aktif) melalui membran sel.", "PERGERAKAN ZAT MELALUI MEMBRAN SEL", "Mengidentifikasi transpor aktif berdasarkan penggunaan ATP dan perpindahan ion melawan gradien konsentrasi", "L1"], [7, "11.2 Mekanisme transpor zat (difusi, osmosis, transpor aktif) melalui membran sel.", "PERGERAKAN ZAT MELALUI MEMBRAN SEL", "Menjelaskan mekanisme kerja protein carrier dalam memindahkan molekul atau ion melintasi membran", "L1"], [8, "11.2 Mekanisme transpor zat (difusi, osmosis, transpor aktif) melalui membran sel.", "PERGERAKAN ZAT MELALUI MEMBRAN SEL", "Memprediksi perubahan sel darah merah ketika berada dalam larutan hipotonik", "L2"], [9, "11.2 Mekanisme transpor zat (difusi, osmosis, transpor aktif) melalui membran sel.", "PERGERAKAN ZAT MELALUI MEMBRAN SEL", "Disajikan ilustrasi atau skenario kehidupan sehari-hari (misalnya sayuran layu direndam air, daging diasinkan, lintah diberi garam), peserta didik dapat mengidentifikasi proses osmosis yang terjadi dan menjelaskan penyebabnya.", "L2"], [10, "11.2 Mekanisme transpor zat (difusi, osmosis, transpor aktif) melalui membran sel.", "PERGERAKAN ZAT MELALUI MEMBRAN SEL", "Menganalisis perubahan volume larutan gula pada percobaan kentang berdasarkan prinsip osmosis", "L3"], [11, "11.3 Mitosis dan meiosis sebagai dasar pertumbuhan dan pewarisan sifat.", "TAHAP-TAHAP PEMBELAHAN SEL", "Menentukan tahap Profase I saat crossing over terjadi", "L1"], [12, "11.3 Mitosis dan meiosis sebagai dasar pertumbuhan dan pewarisan sifat.", "TAHAP-TAHAP PEMBELAHAN SEL", "Disajikan tabel yang memuat beberapa organ dan jaringan tubuh manusia (misalnya kulit, otot, sumsum tulang, testis, ovarium), peserta didik dapat menentukan organ yang mengalami pembelahan mitosis dan organ yang mengalami meiosis.", "L1"], [13, "11.3 Mitosis dan meiosis sebagai dasar pertumbuhan dan pewarisan sifat.", "TAHAP-TAHAP PEMBELAHAN SEL", "Mengidentifikasi kromosom yang berada pada bidang metafase berdasarkan gambar mikroskop elektron", "L2"], [14, "11.3 Mitosis dan meiosis sebagai dasar pertumbuhan dan pewarisan sifat.", "TAHAP-TAHAP PEMBELAHAN SEL", "Mengurutkan tahapan proses mitosis berdasarkan gambar irisan akar bawang", "L2"], [15, "11.3 Mitosis dan meiosis sebagai dasar pertumbuhan dan pewarisan sifat.", "TAHAP-TAHAP PEMBELAHAN SEL", "Menganalisis data eksperimen FRAP untuk menentukan ujung mikrotubulus kinetokor yang mengalami pemendekan utama selama anafase", "L3"], [16, "11.4 Peran enzim dalam reaksi-reaksi metabolisme di dalam sel.", "ENZIM & METABOLISME SEL", "Menentukan hubungan nilai ΔG dengan spontanitas suatu reaksi", "L1"], [17, "11.4 Peran enzim dalam reaksi-reaksi metabolisme di dalam sel.", "ENZIM & METABOLISME SEL", "Mengidentifikasi proses yang mengubah molekul sederhana hasil pencernaan menjadi energi kimia dalam bentuk ATP", "L1"], [18, "11.4 Peran enzim dalam reaksi-reaksi metabolisme di dalam sel.", "ENZIM & METABOLISME SEL", "Menentukan contoh hubungan reaksi eksergonik dan endergonik melalui peran ATP", "L2"], [19, "11.4 Peran enzim dalam reaksi-reaksi metabolisme di dalam sel.", "ENZIM & METABOLISME SEL", "Menghitung jumlah asam laktat dan net ATP yang dihasilkan dari fermentasi asam laktat sejumlah molekul glukosa", "L2"], [20, "11.4 Peran enzim dalam reaksi-reaksi metabolisme di dalam sel.", "ENZIM & METABOLISME SEL", "Menganalisis hubungan fungsional antara siklus Krebs dan rantai transport elektron dalam respirasi seluler", "L3"], [21, "11.5 Tahap-tahap replikasi DNA serta sintesis protein (transkripsi & translasi).", "REPLIKASI DNA & SINTESIS PROTEIN", "Peserta didik dapat mengidentifikasi komponen dasar penyusun molekul DNA.", "L1"], [22, "11.5 Tahap-tahap replikasi DNA serta sintesis protein (transkripsi & translasi).", "REPLIKASI DNA & SINTESIS PROTEIN", "Disajikan skema replikasi DNA, Mengidentifikasi dan melabeli dengan tepat bagian yang merupakan origin of replication (titik awal replikasi) pada sel prokariotik (E. coli) dan sel eukariotik", "L2"], [23, "11.5 Tahap-tahap replikasi DNA serta sintesis protein (transkripsi & translasi).", "REPLIKASI DNA & SINTESIS PROTEIN", "Siswa mampu menganalisis dan menjelaskan peristiwa yang terjadi pada dua garpu replikasi yang bergerak berlawanan arah, serta mengidentifikasi perbedaan sintesis untai DNA baru pada masing-masing garpu replikasi.", "L2"], [24, "11.5 Tahap-tahap replikasi DNA serta sintesis protein (transkripsi & translasi).", "REPLIKASI DNA & SINTESIS PROTEIN", "Peserta didik dapat mengidentifikasi tahapan (transkripsi atau translasi) yang sesuai dengan deskripsi proses tertentu dalam sintesis protein.", "L2"], [25, "11.5 Tahap-tahap replikasi DNA serta sintesis protein (transkripsi & translasi).", "REPLIKASI DNA & SINTESIS PROTEIN", "Disajikan gambar splicing mRNA oleh spliciosome. Peserta didik dapat menyimpulkan hasil akhir dari proses splicing mRNA yang benar.", "L3"], [26, "11.7 Keterkaitan peran antar-sistem organ pada proses transpor dan pertukaran zat dalam tubuh manusia — sistem pencernaan.", "SISTEM PENCERNAAN", "Peserta didik dapat mengidentifikasi tiga jenis zat gizi makro (karbohidrat, protein, lemak).", "L1"], [27, "11.7 Keterkaitan peran antar-sistem organ pada proses transpor dan pertukaran zat dalam tubuh manusia — sistem pencernaan.", "SISTEM PENCERNAAN", "Mengidentifikasi fungsi hati dalam menghasilkan empedu untuk pencernaan lemak.", "L2"], [28, "11.7 Keterkaitan peran antar-sistem organ pada proses transpor dan pertukaran zat dalam tubuh manusia — sistem pencernaan.", "SISTEM PENCERNAAN", "Menyimpulkan suhu optimum aktivitas enzim pencernaan berdasarkan data percobaan.", "L2"], [29, "11.7 Keterkaitan peran antar-sistem organ pada proses transpor dan pertukaran zat dalam tubuh manusia — sistem pencernaan.", "SISTEM PENCERNAAN", "Disajikan deskripsi seseorang yang mengalami gangguan pada usus halus (misalnya vili usus rusak), peserta didik dapat menentukan zat yang penyerapannya terganggu beserta dampaknya bagi tubuh.", "L2"], [30, "11.7 Keterkaitan peran antar-sistem organ pada proses transpor dan pertukaran zat dalam tubuh manusia — sistem pencernaan.", "SISTEM PENCERNAAN", "Disajikan diagram alur zat makanan dari pencernaan hingga sel tubuh, peserta didik dapat menganalisis keterkaitan sistem pencernaan, peredaran darah, pernapasan, dan ekskresi dalam penyediaan energi bagi sel.", "L3"], [31, "11.8 Keterkaitan peran antar-sistem organ pada proses transpor dan pertukaran zat dalam tubuh manusia — sistem ekskresi.", "SISTEM EKSKRESI", "Menyebutkan organ-organ yang termasuk dalam sistem ekskresi manusia", "L1"], [32, "11.8 Keterkaitan peran antar-sistem organ pada proses transpor dan pertukaran zat dalam tubuh manusia — sistem ekskresi.", "SISTEM EKSKRESI", "Disajikan data kadar glukosa darah dan urine, peserta didik dapat menerapkan konsep reabsorpsi glukosa di tubulus kontortus proksimal untuk menentukan penyebab glukosa muncul dalam urine", "L2"], [33, "11.8 Keterkaitan peran antar-sistem organ pada proses transpor dan pertukaran zat dalam tubuh manusia — sistem ekskresi.", "SISTEM EKSKRESI", "Disajikan kasus perubahan konsentrasi urine, siswa dapat menerapkan fungsi Lengkung Henle untuk menjelaskan perubahan tersebut", "L2"], [34, "11.8 Keterkaitan peran antar-sistem organ pada proses transpor dan pertukaran zat dalam tubuh manusia — sistem ekskresi.", "SISTEM EKSKRESI", "Disajikan kasus gangguan pada alveolus, siswa dapat memprediksi dampaknya terhadap pengeluaran karbon dioksida dan uap air", "L2"], [35, "11.8 Keterkaitan peran antar-sistem organ pada proses transpor dan pertukaran zat dalam tubuh manusia — sistem ekskresi.", "SISTEM EKSKRESI", "Menilai ketepatan kesimpulan eksperimen tentang perubahan massa atau volume sel setelah ditempatkan dalam larutan dengan konsentrasi berbeda, berdasarkan prinsip osmosis.", "L3"]]},XII:{k:'XII / F',r:[[1, "12.1 Menerapkan prinsip pewarisan sifat tentang Hukum Mendel", "HUKUM MENDEL 1 & 2", "Peserta didik dapat menentukan pasangan istilah hereditas (genotipe, fenotipe, homozigot, dominan, alel) dan pengertiannya yang tepat.", "L1"], [2, "12.1 Menerapkan prinsip pewarisan sifat tentang Hukum Mendel", "HUKUM MENDEL 1 & 2", "Peserta didik dapat menentukan pernyataan yang sesuai dengan Hukum Mendel I (segregasi alel secara bebas).", "L1"], [3, "12.1 Menerapkan prinsip pewarisan sifat tentang Hukum Mendel", "HUKUM MENDEL 1 & 2", "Peserta didik dapat menentukan macam gamet yang terbentuk sesuai Hukum Mendel II (pemilihan bebas).", "L2"], [4, "12.1 Menerapkan prinsip pewarisan sifat tentang Hukum Mendel", "HUKUM MENDEL 1 & 2", "Peserta didik dapat menghitung jumlah harapan keturunan dengan fenotipe dan genotipe tertentu.", "L2"], [5, "12.1 Menerapkan prinsip pewarisan sifat tentang Hukum Mendel", "HUKUM MENDEL 1 & 2", "Disajikan kasus perkawinan hewan beserta fenotipe keturunannya, Peserta didik dapat menentukan genotipe induk dan alasannya melalui prinsip uji silang (test cross).", "L2"], [6, "12.1 Menerapkan prinsip pewarisan sifat tentang Hukum Mendel", "HUKUM MENDEL 1 & 2", "Disajikan diagram silsilah (pedigree) suatu sifat, Peserta didik dapat menentukan pola pewarisan, genotipe individu tertentu, dan peluang individu sebagai pembawa.", "L3"], [7, "12.2 Menerapkan prinsip pewarisan sifat tentang penyimpangan semu Hukum Mendel, terutama pada manusia", "PENYIMPANGAN SEMU HUKUM MENDEL PADA MANUSIA", "Disajikan deskripsi pewarisan warna kulit pada manusia, peserta didik dapat menentukan jenis penyimpangan semu hukum Mendel yang terjadi.", "L1"], [8, "12.2 Menerapkan prinsip pewarisan sifat tentang penyimpangan semu Hukum Mendel, terutama pada manusia", "PENYIMPANGAN SEMU HUKUM MENDEL PADA MANUSIA", "Disajikan kasus tuli bawaan pada manusia, peserta didik dapat menentukan penyimpangan yang terjadi.", "L1"], [9, "12.2 Menerapkan prinsip pewarisan sifat tentang penyimpangan semu Hukum Mendel, terutama pada manusia", "PENYIMPANGAN SEMU HUKUM MENDEL PADA MANUSIA", "Disajikan kasus perkawinan dengan golongan darah sistem ABO, Peserta didik dapat menentukan kemungkinan golongan darah anak beserta peluangnya.", "L2"], [10, "12.2 Menerapkan prinsip pewarisan sifat tentang penyimpangan semu Hukum Mendel, terutama pada manusia", "PENYIMPANGAN SEMU HUKUM MENDEL PADA MANUSIA", "Disajikan kasus perkawinan yang melibatkan sifat terpaut kromosom X, Peserta didik dapat menentukan genotipe dan fenotipe anak-anaknya.", "L2"], [11, "12.2 Menerapkan prinsip pewarisan sifat tentang penyimpangan semu Hukum Mendel, terutama pada manusia", "PENYIMPANGAN SEMU HUKUM MENDEL PADA MANUSIA", "Disajikan data perbandingan fenotipe hasil persilangan (misalnya 9:7 atau 12:3:1), peserta didik dapat menentukan jenis penyimpangan semu yang terjadi.", "L2"], [12, "12.2 Menerapkan prinsip pewarisan sifat tentang penyimpangan semu Hukum Mendel, terutama pada manusia", "PENYIMPANGAN SEMU HUKUM MENDEL PADA MANUSIA", "Disajikan data hasil persilangan dua sifat yang menyimpang dari
