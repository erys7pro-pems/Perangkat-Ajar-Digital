<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P.R.I.M.A — Panel Responsif, Belajar Interaktif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050a12;
  --bg-top:#0a1826;
  --bg-grid:#08111c;
  --panel:#0a1622;
  --panel-2:#0d1c2b;
  --cyan:#2be3ff;
  --cyan-dim:#0f7c94;
  --violet:#7b61ff;
  --amber:#ffb020;
  --red:#ff4d5e;
  --text:#d6f2ff;
  --muted:#5b7c95;
  --line:#173347;
  --uf-tint:rgba(123,97,255,.1);
  --uf-base:rgba(10,22,34,.92);
  --header-a:rgba(5,10,18,.97);
  --header-b:rgba(5,10,18,.9);
}
:root[data-theme="light"]{
  --bg:#eef3f8;
  --bg-top:#dbe8f2;
  --bg-grid:#e4edf5;
  --panel:#ffffff;
  --panel-2:#f3f8fc;
  --cyan:#0089ab;
  --cyan-dim:#4fa4bd;
  --violet:#6a4fe0;
  --amber:#b56e00;
  --red:#c93341;
  --text:#0d2436;
  --muted:#5c7488;
  --line:#c9d8e3;
  --uf-tint:rgba(106,79,224,.08);
  --uf-base:rgba(255,255,255,.96);
  --header-a:rgba(255,255,255,.97);
  --header-b:rgba(255,255,255,.88);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse at top, var(--bg-top) 0%, var(--bg) 55%),
    repeating-linear-gradient(0deg, rgba(43,227,255,.025) 0px, rgba(43,227,255,.025) 1px, transparent 1px, transparent 3px);
  color:var(--text);
  font-family:'Share Tech Mono', monospace;
  min-height:100vh;
  overflow-x:hidden;
  transition:background-color .25s,color .25s;
}
.hud-font{font-family:'Orbitron', sans-serif;}

/* scanline sweep, one orchestrated moment on load */
.boot{
  position:fixed;inset:0;background:var(--bg);z-index:999;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;
  animation:bootOut .6s ease 1.4s forwards;
}
.boot-line{font-family:'Orbitron',sans-serif;color:var(--cyan);letter-spacing:.12em;font-size:13px;opacity:0;animation:bootIn .5s ease forwards;text-shadow:0 0 12px rgba(43,227,255,.7);}
.boot-line:nth-child(1){animation-delay:.1s;}
.boot-line:nth-child(2){animation-delay:.5s;}
.boot-line:nth-child(3){animation-delay:.9s;}
@keyframes bootIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
@keyframes bootOut{to{opacity:0;visibility:hidden;pointer-events:none;}}
.boot-ring{width:64px;height:64px;border-radius:50%;border:2px solid var(--cyan-dim);border-top-color:var(--cyan);animation:spin 1s linear infinite;box-shadow:0 0 24px rgba(43,227,255,.35);}
@keyframes spin{to{transform:rotate(360deg);}}

header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg, var(--header-a), var(--header-b));
  border-bottom:1px solid var(--line);
  padding:12px 16px 10px;
}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1100px;margin:0 auto 10px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:26px;height:26px;position:relative;flex-shrink:0;}
.brand-mark svg{width:100%;height:100%;}
.brand h1{font-size:15px;margin:0;letter-spacing:.16em;font-weight:700;color:var(--cyan);text-shadow:0 0 10px rgba(43,227,255,.5);}
.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:.14em;margin-top:1px;}
.status{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);cursor:pointer;padding:6px 10px;border:1px solid var(--line);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);background:var(--panel);}
.status:hover{border-color:var(--cyan-dim);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;}
.dot.online{background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse 2s ease-in-out infinite;}
.dot.local{background:var(--amber);box-shadow:0 0 8px var(--amber);}
.dot.error{background:var(--red);box-shadow:0 0 8px var(--red);}
.dot.sync{background:var(--violet);box-shadow:0 0 8px var(--violet);animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

.menu-row{display:flex;gap:8px;overflow-x:auto;max-width:1100px;margin:0 auto;padding-bottom:2px;}
.menu-tab{
  position:relative;padding:8px 26px 8px 14px;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  white-space:nowrap;cursor:pointer;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.08em;
  clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px);flex-shrink:0;
  transition:color .18s ease, background-color .18s ease, border-color .18s ease, box-shadow .18s ease;
}
.menu-tab.active{color:var(--cyan);border-color:var(--cyan-dim);background:var(--panel-2);box-shadow:inset 0 0 12px rgba(43,227,255,.12);}
.menu-del{position:absolute;right:8px;top:50%;transform:translateY(-50%);opacity:.5;font-size:13px;}
.menu-del:hover{opacity:1;color:var(--red);}
#add-menu-btn{flex-shrink:0;padding:8px 14px;border:1px dashed var(--line);background:transparent;color:var(--muted);cursor:pointer;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.08em;}
#add-menu-btn:hover{color:var(--cyan);border-color:var(--cyan-dim);}

main{padding:20px 16px 60px;max-width:1100px;margin:0 auto;}
.add-panel-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 18px;padding:11px 16px;
  border:1px dashed var(--line);background:transparent;color:var(--muted);cursor:pointer;width:100%;
  font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.1em;
}
.add-panel-btn:hover{color:var(--cyan);border-color:var(--cyan-dim);}
.panels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;}
/* Komposisi panel per baris (diatur guru per menu, baris demi baris). Grid 6 kolom: 1 panel = 6, 2 panel = 3, 3 panel = 2 kolom.
   Tanpa pengaturan, default 3 panel per baris. Layar sempit menyusut otomatis. */
.panels-grid{grid-template-columns:repeat(6,minmax(0,1fr));}
.panels-grid > .panel-card{grid-column:span 2;}
.panels-grid > .panel-card[data-per="1"]{grid-column:span 6;}
.panels-grid > .panel-card[data-per="2"]{grid-column:span 3;}
.panels-grid > .panel-card[data-per="3"]{grid-column:span 2;}
.panels-grid > :not(.panel-card){grid-column:1 / -1;}
@media (max-width:900px){ .panels-grid > .panel-card, .panels-grid > .panel-card[data-per="3"]{grid-column:span 3;} .panels-grid > .panel-card[data-per="1"]{grid-column:span 6;} }
@media (max-width:600px){ .panels-grid > .panel-card, .panels-grid > .panel-card[data-per]{grid-column:1 / -1;} }
.panel-toolbar{display:flex;align-items:stretch;gap:10px;margin:0 0 18px;flex-wrap:wrap;}
.panel-toolbar .add-panel-btn{margin:0;flex:1 1 220px;width:auto;}
.layout-open{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--panel);color:var(--cyan);cursor:pointer;padding:0 14px;min-height:40px;
  font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:.09em;transition:border-color .18s,box-shadow .18s;}
.layout-open:hover{border-color:var(--cyan-dim);box-shadow:0 0 10px rgba(43,227,255,.15);}
.layout-open svg{width:24px;height:16px;display:block;flex-shrink:0;}
.layout-open .lo-sum{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.04em;color:var(--muted);}
@media (max-width:700px){ .layout-open .lo-sum{display:none;} }
.layout-picker{display:flex;align-items:center;gap:2px;border:1px solid var(--line);padding:3px;background:var(--panel);}
.lp-btn{display:flex;align-items:center;justify-content:center;background:none;border:1px solid transparent;color:var(--muted);cursor:pointer;padding:6px 9px;transition:color .18s,background-color .18s,border-color .18s;}
.lp-btn svg{width:24px;height:16px;display:block;}
.lp-btn:hover{color:var(--cyan);}
.lp-btn.active{color:var(--cyan);background:rgba(43,227,255,.1);border-color:var(--cyan-dim);}
.modal.layout-modal{max-width:min(94vw,540px);}
.lm-prev{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin:10px 0 14px;padding:10px;border:1px solid var(--line);background:var(--bg);max-height:190px;overflow-y:auto;}
.lm-prev span{height:22px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--cyan);border:1px solid var(--cyan-dim);background:rgba(43,227,255,.08);}
.lm-row{display:flex;align-items:center;gap:10px;margin:7px 0;flex-wrap:wrap;}
.lm-rl{font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:.08em;color:var(--muted);min-width:138px;}
.lm-row.unused .lm-rl,.lm-row.unused .layout-picker{opacity:.45;}
.lm-hint{font-size:10.5px;color:var(--muted);margin:2px 0 8px;line-height:1.5;}
.lm-sep{border-top:1px solid var(--line);margin:10px 0 6px;}
.lm-add{background:none;border:1px dashed var(--line);color:var(--muted);cursor:pointer;padding:7px 12px;font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:.08em;margin-top:4px;}
.lm-add:hover{color:var(--cyan);border-color:var(--cyan-dim);}

.panel-card{
  background:var(--panel);border:1px solid var(--line);padding:0;position:relative;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
}
.panel-card::before{
  content:'';position:absolute;top:0;left:0;width:100%;height:2px;
  background:linear-gradient(90deg, var(--cyan), transparent 60%);opacity:.6;
}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 10px;border-bottom:1px solid var(--line);}
.panel-head h3{margin:0;font-size:13px;font-family:'Orbitron',sans-serif;letter-spacing:.06em;color:var(--text);}
.icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:2px 6px;line-height:1;}
.icon-btn:hover{color:var(--red);}
.panel-body{padding:4px 14px 12px;}
.sub-card{border-top:1px solid var(--line);padding:10px 0;}
.sub-card:first-child{border-top:none;}
.sub-card img{max-width:100%;display:block;margin-top:8px;border:1px solid var(--line);filter:saturate(.85) contrast(1.05);cursor:zoom-in;}
.sub-title{font-weight:700;font-size:13px;color:var(--text);}
.sub-subtitle{color:var(--muted);font-size:11.5px;margin-top:2px;white-space:pre-line;overflow-wrap:anywhere;line-height:1.5;}
.sub-link{color:var(--cyan);font-size:11.5px;display:inline-block;margin-top:7px;text-decoration:none;border-bottom:1px solid var(--cyan-dim);}
.sub-link:hover{text-shadow:0 0 6px rgba(43,227,255,.6);}
.add-sub-btn{margin-top:8px;font-size:11px;background:none;border:1px dashed var(--line);color:var(--muted);padding:7px 10px;cursor:pointer;font-family:'Orbitron',sans-serif;letter-spacing:.06em;width:100%;}
.add-sub-btn:hover{color:var(--cyan);border-color:var(--cyan-dim);}
.empty{color:var(--muted);text-align:center;padding:60px 20px;font-size:12px;letter-spacing:.04em;border:1px dashed var(--line);grid-column:1/-1;}

/* Announcement (pengumuman) panel variant */
.panel-card.type-announcement{border-color:var(--amber);}
.panel-card.type-announcement::before{background:linear-gradient(90deg, var(--amber), transparent 60%);opacity:.75;}
.panel-card.type-announcement.expired{border-color:var(--line);}
.panel-card.type-announcement.expired::before{background:linear-gradient(90deg, var(--muted), transparent 60%);opacity:.35;}
.new-badge{
  position:absolute;top:-1px;right:14px;background:var(--amber);color:#1a0f00;font-family:'Orbitron',sans-serif;
  font-size:9.5px;font-weight:900;letter-spacing:.08em;padding:3px 9px 4px;
  clip-path:polygon(0 0,100% 0,100% 100%,6px 100%,0 60%);
  box-shadow:0 0 10px rgba(255,176,32,.6);animation:pulse 1.4s ease-in-out infinite;
}
.ann-body{font-size:12.5px;line-height:1.6;color:var(--text);white-space:pre-wrap;}
.ann-meta{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:10.5px;letter-spacing:.03em;}
.hf-row{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
.hf-btn{font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.06em;color:var(--amber);background:transparent;border:1px solid var(--amber);padding:7px 14px;cursor:pointer;}
.hf-btn:hover:not(:disabled){background:rgba(255,176,32,.1);box-shadow:0 0 10px rgba(255,176,32,.2);}
.hf-btn:disabled{cursor:default;}
.hf-btn.done{color:var(--cyan);border-color:var(--cyan-dim);}
.hf-count{font-size:11px;color:var(--muted);letter-spacing:.03em;}
.hf-admin-btn.active{color:var(--amber);}
.status-pill{font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:.07em;padding:3px 8px;border:1px solid var(--cyan-dim);color:var(--cyan);}
.status-pill.expired{border-color:var(--line);color:var(--muted);}
.ann-deadline{color:var(--muted);}
.panel-type-tag{font-size:9px;color:var(--muted);letter-spacing:.06em;font-family:'Orbitron',sans-serif;}

/* Type chooser modal */
.type-choice{display:flex;gap:10px;margin-top:4px;}
.type-choice button{
  flex:1;padding:16px 10px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer;
  font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.05em;display:flex;flex-direction:column;gap:6px;align-items:center;
}
.type-choice button:hover{border-color:var(--cyan);color:var(--cyan);}
.type-choice .ico{font-size:20px;}
.modal textarea{width:100%;box-sizing:border-box;max-width:100%;padding:9px 10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:13px;font-family:'Share Tech Mono',monospace;resize:vertical;min-height:70px;}
.modal textarea:focus{outline:none;border-color:var(--cyan);}
.modal input[type="date"]{color-scheme:dark;}
:root[data-theme="light"] .modal input[type="date"]{color-scheme:light;}

/* Drag & drop */
.drag-handle{cursor:grab;color:var(--muted);font-size:15px;padding:6px 8px;user-select:none;touch-action:none;flex-shrink:0;line-height:1;}
.drag-handle:hover{color:var(--cyan);}
.drag-handle:active{cursor:grabbing;}
.move-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;padding:4px 5px;line-height:1;}
.move-btn:hover{color:var(--cyan);}
.move-btn:disabled{opacity:.25;cursor:default;}
.move-btn:disabled:hover{color:var(--muted);}
.panel-head-right{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.panel-head-left{display:flex;align-items:center;gap:6px;min-width:0;}
.panel-head-left h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.panel-card.type-info.dragging{opacity:.35;}
.panel-card.type-info.drag-over{outline:2px dashed var(--cyan);outline-offset:-3px;}
.sub-card{position:relative;}
.sub-card.dragging{opacity:.35;}
.sub-card.drag-over{outline:2px dashed var(--cyan);outline-offset:-2px;}
.sub-head-left{display:flex;align-items:flex-start;gap:6px;min-width:0;}
.sub-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}

.view-subs-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 10px;margin-top:8px;
  border:1px solid var(--cyan-dim);background:transparent;color:var(--cyan);cursor:pointer;width:100%;
  font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.07em;
}
.view-subs-btn:hover{background:rgba(43,227,255,.08);box-shadow:0 0 10px rgba(43,227,255,.15);}
.empty-hint{color:var(--muted);font-size:11px;text-align:center;padding:10px 0;}
.modal.subpanel-modal{max-width:min(94vw, 900px);}
.sp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
.sp-title{min-width:0;flex:1 1 200px;}
.sp-head .modal-actions{margin-top:0;flex-shrink:0;}
.subs-row{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;margin-top:2px;}
.sub-tile{flex:0 0 230px;border:1px solid var(--line);padding:10px;}
.sub-tile:first-child{border-top:1px solid var(--line);}
.sub-tile-move{display:flex;justify-content:flex-end;gap:2px;margin-top:8px;border-top:1px solid var(--line);padding-top:6px;}

@keyframes ov-fade-in{from{background-color:rgba(2,5,8,0);backdrop-filter:blur(0px);}to{background-color:rgba(2,5,8,.75);backdrop-filter:blur(2px);}}
@keyframes modal-pop-in{from{opacity:0;transform:scale(.94) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal-overlay{position:fixed;inset:0;background:rgba(2,5,8,.75);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;animation:ov-fade-in .16s ease;}
.modal-overlay.closing{background-color:rgba(2,5,8,0);backdrop-filter:blur(0px);transition:background-color .18s ease, backdrop-filter .18s ease;}
.modal-overlay .modal,.modal-overlay .lightbox-wrap{animation:modal-pop-in .2s cubic-bezier(.22,.9,.32,1.1);transition:transform .16s ease, opacity .16s ease;}
.modal-overlay.closing .modal,.modal-overlay.closing .lightbox-wrap{opacity:0;transform:scale(.95) translateY(8px);}
@keyframes reactor-pulse{0%,100%{opacity:.82;}50%{opacity:1;}}
.brand-mark .reactor-core{animation:reactor-pulse 2.4s ease-in-out infinite;transform-origin:20px 20px;}
@keyframes grid-switch-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.panels-grid.menu-switch{animation:grid-switch-in .24s cubic-bezier(.22,.9,.32,1.1);}
@keyframes app-switch-in{from{opacity:0;transform:translateY(5px) scale(.996);}to{opacity:1;transform:translateY(0) scale(1);}}
#app.role-switch{animation:app-switch-in .32s cubic-bezier(.22,.9,.32,1.1);}
@media (prefers-reduced-motion: reduce){
  .toast{animation:none !important;}
  .menu-ring circle{animation:none !important;}
  .modal-overlay,.modal-overlay .modal,.modal-overlay .lightbox-wrap{animation:none !important;transition:none !important;}
  .menu-tab{transition:none !important;}
  .panels-grid.menu-switch{animation:none !important;}
  .lp-btn,.layout-open{transition:none !important;}
  #app.role-switch{animation:none !important;}
  .brand-mark .reactor-core{animation:none !important;}
}
.lightbox-overlay{background:rgba(2,5,8,.92);z-index:200;}
.lightbox-overlay.closing{background-color:rgba(2,5,8,0) !important;}
.lightbox-wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;}
.lightbox-toolbar{display:flex;gap:8px;}
.lb-btn{font-family:'Orbitron',sans-serif;font-size:13px;letter-spacing:.05em;color:var(--cyan);background:var(--panel);border:1px solid var(--cyan-dim);padding:6px 14px;cursor:pointer;min-width:40px;}
.lb-btn:hover{background:rgba(43,227,255,.1);}
.lb-close{color:var(--red);border-color:var(--red);}
.lightbox-view{overflow:hidden;width:96vw;height:86vh;display:flex;align-items:center;justify-content:center;touch-action:none;}
.lightbox-img{max-width:96vw;max-height:86vh;transition:transform .05s linear;user-select:none;}
.modal{
  background:var(--panel-2);border:1px solid var(--cyan-dim);padding:22px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto;
  box-shadow:0 0 40px rgba(43,227,255,.12);clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
}
.modal h4{margin:0 0 4px;font-family:'Orbitron',sans-serif;font-size:14px;letter-spacing:.08em;color:var(--cyan);}
.modal .sub{font-size:11px;color:var(--muted);margin-bottom:6px;}
.modal label{display:block;font-size:10.5px;color:var(--muted);margin:12px 0 5px;letter-spacing:.06em;font-family:'Orbitron',sans-serif;}
.modal input{width:100%;padding:9px 10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:13px;font-family:'Share Tech Mono',monospace;}
.modal input:focus{outline:none;border-color:var(--cyan);}
.modal-actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;}
.btn{padding:9px 16px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.06em;}
.btn:hover{color:var(--text);border-color:var(--muted);}

/* Riwayat pengumuman */

.hist-count{background:var(--amber);color:#1a0f00;font-weight:900;padding:1px 6px;font-size:9px;min-width:16px;text-align:center;}
.modal.wide{max-width:560px;}
.hist-list{margin-top:10px;}
.hist-item{border-top:1px solid var(--line);padding:12px 0;}

.hist-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.hist-title{font-family:'Orbitron',sans-serif;font-size:12.5px;letter-spacing:.04em;color:var(--text);}
.hist-body{font-size:12px;line-height:1.6;color:var(--muted);white-space:pre-wrap;margin-top:6px;}
.hist-meta{font-size:10.5px;color:var(--muted);margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 12px;}

.hist-empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:12px;border:1px dashed var(--line);margin-top:10px;}
/* Peran guru / murid */
.header-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
.role-pill{font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:.07em;padding:5px 8px;border:1px solid var(--line);color:var(--muted);}
.role-pill.active{color:var(--violet);border-color:var(--violet);box-shadow:0 0 8px rgba(123,97,255,.25);}
.role-btn{font-family:'Orbitron',sans-serif;font-size:9.5px;letter-spacing:.07em;color:var(--cyan);cursor:pointer;padding:6px 10px;border:1px solid var(--line);background:var(--panel);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);}
.role-btn:hover{border-color:var(--cyan-dim);box-shadow:0 0 10px rgba(43,227,255,.2);}
.status.readonly{cursor:default;}
.status.readonly:hover{border-color:var(--line);}
/* Tombol segitiga 3-warna: biru = murid, ungu = petugas, kuning = hanya guru */
.vis-tri{position:relative;display:inline-block;vertical-align:middle;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid var(--cyan);cursor:pointer;flex-shrink:0;filter:drop-shadow(0 0 5px rgba(43,227,255,.75));transition:filter .15s,border-bottom-color .15s;}

.vis-tri.staff{border-bottom-color:var(--violet);filter:drop-shadow(0 0 5px rgba(123,97,255,.8));}
.vis-tri.staff:hover{filter:drop-shadow(0 0 9px rgba(123,97,255,1));}
.vis-tri.teacher{border-bottom-color:var(--amber);filter:drop-shadow(0 0 5px rgba(255,176,32,.8));}

.vis-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:10.5px;color:var(--muted);margin:0 0 14px;letter-spacing:.02em;}

/* Label BARU! inline + feed pembaruan otomatis */
.new-tag{display:inline-block;flex-shrink:0;margin-left:7px;background:var(--amber);color:#1a0f00;font-family:'Orbitron',sans-serif;font-size:8.5px;font-weight:900;letter-spacing:.06em;padding:2px 6px 2px;line-height:1.3;vertical-align:middle;box-shadow:0 0 8px rgba(255,176,32,.55);animation:pulse 1.4s ease-in-out infinite;clip-path:polygon(0 0,100% 0,100% 100%,4px 100%,0 65%);}
.update-feed{border:1px solid var(--violet);background:linear-gradient(180deg,var(--uf-tint),var(--uf-base));margin:0 0 16px;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);}
.uf-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:10px 14px 8px;border-bottom:1px solid var(--line);}

/* menyala 2 kali: puncak di 18% dan 68%, redup di 43% */
@keyframes flashCard{0%,43%,100%{box-shadow:none;}18%,68%{box-shadow:inset 0 0 0 2px var(--violet),inset 0 0 34px rgba(123,97,255,.4);}}
/* Geser menu (guru) */
.menu-tab{user-select:none;}
/* Dropdown & notifikasi kecil */
.modal select{width:100%;padding:9px 10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:13px;font-family:'Share Tech Mono',monospace;}
.modal select:focus{outline:none;border-color:var(--cyan);}
.field-hint{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5;}
.field-hint.warn{color:var(--amber);}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:300;display:flex;align-items:center;gap:14px;max-width:min(92vw,560px);padding:11px 16px;background:var(--panel);border:1px solid var(--cyan-dim);color:var(--text);font-size:12.5px;line-height:1.45;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);animation:toastIn .24s cubic-bezier(.22,.9,.32,1.1);}
.toast.out{opacity:0;transform:translateX(-50%) translateY(8px);transition:opacity .2s,transform .2s;}
.toast-act{flex-shrink:0;font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:.08em;color:var(--cyan);background:transparent;border:1px solid var(--cyan-dim);padding:6px 10px;cursor:pointer;}

/* Status ring di pojok kanan atas tab menu: oranye = pengumuman baru, biru = panel baru */
:root{--ring-ann:var(--amber);--ring-pan:var(--cyan);}
.menu-ring{position:absolute;top:3px;right:3px;width:13px;height:13px;pointer-events:none;line-height:0;}

.menu-ring circle{animation:ringPulse 2.4s ease-in-out infinite;}
@keyframes ringPulse{0%,100%{opacity:.72;}50%{opacity:1;}}
.menu-tab.has-ring .menu-del{top:calc(50% + 4px);}
.menu-tab[draggable="true"]{cursor:grab;}

.menu-move{display:inline-block;margin-left:6px;padding:0 3px;font-size:9px;line-height:1;opacity:.65;cursor:pointer;}

.rel-btn{flex-shrink:0;display:inline-block;margin-left:7px;background:none;border:1px solid var(--violet);color:var(--violet);font-family:'Orbitron',sans-serif;font-size:8.5px;letter-spacing:.06em;padding:2px 7px;line-height:1.4;cursor:pointer;vertical-align:middle;}

.rel-item{display:flex;align-items:flex-start;gap:10px;border-top:1px solid var(--line);padding:11px 0;}

.rel-kind{flex-shrink:0;font-family:'Orbitron',sans-serif;font-size:8.5px;letter-spacing:.06em;color:var(--violet);border:1px solid var(--violet);padding:2px 6px;margin-top:2px;}

/* Tombol daftar menu saat tab menu tidak muat */
.menu-wrap{display:flex;align-items:stretch;gap:8px;max-width:1100px;margin:0 auto;}
.menu-wrap .menu-row{flex:1;min-width:0;max-width:none;margin:0;}

.menu-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:60vh;overflow-y:auto;}
.menu-list-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.06em;}
.menu-list-item:hover{border-color:var(--cyan-dim);color:var(--cyan);}
.menu-list-item.active{border-color:var(--cyan);color:var(--cyan);background:rgba(43,227,255,.08);}
.menu-list-item .ml-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.menu-list-item .ml-sfx{font-size:9px;color:var(--amber);}
.menu-list-item .ml-new{font-size:9px;color:var(--violet);border:1px solid var(--violet);padding:1px 6px;}

/* Sub-panel di pop-up panel: grid 6 kolom, jumlah per baris diatur guru (panel.subRows / panel.subCols) */
.subs-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;overflow:visible;}
.subs-row > .sub-tile{flex:none;min-width:0;grid-column:span 2;}

.subs-row > .sub-tile[data-per="2"]{grid-column:span 3;}
.subs-row > .sub-tile[data-per="3"]{grid-column:span 2;}
.subs-row > .empty-hint{grid-column:1 / -1;}
@media (max-width:700px){ .subs-row > .sub-tile, .subs-row > .sub-tile[data-per="3"]{grid-column:span 3;} .subs-row > .sub-tile[data-per="1"]{grid-column:span 6;} }
@media (max-width:520px){ .subs-row > .sub-tile, .subs-row > .sub-tile[data-per]{grid-column:1 / -1;} }

/* Pindahkan sub-panel (pilih menu -> pilih panel) */
.sub-tile-move .move-btn.mv-to{width:auto;padding:0 9px;margin-right:auto;font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:.06em;}
.mv-steps{display:flex;gap:8px;align-items:center;margin:12px 0 4px;font-family:'Orbitron',sans-serif;font-size:9.5px;letter-spacing:.08em;color:var(--muted);}
.mv-steps .cur{color:var(--cyan);} .mv-steps .done{color:var(--cyan-dim);}

.mv-sum{margin-top:12px;font-size:11.5px;line-height:1.5;border:1px solid var(--cyan-dim);padding:8px 10px;background:rgba(43,227,255,.06);}
.mv-sum:empty{display:none;}
.mv-warn{color:var(--amber);margin-top:4px;}

.panel-head h3.title-link{cursor:pointer;transition:color .15s;}
.panel-head h3.title-link:hover{color:var(--cyan);text-decoration:underline;text-underline-offset:4px;}
.panel-head h3.title-link:focus-visible{outline:1px solid var(--cyan);outline-offset:3px;}

/* Pencarian panel & sub-panel (di bawah tombol Tambah Panel) */
.gsearch{margin:0 0 18px;}
.gsearch-box{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);padding:0 12px;min-height:42px;}
.gsearch-box:focus-within{border-color:var(--cyan-dim);box-shadow:0 0 10px rgba(43,227,255,.15);}

.ann-img{display:block;max-width:100%;max-height:260px;margin-top:10px;border:1px solid var(--line);object-fit:contain;cursor:zoom-in;}

.vs-btn{font-family:'Orbitron',sans-serif;font-size:10.5px;letter-spacing:.1em;padding:8px 16px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;}

.vs-btn.active{color:var(--cyan);border-color:var(--cyan-dim);background:rgba(43,227,255,.1);box-shadow:inset 0 -2px 0 var(--cyan);}

<script>
(function(){
  // Guru: isi URL Web App Apps Script di bawah ini sebelum file dibagikan ke murid,
  // supaya murid otomatis terhubung tanpa perlu mengatur apa pun.
  var DEFAULT_API_URL = '';

  var STORAGE_KEY = 'papan-panel-state-v1';
  var CONFIG_KEY = 'papan-panel-config-v1';
  var defaultState = {menus:[{id:'m1', name:'Umum'}], activeMenu:'m1', panels:[]};
  var state = normalizeState(loadState());
  var config = loadConfig();
  var syncStatus = 'idle'; // idle | local | online | syncing | error
  var syncTimer = null;

  // ---- Peran: 'murid' (hanya lihat), 'petugas' (lihat item yang diizinkan), atau 'guru' (bisa mengubah semua) ----
  var role = 'murid';
  var lastActiveMenu = null; // dipakai render() untuk mendeteksi perpindahan tab menu, agar grid panel dianimasikan hanya saat benar-benar pindah menu
  var lastRole = null; // dipakai render() untuk mendeteksi login/logout guru & petugas, agar seluruh tampilan beranimasi halus saat peran berganti
  var actorPw = ''; // kata sandi guru ATAU petugas, tergantung peran saat ini
  try{
    var savedRole = sessionStorage.getItem('papan-panel-role');
    if(savedRole==='guru' || savedRole==='petugas'){
      role = savedRole;
      actorPw = sessionStorage.getItem('papan-panel-pw') || '';
    }
  }catch(e){}
  function isGuru(){ return role==='guru'; }
  function isPetugas(){ return role==='petugas'; }

  // ---- Mode gelap/terang ----
  var THEME_KEY = 'papan-panel-theme';
  var theme = 'dark';
  try{ var savedTheme = localStorage.getItem(THEME_KEY); if(savedTheme==='light'||savedTheme==='dark') theme = savedTheme; }catch(e){}
  function applyTheme(){ document.documentElement.setAttribute('data-theme', theme); }
  applyTheme();
  function toggleTheme(){
    theme = theme==='dark' ? 'light' : 'dark';
    applyTheme();
    try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
    render();
  }
  var fullLoaded = false; // true jika state di memori adalah data lengkap (bukan versi yang sudah disaring untuk peran ini)
  var serverRev = 0;      // nomor versi data di server saat terakhir dimuat/disimpan; dikirim saat menyimpan untuk mendeteksi penimpaan dari sesi lain
  var loadEpoch = 0;      // penghitung permintaan muat; respons yang bukan yang terbaru (atau beda peran) dianggap usang & diabaikan
  var pushing = false, pushAgain = false, forceNextPush = false, conflictOpen = false;
  var JSON_HDR = {'Content-Type':'text/plain;charset=utf-8'}; // avoids CORS preflight on Apps Script

  // ---- Visibilitas 3 jalur: setiap item punya SATU pemilik akses -----
  // 'student' (biru, murid) | 'staff' (ungu, petugas) | 'teacher' (kuning, hanya guru)
  // Item ITU dan SEMUA induknya harus termasuk akses yang diizinkan untuk peran penonton.
  // Murid diizinkan: biru saja. Petugas diizinkan: biru + ungu (petugas tetap dianggap murid).
  function itemAccess(item){ return item.access || (item.hidden ? 'teacher' : 'student'); }
  // Petugas juga murid: boleh lihat item biru (murid) DAN ungu (petugas). Murid hanya biru.
  function viewerAllowedAccess(){ return isPetugas() ? ['student','staff'] : ['student']; } // hanya relevan saat bukan guru
  function menuVisible(id){
    if(isGuru()) return true;
    var m = state.menus.find(function(x){ return x.id===id; });
    return !!m && viewerAllowedAccess().indexOf(itemAccess(m))!==-1;
  }
  function panelVisible(p){ return isGuru() || (viewerAllowedAccess().indexOf(itemAccess(p))!==-1 && menuVisible(p.menuId)); }
  var ACCESS_LABEL = {student:'BIRU: murid (petugas ikut lihat)', staff:'UNGU: khusus petugas', teacher:'KUNING: hanya guru'};
  var ACCESS_NEXT = {student:'staff', staff:'teacher', teacher:'student'};
  function visToggle(kind, id, access, panelId){
    access = access || 'student';
    return '<span class="vis-tri'+(access!=='student'?' '+access:'')+'" role="button" data-vis="'+kind+'" data-id="'+id+'"'+(panelId?' data-panel="'+panelId+'"':'')+
      ' title="'+ACCESS_LABEL[access]+' (klik untuk ganti ke '+ACCESS_LABEL[ACCESS_NEXT[access]]+')"></span>';
  }
  // ---- Label BARU! & feed pembaruan (3 hari sejak item dibuat / mulai tampil ke murid) ----
  function inNewWindow(ts){ return !!ts && (Date.now() - ts) < NEW_BADGE_DURATION_MS; }
  function newTag(ts, eff){ return (eff && inNewWindow(ts)) ? '<span class="new-tag">BARU!</span>' : ''; }
  function menuById(id){ return state.menus.find(function(m){ return m.id===id; }); }
  function panelEff(p){ var m = menuById(p.menuId); return !!m && itemAccess(m)==='student' && itemAccess(p)==='student'; } // benar-benar bisa dilihat murid
  function timeLeft(ts){
    var h = Math.max(1, Math.ceil((ts + NEW_BADGE_DURATION_MS - Date.now()) / 3600000));
    return h>=24 ? Math.ceil(h/24)+' hari lagi' : h+' jam lagi';
  }
  var SAME_SESSION_MS = 60 * 60 * 1000; // anak yang dibuat <1 jam setelah induknya tidak dibuatkan baris sendiri
  function updateItems(){
    var items = [];
    state.menus.forEach(function(m){
      if(itemAccess(m)==='student' && inNewWindow(m.newAt)) items.push({kind:'menu', ts:m.newAt, title:m.name, menuId:m.id});
    });
    state.panels.forEach(function(p){
      if(p.type==='announcement' || !panelEff(p)) return; // pengumuman biasa sudah punya label BARU! sendiri
      var m = menuById(p.menuId);
      if(inNewWindow(p.newAt) && !(m.newAt && p.newAt - m.newAt < SAME_SESSION_MS)){
        items.push({kind:'panel', ts:p.newAt, title:p.title, where:'di menu '+m.name, menuId:m.id, panelId:p.id});
      }
      (p.subpanels||[]).forEach(function(sp){
        if(itemAccess(sp)!=='student' || !inNewWindow(sp.newAt)) return;
        if(p.newAt && sp.newAt - p.newAt < SAME_SESSION_MS) return;
        items.push({kind:'sub', ts:sp.newAt, title:sp.title, where:'di panel '+p.title+' · menu '+m.name, menuId:m.id, panelId:p.id});
      });
    });
    return items.sort(function(a, b){ return b.ts - a.ts; });
  }
  function updateFeedHtml(){
    var items = updateItems();
    if(!items.length) return '';
    var labels = {menu:'MENU BARU', panel:'PANEL BARU', sub:'SUB-PANEL BARU'};
    var rows = items.map(function(it){
      return '<div class="uf-item" data-goto-menu="'+it.menuId+'"'+(it.panelId?' data-goto-panel="'+it.panelId+'"':'')+'>'+
        '<span class="uf-kind">'+labels[it.kind]+'</span>'+
        '<span class="uf-text"><span class="uf-strong">'+esc(it.title)+'</span>'+(it.where?'<span class="uf-where"> · '+esc(it.where)+'</span>':'')+'</span>'+
        '<span class="uf-left">'+timeLeft(it.ts)+'</span></div>';
    }).join('');
    return '<div class="update-feed"><div class="uf-head"><div class="uf-title hud-font">PEMBARUAN</div>'+
      '<div class="uf-sub">Otomatis dari menu, panel &amp; sub-panel baru · berlaku 3 hari</div></div>'+
      '<div class="uf-list">'+rows+'</div></div>';
  }
  function goToItem(menuId, panelId){
    state.activeMenu = menuId; render(); persistLocal();
    if(panelId){
      var el = document.querySelector('.panel-card[data-pid="'+panelId+'"]');
      if(el){ el.scrollIntoView({behavior:'smooth', block:'center'}); el.classList.add('flash'); setTimeout(function(){ el.classList.remove('flash'); }, 2500); }
    }
  }

  function toggleVisibility(kind, id, panelId){
    if(!isGuru()) return;
    var item = null;
    if(kind==='menu') item = state.menus.find(function(m){ return m.id===id; });
    else if(kind==='panel') item = state.panels.find(function(p){ return p.id===id; });
    else { var pp = state.panels.find(function(x){ return x.id===panelId; }); item = pp && pp.subpanels.find(function(x){ return x.id===id; }); }
    if(!item) return;
    var next = ACCESS_NEXT[itemAccess(item)];
    item.access = next;
    delete item.hidden;
    if(next==='student') item.newAt = Date.now(); // baru diizinkan dilihat murid -> dianggap baru lagi
    save();
  }
  function setRole(r, pw){
    role = r; actorPw = pw || '';
    loadEpoch++; // respons muat yang masih di perjalanan milik peran sebelumnya -> usang
    if(r==='murid') fullLoaded = false;
    try{
      if(r==='guru' || r==='petugas'){ sessionStorage.setItem('papan-panel-role', r); sessionStorage.setItem('papan-panel-pw', actorPw); }
      else { sessionStorage.removeItem('papan-panel-role'); sessionStorage.removeItem('papan-panel-pw'); }
    }catch(e){}
    render();
  }
  function hashPw(str){ var h=5381; for(var i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))|0; } return String(h); }

  // Migrasi: panel yang dibuat versi file lama belum punya field "type"/"subpanels".
  // Tanpa ini, filter berbasis type==='info' akan mengabaikan panel lama tsb sepenuhnya
  // sehingga tombol panah & drag terlihat tidak merespons pada panel-panel tersebut.
  function normalizeState(s){
    if(s){
      (s.menus||[]).forEach(function(m){ m.access = itemAccess(m); delete m.hidden; });
      if(Array.isArray(s.panels)){
        s.panels.forEach(function(p){
          if(p.type !== 'announcement') p.type = 'info';
          if(!Array.isArray(p.subpanels)) p.subpanels = [];
          p.access = itemAccess(p); delete p.hidden;
          p.subpanels.forEach(function(sp){ sp.access = itemAccess(sp); delete sp.hidden; });
        });
      }
    }
    return s;
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){ console.error(e); }
    return JSON.parse(JSON.stringify(defaultState));
  }
  function loadConfig(){
    try{
      var raw = localStorage.getItem(CONFIG_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return {apiUrl:''};
  }
  function persistLocal(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ console.error(e); }
  }
  function persistConfig(){
    try{ localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); }catch(e){}
  }

  function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
  function esc(s){ return (s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // ---- Pengumuman: label "BARU!" hilang otomatis setelah 3 hari ----
  var NEW_BADGE_DURATION_MS = 3 * 24 * 60 * 60 * 1000;
  function isFresh(p){
    var ts = p.newAt || p.createdAt; // newAt di-reset saat item diubah jadi tampil ke murid
    if(!ts) return false;
    return (Date.now() - ts) < NEW_BADGE_DURATION_MS;
  }
  function isExpired(p){
    if(!p.deadline) return false;
    // deadline disimpan sebagai 'YYYY-MM-DD'; anggap berakhir di akhir hari itu
    var end = new Date(p.deadline+'T23:59:59').getTime();
    return Date.now() > end;
  }
  function formatDate(dstr){
    if(!dstr) return '';
    var d = new Date(dstr+'T00:00:00');
    if(isNaN(d.getTime())) return dstr;
    var bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    return d.getDate()+' '+bulan[d.getMonth()]+' '+d.getFullYear();
  }

  // ---- Google Apps Script sync layer ----
  function apiUrl(){ return ((config.apiUrl||'').trim()) || (DEFAULT_API_URL||'').trim(); }
  function hasApi(){ return !!apiUrl(); }

  // Guru memuat data LENGKAP; petugas memuat versi yang sudah disaring server (hanya item akses "petugas");
  // murid memuat lewat GET (server sudah membuang item yang bukan akses "murid").
  function fetchState(){
    if(isGuru() || isPetugas()){
      var act = isGuru() ? 'load' : 'load_staff';
      return fetch(apiUrl(), {method:'POST', headers:JSON_HDR, body:JSON.stringify({action:act, password:actorPw})})
        .then(function(r){ return r.json(); })
        .then(function(res){
          if(res && res.error==='unauthorized') throw {unauthorized:true};
          if(res && res.ok && res.state) return res.state;
          throw new Error((res && res.error) || 'Gagal memuat data');
        });
    }
    return fetch(apiUrl(), {method:'GET'}).then(function(r){ return r.json(); });
  }

  function loadFromApi(silent){
    if(!hasApi()){ syncStatus='local'; render(); return; }
    if(!silent){ syncStatus='syncing'; render(); }
    var reqRole = role, myEpoch = ++loadEpoch;
    fetchState()
      .then(function(data){
        // Respons usang: peran sudah berganti (mis. murid -> guru) atau ada permintaan yang lebih baru.
        // Menerapkannya akan mengganti data lengkap guru dengan data tersaring lalu menimpa server.
        if(myEpoch!==loadEpoch || reqRole!==role) return;
        // Jangan menimpa perubahan guru yang belum sempat tersimpan.
        if(reqRole==='guru' && fullLoaded && syncPending()) return;
        if(data && data.error && !data.menus){ syncStatus='error'; render(); return; }
        if(data && typeof data==='object' && data.menus){
          var fresh = normalizeState(data);
          serverRev = Number(fresh.rev)||0; delete fresh.rev;
          var keep = state.activeMenu; // menu aktif bersifat lokal per pengguna
          state = fresh;
          // Data lengkap hanya jika permintaan DIKIRIM sebagai guru (petugas & murid selalu menerima versi tersaring).
          fullLoaded = (reqRole==='guru');
          if(keep && state.menus.some(function(m){ return m.id===keep; })) state.activeMenu = keep;
          persistLocal();
        }
        syncStatus='online';
        render();
      })
      .catch(function(err){
        if(myEpoch!==loadEpoch || reqRole!==role) return;
        if(err && err.unauthorized){
          alert('Sesi '+(isGuru()?'guru':'petugas')+' tidak valid (kata sandi ditolak server). Kamu dikembalikan ke mode murid.');
          setRole('murid');
          loadFromApi();
          return;
        }
        console.error('Gagal memuat dari mainframe:', err);
        syncStatus='error';
        if(silent) renderStatusOnly(); else render();
      });
  }

  // Ada perubahan guru yang menunggu dikirim / sedang dikirim?
  function syncPending(){ return !!syncTimer || pushing; }

  // Guru: cek ringan apakah data di server berubah dari sesi lain; bila ya dan tidak ada perubahan lokal, muat ulang.
  function checkServerRev(){
    if(!isGuru() || !hasApi() || !fullLoaded || syncPending()) return;
    if(document.querySelector('.modal-overlay')) return; // jangan mengganti data saat guru sedang mengisi formulir
    fetch(apiUrl()+(apiUrl().indexOf('?')===-1?'?':'&')+'rev=1', {method:'GET'})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d && typeof d.rev==='number' && d.rev!==serverRev && isGuru() && !syncPending() && !document.querySelector('.modal-overlay')) loadFromApi(true);
      })
      .catch(function(){});
  }

  function pushToApi(){
    if(!hasApi() || !isGuru()) return;
    if(!fullLoaded){ // jangan menimpa server dengan data yang belum lengkap
      syncStatus='error'; renderStatusOnly(); return;
    }
    if(pushing){ pushAgain = true; return; } // satu pengiriman pada satu waktu agar nomor versi tidak bentrok dengan diri sendiri
    pushing = true;
    var force = forceNextPush; forceNextPush = false;
    syncStatus='syncing'; renderStatusOnly();
    function done(){ pushing = false; if(pushAgain){ pushAgain = false; pushToApi(); } }
    fetch(apiUrl(), {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // avoids CORS preflight on Apps Script
      body: JSON.stringify({action:'save', password:actorPw, state:state, baseRev:serverRev, force:force})
    })
      .then(function(r){ return r.json(); })
      .then(function(res){
        if(res && res.error==='unauthorized'){
          pushing = false; pushAgain = false;
          alert('Sesi guru tidak valid (kata sandi ditolak server). Kamu dikembalikan ke mode murid.');
          setRole('murid');
          loadFromApi();
          return;
        }
        if(res && res.ok){ serverRev = res.rev; syncStatus='online'; renderStatusOnly(); done(); return; }
        syncStatus='error'; renderStatusOnly();
        if(res && res.error==='conflict'){ pushAgain = false; pushing = false; handleSyncConflict(); return; }
        if(res && res.error==='outdated_client'){ pushAgain = false; pushing = false; alert('Halaman ini versi lama dan ditolak server demi keamanan data. Muat ulang halaman (Ctrl+F5), lalu ulangi perubahanmu.'); return; }
        if(res && res.error==='too_large'){ pushAgain = false; pushing = false; alert('Data terlalu besar untuk disimpan. Hapus sebagian isi (mis. teks/gambar yang tidak terpakai).'); return; }
        done();
      })
      .catch(function(err){
        console.error('Gagal menyimpan ke mainframe:', err);
        syncStatus='error';
        renderStatusOnly();
        done();
      });
  }

  // Server menolak karena data di server sudah berubah sejak terakhir dimuat (sesi/perangkat lain).
  function handleSyncConflict(){
    if(conflictOpen) return;
    conflictOpen = true;
    function release(){ conflictOpen = false; }
    var ov = openChoice('DATA DI SERVER SUDAH BERUBAH',
      'Perubahan ini dibuat dari perangkat/tab lain setelah halaman ini memuat data. Perubahanmu di sini BELUM tersimpan.',
      [
        {icon:'\u21bb', label:'Muat data terbaru (perubahan belum tersimpan di sini dibuang)', onPick:function(){ release(); loadFromApi(); }},
        {icon:'\u2b06', label:'Timpa dengan data saya (versi server dicadangkan dulu)', onPick:function(){ release(); forceNextPush = true; pushToApi(); }}
      ]);
    // menutup lewat BATAL / klik di luar = nanti; lepaskan penjaga agar peringatan bisa muncul lagi di simpanan berikutnya
    var obs = new MutationObserver(function(){ if(!document.body.contains(ov)){ release(); obs.disconnect(); } });
    obs.observe(document.body, {childList:true});
  }

  function queueSync(){
    if(!hasApi() || !isGuru()) return;
    if(syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(function(){ syncTimer = null; pushToApi(); }, 500); // debounce rapid edits
  }

  function statusLabel(){
    if(!hasApi()) return {cls:'local', text: (isGuru()||isPetugas()) ? 'MODE LOKAL' : 'HUBUNGKAN MAINFRAME'};
    if(syncStatus==='syncing') return {cls:'sync', text:'SYNCING...'};
    if(syncStatus==='online') return {cls:'online', text:'MAINFRAME ONLINE'};
    if(syncStatus==='error') return {cls:'error', text:'SYNC GAGAL'};
    return {cls:'local', text:'MENGHUBUNGKAN...'};
  }

  function renderStatusOnly(){
    var el = document.getElementById('status-dot');
    var lb = document.getElementById('status-label');
    if(!el||!lb) return;
    var s = statusLabel();
    el.className = 'dot '+s.cls;
    lb.textContent = s.text;
  }

  // ---- Render ----
  // ---- Status ring di pojok kanan atas tab menu: oranye = pengumuman baru, biru = panel baru & sub-panel baru ----
  // "Baru" mengikuti aturan yang sama dengan label Baru dan feed Pembaruan (3 hari, terlihat murid). Sub-panel yang dibuat bersamaan
  // dengan panelnya tidak dihitung terpisah (panelnya sudah dihitung).
  function menuNewCounts(){
    var c = {};
    function slot(id){ return c[id] || (c[id] = {ann:0, pan:0, sub:0}); }
    updateItems().forEach(function(it){
      if(it.kind==='panel') slot(it.menuId).pan++;
      else if(it.kind==='sub') slot(it.menuId).sub++;
    });
    state.panels.forEach(function(p){
      if(p.type==='announcement' && isFresh(p) && !isExpired(p) && panelEff(p)) slot(p.menuId).ann++;
    });
    return c;
  }
  var RING_MAX_SEG = 12; // batas jumlah garis agar tetap terbaca di ring kecil; angka sebenarnya selalu ada di tooltip
  function menuRingHtml(cnt){
    if(!hasRing(cnt)) return '';
    var R = 4.6, C = 2*Math.PI*R, label = [];
    if(cnt.ann) label.push(cnt.ann+' pengumuman baru');
    if(cnt.pan) label.push(cnt.pan+' panel baru');
    if(cnt.sub) label.push(cnt.sub+' sub-panel baru');
    // satu garis (busur) untuk tiap pengumuman (oranye) dan tiap panel/sub-panel baru (biru): oranye dulu, lalu biru, searah jarum jam dari atas
    var blue = cnt.pan + cnt.sub;
    var nAnn = cnt.ann, nPan = blue, total = nAnn + nPan;
    if(total > RING_MAX_SEG){ // terlalu banyak untuk digambar satu per satu: bagi proporsional, masing-masing minimal 1 garis
      nAnn = Math.round(RING_MAX_SEG * cnt.ann / total);
      if(cnt.ann && !nAnn) nAnn = 1;
      if(blue && nAnn >= RING_MAX_SEG) nAnn = RING_MAX_SEG - 1;
      nPan = RING_MAX_SEG - nAnn;
      total = RING_MAX_SEG;
    }
    var circles = '';
    if(total === 1){
      circles = '<circle class="'+(nAnn ? 'rg-ann' : 'rg-pan')+'" cx="6" cy="6" r="'+R+'"/>';
    } else {
      var gap = total <= 6 ? 1.8 : 1.1, step = C / total, len = (step - gap).toFixed(2);
      for(var i=0; i<total; i++){
        circles += '<circle class="'+(i < nAnn ? 'rg-ann' : 'rg-pan')+'" cx="6" cy="6" r="'+R+'" stroke-dasharray="'+len+' '+(C - len).toFixed(2)+'" stroke-dashoffset="-'+(i*step + gap/2).toFixed(2)+'"/>';
      }
    }
    return '<span class="menu-ring" role="img" aria-label="'+label.join(', ')+'" title="'+label.join(' \u00b7 ')+'"><svg viewBox="0 0 12 12" fill="none" stroke-width="2.4">'+circles+'</svg></span>';
  }
  function hasRing(cnt){ return !!(cnt && (cnt.ann || cnt.pan || cnt.sub)); }

  // ---- Animasi pergeseran halus (teknik FLIP): elemen yang berpindah posisi meluncur dari posisi lama ke baru ----
  function flipSnapshot(root, selector, attr){
    var m = {};
    root.querySelectorAll(selector).forEach(function(el){
      var k = el.getAttribute(attr);
      if(k) m[k] = el.getBoundingClientRect();
    });
    return m;
  }
  function flipPlay(root, selector, attr, prev){
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var moved = [];
    root.querySelectorAll(selector).forEach(function(el){
      var before = prev[el.getAttribute(attr)];
      if(!before) return;
      var r = el.getBoundingClientRect();
      var dx = before.left - r.left, dy = before.top - r.top;
      if(Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
      el.style.transition = 'none';
      el.style.transform = 'translate('+dx+'px,'+dy+'px)';
      moved.push(el);
    });
    if(!moved.length) return;
    void root.offsetWidth; // paksa reflow agar posisi awal tercatat sebelum meluncur
    moved.forEach(function(el){
      el.style.transition = 'transform .38s cubic-bezier(.22,.9,.32,1)';
      el.style.transform = '';
      setTimeout(function(){ el.style.transition = ''; }, 420);
    });
  }

  // ---- Relasi: hubungan antar panel/sub-panel (tersimpan di field "rel" pada item pemilik, berlaku dua arah) ----
  function findP(id){ return state.panels.find(function(x){ return x.id===id; }); }
  function subVisible(p, s){ return panelVisible(p) && (isGuru() || viewerAllowedAccess().indexOf(itemAccess(s))!==-1); }
  function nodeOf(k, id, pid){
    if(k==='p'){ var p = findP(id); return (p && panelVisible(p)) ? {k:'p', id:id, pid:id, p:p, title:p.title} : null; }
    var pp = findP(pid), s = pp && pp.subpanels.find(function(x){ return x.id===id; });
    return (s && subVisible(pp, s)) ? {k:'s', id:id, pid:pid, p:pp, s:s, title:s.title} : null;
  }
  function relSrc(n){ return n.k==='p' ? n.p : n.s; }
  function allNodes(){
    var out = [];
    state.panels.forEach(function(p){
      var n = nodeOf('p', p.id); if(n) out.push(n);
      (p.subpanels||[]).forEach(function(s){ var m = nodeOf('s', s.id, p.id); if(m) out.push(m); });
    });
    return out;
  }
  // Relasi keluar (disimpan di item ini) + relasi masuk (item lain yang menunjuk ke item ini); target yang tidak terlihat/terhapus otomatis disaring
  function relList(k, id, pid){
    var self = nodeOf(k, id, pid), out = [];
    if(!self) return out;
    (relSrc(self).rel||[]).forEach(function(r){ var t = nodeOf(r.k, r.id, r.pid); if(t) out.push({n:t, note:r.note||'', owner:self, ref:r}); });
    allNodes().forEach(function(n){
      if(n.k===k && n.id===id) return;
      (relSrc(n).rel||[]).forEach(function(r){ if(r.k===k && r.id===id) out.push({n:n, note:r.note||'', owner:n, ref:r}); });
    });
    return out;
  }
  function relBtn(k, id, pid){
    var n = relList(k, id, pid).length;
    if(!n && !isGuru()) return '';
    return '<button class="rel-btn" data-relbtn="'+k+'" data-relid="'+id+'" data-relpid="'+(pid||'')+'" title="Lihat hubungan dengan panel/sub-panel lain">\u21c4 RELASI'+(n?' '+n:'')+'</button>';
  }
  function wireRel(root){
    root.querySelectorAll('[data-relbtn]').forEach(function(b){
      b.addEventListener('click', function(e){ e.stopPropagation(); openRelModal(b.getAttribute('data-relbtn'), b.getAttribute('data-relid'), b.getAttribute('data-relpid')); });
    });
  }
  function relWhere(n){ var m = menuById(n.p.menuId); return (m?m.name:'-')+(n.k==='s' ? ' \u203a '+n.p.title : ''); }
  function openRelModal(k, id, pid){
    var self = nodeOf(k, id, pid); if(!self) return;
    var g = isGuru();
    var ov = document.createElement('div'); ov.className = 'modal-overlay'; document.body.appendChild(ov);
    ov.addEventListener('click', function(e){ if(e.target===ov) closeOverlay(ov); });
    function draw(){
      var list = relList(k, id, pid);
      var rows = list.length ? list.map(function(r, i){
        return '<div class="rel-item"><span class="rel-kind">'+(r.n.k==='p'?'PANEL':'SUB-PANEL')+'</span><div class="rel-main"><div class="sub-title">'+esc(r.n.title)+'</div><div class="sub-subtitle">'+esc(relWhere(r.n))+'</div>'+(r.note?'<div class="rel-note">'+esc(r.note)+'</div>':'')+'</div>'+
          '<div class="rel-acts"><button class="btn" data-go="'+i+'">BUKA</button>'+(g?'<button class="icon-btn" data-rm="'+i+'" title="Hapus relasi">\u00d7</button>':'')+'</div></div>';
      }).join('') : '<div class="hist-empty">BELUM ADA RELASI</div>';
      var add = '';
      if(g){
        var used = {}; list.forEach(function(r){ used[r.n.k+':'+r.n.id] = 1; });
        var opts = allNodes().filter(function(n){ return !(n.k===k && n.id===id) && !used[n.k+':'+n.id]; }).map(function(n){
          return '<option value="'+n.k+'|'+n.id+'|'+n.pid+'">'+esc((n.k==='p'?'Panel':'Sub')+' \u00b7 '+relWhere(n)+' \u203a '+n.title)+'</option>';
        }).join('');
        add = '<div class="lm-sep"></div><label>Hubungkan dengan</label><input data-rsearch type="search" placeholder="Cari panel atau sub-panel..." autocomplete="off"><select data-rsel size="6" style="margin-top:6px">'+opts+'</select><div class="field-hint" data-rcount></div>'+
          '<label>Keterangan hubungan (opsional)</label><input data-rnote placeholder="Contoh: prasyarat, lanjutan materi, pelengkap">'+
          '<div class="modal-actions"><button class="btn btn-primary" data-radd'+(opts?'':' disabled')+'>+ HUBUNGKAN</button></div>';
      }
      ov.innerHTML = '<div class="modal wide"><h4 class="hud-font">RELASI</h4><div class="sub">'+(k==='p'?'Panel':'Sub-panel')+' \u201c'+esc(self.title)+'\u201d terhubung dengan '+list.length+' item. Hubungan berlaku dua arah.</div>'+
        '<div class="hist-list">'+rows+'</div>'+add+'<div class="modal-actions"><button class="btn" data-close>TUTUP</button></div></div>';
      ov.querySelector('[data-close]').onclick = function(){ closeOverlay(ov); };
      ov.querySelectorAll('[data-go]').forEach(function(b){ b.onclick = function(){
        var n = list[+b.getAttribute('data-go')].n;
        closeOverlay(ov, function(){ goToItem(n.p.menuId, n.p.id); if(n.k==='s') setTimeout(function(){ openPanelDetail(n.p.id); }, 300); });
      }; });
      ov.querySelectorAll('[data-rm]').forEach(function(b){ b.onclick = function(){
        var r = list[+b.getAttribute('data-rm')], o = relSrc(r.owner);
        o.rel = (o.rel||[]).filter(function(x){ return x!==r.ref; });
        if(!o.rel.length) delete o.rel;
        save(); draw();
      }; });
      var ab = ov.querySelector('[data-radd]');
      var sb = ov.querySelector('[data-rsearch]'), sel = ov.querySelector('[data-rsel]');
      if(sb && sel){
        var all = [].map.call(sel.options, function(o){ return {v:o.value, t:o.textContent}; });
        var cnt = ov.querySelector('[data-rcount]');
        var filt = function(){
          var words = sb.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
          var hit = all.filter(function(o){ var t = o.t.toLowerCase(); return words.every(function(w){ return t.indexOf(w)!==-1; }); });
          sel.innerHTML = hit.map(function(o){ return '<option value="'+esc(o.v)+'">'+esc(o.t)+'</option>'; }).join('');
          if(hit.length) sel.selectedIndex = 0;
          if(ab) ab.disabled = !hit.length;
          cnt.textContent = hit.length ? hit.length+' item ditemukan' : 'Tidak ada yang cocok';
        };
        sb.addEventListener('input', filt);
        sb.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); if(ab && !ab.disabled) ab.click(); } });
        filt();
      }
      if(ab) ab.onclick = function(){
        var v = ov.querySelector('[data-rsel]').value; if(!v) return;
        var a = v.split('|'), ref = {k:a[0], id:a[1]};
        if(a[0]==='s') ref.pid = a[2];
        var note = ov.querySelector('[data-rnote]').value.trim(); if(note) ref.note = note;
        var o = relSrc(self); (o.rel = o.rel||[]).push(ref);
        save(); draw();
      };
    }
    draw();
  }


  // ---- Daftar semua menu: tombol di ujung kanan baris menu, muncul hanya jika tab menu tidak muat ----
  function updateMenuOverflow(){
    var row = document.querySelector('.menu-row'), b = document.getElementById('menu-more-btn');
    if(!row || !b) return;
    b.classList.remove('show'); // ukur tanpa tombol dulu supaya bisa hilang lagi saat layar melebar
    var over = row.scrollWidth > row.clientWidth + 1;
    b.classList.toggle('show', over);
    var a = row.querySelector('.menu-tab.active');
    if(over && a){ // tab aktif selalu terlihat
      var rr = row.getBoundingClientRect(), ar = a.getBoundingClientRect();
      if(ar.left < rr.left) row.scrollLeft -= rr.left - ar.left;
      else if(ar.right > rr.right) row.scrollLeft += ar.right - rr.right;
    }
  }
  function menuListModal(){
    var g = isGuru();
    var list = g ? state.menus : state.menus.filter(function(m){ return viewerAllowedAccess().indexOf(itemAccess(m))!==-1; });
    var counts = menuNewCounts();
    var ov = document.createElement('div'); ov.className = 'modal-overlay'; document.body.appendChild(ov);
    ov.addEventListener('click', function(e){ if(e.target===ov) closeOverlay(ov); });
    ov.innerHTML = '<div class="modal"><h4 class="hud-font">SEMUA MENU</h4><div class="sub">'+list.length+' menu. Pilih salah satu untuk berpindah.</div><div class="menu-list">'+
      list.map(function(m){
        var c = counts[m.id], n = c ? c.ann+c.pan+c.sub : 0;
        return '<button class="menu-list-item'+(m.id===state.activeMenu?' active':'')+'" data-mid="'+m.id+'"><span class="ml-name">'+esc(m.name)+'</span>'+
          (g && itemAccess(m)!=='student' ? '<span class="ml-sfx">'+(itemAccess(m)==='teacher'?'khusus guru':'khusus petugas')+'</span>' : '')+(n?'<span class="ml-new">'+n+' baru</span>':'')+'</button>';
      }).join('')+'</div><div class="modal-actions"><button class="btn" data-close>TUTUP</button></div></div>';
    ov.querySelector('[data-close]').onclick = function(){ closeOverlay(ov); };
    ov.querySelectorAll('[data-mid]').forEach(function(b){ b.onclick = function(){
      var id = b.getAttribute('data-mid');
      closeOverlay(ov, function(){ state.activeMenu = id; render(); persistLocal(); });
    }; });
  }


  // ---- Pindahkan sub-panel ke panel lain (menu yang sama atau menu lain): langkah 1 pilih menu, langkah 2 pilih panel ----
  function applySubMove(fromPid, subId, toPid){
    var from = findP(fromPid), to = findP(toPid);
    if(!from || !to || from===to) return false;
    var i = from.subpanels.findIndex(function(x){ return x.id===subId; });
    if(i<0) return false;

  // ---- Pencarian panel & sub-panel (semua menu yang boleh dilihat peran ini) ----
  var searchQ = '';
  var searchRes = [];
  function escRe(t){ return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function hlText(txt, words){
    var re = new RegExp('('+words.map(escRe).join('|')+')', 'gi');
    return String(txt).split(re).map(function(part, i){ return i%2 ? '<mark>'+esc(part)+'</mark>' : esc(part); }).join('');
  }
  function searchItems(words){
    var out = [], subs = [];
    function hit(txt){ var t = String(txt||'').toLowerCase(); return words.every(function(w){ return t.indexOf(w)!==-1; }); }
    state.panels.forEach(function(p){
      var m = menuById(p.menuId);
      if(!m || !panelVisible(p)) return;
      if(!isGuru() && viewerAllowedAccess().indexOf(itemAccess(m))===-1) return;
      if(p.type==='announcement'){
        if(isExpired(p)) return;
        if(hit(p.title)) out.push({k:'a', p:p, m:m, title:p.title});
        return;
      }
      if(hit(p.title)) out.push({k:'p', p:p, m:m, title:p.title});
      (p.subpanels||[]).forEach(function(sb){
        if(!subVisible(p, sb)) return;
        var all = [sb.title, sb.subtitle, sb.linkLabel].join(' ');
        if(hit(all)) subs.push({k:'s', p:p, m:m, s:sb, title:sb.title, rest:[sb.subtitle, sb.linkLabel].filter(Boolean).join(' \u00b7 ')});
      });
    });
    return out.concat(subs);
  }
  function snippet(txt, words){
    var t = String(txt||'').replace(/\s+/g, ' ').trim(), low = t.toLowerCase(), at = -1;
    words.forEach(function(w){ var i = low.indexOf(w); if(i>=0 && (at<0 || i<at)) at = i; });
    if(at<0) return '';
    var st = Math.max(0, at-30), seg = t.slice(st, st+110);
    return (st>0?'\u2026':'')+seg+(st+110<t.length?'\u2026':'');
  }
  function runSearch(){
    var box = document.getElementById('gsearch-res'), clr = document.getElementById('gsearch-clear');
    if(!box) return;
    if(clr) clr.hidden = !searchQ;
    var words = searchQ.trim().toLowerCase().split(/\s+/).filter(Boolean);
    if(!words.length){ box.hidden = true; box.innerHTML = ''; searchRes = []; return; }
    searchRes = searchItems(words).slice(0, 40);
    box.hidden = false;
    box.innerHTML = '<div class="gs-count">'+(searchRes.length ? searchRes.length+' HASIL' : 'TIDAK ADA HASIL')+'</div>'+searchRes.map(function(r, i){
      var where = r.m.name + (r.k==='s' ? ' \u203a '+r.p.title : '');
      var sn = (r.k==='s' && r.rest) ? snippet(r.rest, words) : '';
      return '<button class="gs-item" data-gi="'+i+'"><span class="gs-kind '+r.k+'">'+(r.k==='p'?'PANEL':r.k==='a'?'PENGUMUMAN':'SUB-PANEL')+'</span><div class="gs-main"><div class="gs-title">'+hlText(r.title, words)+'</div><div class="gs-where">'+esc(where)+'</div>'+(sn?'<div class="gs-snip">'+hlText(sn, words)+'</div>':'')+'</div></button>';
    }).join('');
    box.querySelectorAll('[data-gi]').forEach(function(b){ b.onclick = function(){ openSearchHit(searchRes[+b.getAttribute('data-gi')]); }; });
  }
  function openSearchHit(r){
    if(!r) return;
    searchQ = '';
    goToItem(r.p.menuId, r.p.id);
    if(r.k==='s') setTimeout(function(){ openPanelDetail(r.p.id); }, 300);
  }
  function wireSearch(focusState){
    var gi = document.getElementById('global-search'); if(!gi) return;
    gi.value = searchQ;
    gi.addEventListener('input', function(){ searchQ = gi.value; runSearch(); });
    gi.addEventListener('keydown', function(e){
      if(e.key==='Enter'){ e.preventDefault(); if(searchRes[0]) openSearchHit(searchRes[0]); }
      else if(e.key==='Escape'){ searchQ = ''; gi.value = ''; runSearch(); }
      else if(e.key==='ArrowDown'){ var f = document.querySelector('#gsearch-res .gs-item'); if(f){ e.preventDefault(); f.focus(); } }
    });
    var clr = document.getElementById('gsearch-clear');
    if(clr) clr.addEventListener('click', function(){ searchQ = ''; gi.value = ''; runSearch(); gi.focus(); });
    runSearch();
    if(focusState){ gi.focus(); try{ gi.setSelectionRange(focusState[0], focusState[1]); }catch(e){} }
  }

  var CAL_DOW = ['SEN','SEL','RAB','KAM','JUM','SAB','MIN'];

  function ymd(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }

    var n = Math.ceil((off+dim)/7)*7, sel = calSel || today, prefix = calY+'-'+pad2(calM+1), monthCount = 0;
    Object.keys(ev).forEach(function(k){ if(k.indexOf(prefix)===0) monthCount += ev[k].length; });

    for(var i=0;i<n;i++){
      var d = new Date(calY, calM, 1-off+i), key = ymd(d), list = ev[key]||[];
      cells += '<button class="cal-cell'+(d.getMonth()!==calM?' other':'')+(key===today?' today':'')+(key===sel?' sel':'')+'" data-cal="'+key+'" title="'+(list.length?list.length+' pengumuman':'Tidak ada pengumuman')+'"><span class="cal-d">'+d.getDate()+'</span>'+
        list.slice(0,2).map(function(p){ return '<span class="cal-chip'+(isExpired(p)?' done':'')+'">'+esc(p.title)+'</span>'; }).join('')+

    }).join('') : '<div class="cal-empty">TIDAK ADA PENGUMUMAN PADA TANGGAL INI</div>';
    return '<div class="cal-wrap"><div class="cal-bar"><button class="cal-nav" data-calnav="-1" title="Bulan sebelumnya">\u2039</button><div class="cal-title hud-font">'+CAL_MONTHS[calM]+' '+calY+'</div><button class="cal-nav" data-calnav="1" title="Bulan berikutnya">\u203a</button><button class="btn" data-caltoday>HARI INI</button><span class="cal-sum">'+monthCount+' PENGUMUMAN BULAN INI</span></div>'+
      '<div class="cal-grid">'+cells+'</div>'+
      '<div class="cal-agenda"><h3>AGENDA \u00b7 '+esc(formatDate(sel))+'</h3>'+agenda+'</div></div>';

  // ---- Drag & drop wiring (native HTML5 DnD) ----
  function wireDragAndDrop(app){
    var draggedPanelId = null;
    app.querySelectorAll('[data-dragpanel]').forEach(function(handle){
      handle.addEventListener('dragstart', function(e){
        draggedPanelId = handle.getAttribute('data-dragpanel');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', draggedPanelId);
        var card = handle.closest('.panel-card');
        if(card) setTimeout(function(){ card.classList.add('dragging'); }, 0);
      });
      handle.addEventListener('dragend', function(){
        var card = handle.closest('.panel-card');
        if(card) card.classList.remove('dragging');
        draggedPanelId = null;
        app.querySelectorAll('.panel-card.drag-over').forEach(function(c){ c.classList.remove('drag-over'); });
      });
    });
    app.querySelectorAll('.panel-card.type-info').forEach(function(card){
      card.addEventListener('dragover', function(e){
        if(!draggedPanelId) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        card.classList.add('drag-over');
      });
      card.addEventListener('dragleave', function(){ card.classList.remove('drag-over'); });
      card.addEventListener('drop', function(e){
        e.preventDefault();
        card.classList.remove('drag-over');
        var targetId = card.getAttribute('data-pid');
        var dragId = draggedPanelId || e.dataTransfer.getData('text/plain');
        if(dragId) reorderInfoPanels(dragId, targetId);
      });
    });

    // Pengumuman hanya bisa ditukar urutannya dengan sesama pengumuman (kartu panel informasi tidak menerima seretan ini)
    var draggedAnnId = null;
    app.querySelectorAll('[data-dragann]').forEach(function(handle){
      handle.addEventListener('dragstart', function(e){
        draggedAnnId = handle.getAttribute('data-dragann');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', 'ann:'+draggedAnnId);
        var card = handle.closest('.panel-card');
        if(card) setTimeout(function(){ card.classList.add('dragging'); }, 0);
      });
      handle.addEventListener('dragend', function(){
        var card = handle.closest('.panel-card');
        if(card) card.classList.remove('dragging');
        draggedAnnId = null;
        app.querySelectorAll('.panel-card.drag-over').forEach(function(c){ c.classList.remove('drag-over'); });
      });
    });
    app.querySelectorAll('.panel-card.type-announcement[data-aid]').forEach(function(card){
      card.addEventListener('dragover', function(e){
        if(!draggedAnnId || card.getAttribute('data-aid')===draggedAnnId) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        card.classList.add('drag-over');
      });
      card.addEventListener('dragleave', function(){ card.classList.remove('drag-over'); });
      card.addEventListener('drop', function(e){
        e.preventDefault();
        card.classList.remove('drag-over');
        if(draggedAnnId) reorderAnnouncements(draggedAnnId, card.getAttribute('data-aid'));
      });
    });

    var draggedSubId = null, draggedSubPanel = null;
    app.querySelectorAll('[data-dragsub]').forEach(function(handle){
      handle.addEventListener('dragstart', function(e){
        draggedSubId = handle.getAttribute('data-dragsub');
        draggedSubPanel = handle.getAttribute('data-panel');
        e.stopPropagation();
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', draggedSubId);
        var sub = handle.closest('.sub-card');
        if(sub) setTimeout(function(){ sub.classList.add('dragging'); }, 0);
      });
      handle.addEventListener('dragend', function(){
        var sub = handle.closest('.sub-card');
        if(sub) sub.classList.remove('dragging');
        draggedSubId = null; draggedSubPanel = null;
        app.querySelectorAll('.sub-card.drag-over').forEach(function(c){ c.classList.remove('drag-over'); });
      });
    });
    app.querySelectorAll('.sub-card').forEach(function(sub){
      sub.addEventListener('dragover', function(e){
        if(!draggedSubId || draggedSubPanel!==sub.getAttribute('data-panel')) return;
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = 'move';
        sub.classList.add('drag-over');
      });
      sub.addEventListener('dragleave', function(){ sub.classList.remove('drag-over'); });
      sub.addEventListener('drop', function(e){
        if(!draggedSubId) return; // yang diseret bukan sub-panel (mis. sebuah panel): biarkan naik ke kartu panel tujuan
        e.preventDefault();
        e.stopPropagation();
        sub.classList.remove('drag-over');
        var targetId = sub.getAttribute('data-subid');
        var panelId = sub.getAttribute('data-panel');
        var dragId = draggedSubId || e.dataTransfer.getData('text/plain');
        if(dragId && panelId===draggedSubPanel) reorderSubpanels(panelId, dragId, targetId);
      });
    });

    // ---- Geser tab menu (guru) ----
    var draggedMenuId = null;
    app.querySelectorAll('.menu-tab[draggable="true"]').forEach(function(tab){
      tab.addEventListener('dragstart', function(e){

      });
      tab.addEventListener('dragover', function(e){
        if(!draggedMenuId) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        tab.classList.add('drag-over');
      });
      tab.addEventListener('dragleave', function(){ tab.classList.remove('drag-over'); });
      tab.addEventListener('drop', function(e){
        e.preventDefault();
        tab.classList.remove('drag-over');
        var dragId = draggedMenuId || e.dataTransfer.getData('text/plain');
        if(dragId) reorderMenus(dragId, tab.getAttribute('data-switch'));
      });
    });
  }

    var pAcc = itemAccess(p);

  // Menutup pop-up dengan animasi halus (fade + scale) sebelum elemen benar-benar dihapus.
  function closeOverlay(ov, after){
    if(!ov || ov.dataset.closing) return;
    ov.dataset.closing = '1';
    ov.classList.add('closing');
    var done = false;
    function finish(){
      if(done) return; done = true;
      ov.remove();
      if(after) after();
    }
    ov.addEventListener('transitionend', finish, {once:true});
    setTimeout(finish, 220); // jaring pengaman jika transitionend tak terpicu
  }

  function openImageLightbox(src){
    var scale = 1, tx = 0, ty = 0, dragging = false, sx = 0, sy = 0, stx = 0, sty = 0;
    var ov = document.createElement('div'); ov.className = 'modal-overlay lightbox-overlay';
    ov.innerHTML = '<div class="lightbox-wrap">'+
      '<div class="lightbox-toolbar">'+
        '<button class="lb-btn" data-lbout title="Perkecil">\u2212</button>'+
        '<button class="lb-btn" data-lbreset title="Reset ukuran">100%</button>'+
        '<button class="lb-btn" data-lbin title="Perbesar">+</button>'+
        '<button class="lb-btn lb-close" data-lbclose title="Tutup">\u00d7</button>'+
      '</div>'+
      '<div class="lightbox-view"><img src="'+esc(src)+'" class="lightbox-img" draggable="false" alt=""></div>'+
    '</div>';
    document.body.appendChild(ov);
    var img = ov.querySelector('.lightbox-img');
    function apply(){ img.style.transform = 'translate('+tx+'px,'+ty+'px) scale('+scale+')'; img.style.cursor = scale>1 ? 'grab' : 'zoom-in'; }
    function setScale(ns){ scale = Math.max(0.5, Math.min(6, ns)); if(scale<=1){ tx=0; ty=0; } apply(); }
    apply();
    function close(){
      closeOverlay(ov, function(){
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
        document.removeEventListener('keydown', onKey);
      });
    }
    function onWheel(e){ e.preventDefault(); setScale(scale + (e.deltaY<0?0.25:-0.25)); }
    function onDown(e){ if(scale<=1) return; dragging=true; sx=e.clientX; sy=e.clientY; stx=tx; sty=ty; img.style.cursor='grabbing'; e.preventDefault(); }
    function onMove(e){ if(!dragging) return; tx = stx+(e.clientX-sx); ty = sty+(e.clientY-sy); apply(); }
    function onUp(){ if(dragging){ dragging=false; apply(); } }
    function onKey(e){ if(e.key==='Escape') close(); }
    ov.querySelector('[data-lbin]').onclick = function(){ setScale(scale+0.4); };
    ov.querySelector('[data-lbout]').onclick = function(){ setScale(scale-0.4); };
    ov.querySelector('[data-lbreset]').onclick = function(){ setScale(1); };
    ov.querySelector('[data-lbclose]').onclick = close;
    ov.addEventListener('click', function(e){ if(e.target===ov) close(); });
    ov.querySelector('.lightbox-view').addEventListener('wheel', onWheel, {passive:false});
    img.addEventListener('dblclick', function(){ setScale(scale>1?1:2); });
    img.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    document.addEventListener('keydown', onKey);
  }

  function openModal(title, sub, fields, onSave, saveLabel){
    var ov = document.createElement('div'); ov.className='modal-overlay';
    var f = fields.map(function(fl){
      if(fl.type==='textarea'){
        return '<label>'+fl.label+'</label><textarea data-f="'+fl.name+'"'+(fl.rows?' rows="'+fl.rows+'"':'')+' placeholder="'+(fl.placeholder||'')+'">'+esc(fl.value||'')+'</textarea>';
      }
      if(fl.type==='select'){
        return '<label>'+fl.label+'</label><select data-f="'+fl.name+'">'+(fl.options||[]).map(function(o){ return '<option value="'+esc(o.value)+'"'+(o.value===fl.value?' selected':'')+'>'+esc(o.label)+'</option>'; }).join('')+'</select>'+(fl.hint?'<div class="field-hint" data-hint="'+fl.name+'">'+esc(fl.hint)+'</div>':'');
      }
      return '<label>'+fl.label+'</label><input data-f="'+fl.name+'" type="'+(fl.type||'text')+'" value="'+esc(fl.value||'')+'" placeholder="'+(fl.placeholder||'')+'">';
    }).join('');
    ov.innerHTML = '<div class="modal"><h4 class="hud-font">'+title+'</h4>'+(sub?'<div class="sub">'+sub+'</div>':'')+f+'<div class="modal-actions"><button class="btn" data-cancel>BATAL</button><button class="btn btn-primary" data-save>'+(saveLabel||'SIMPAN')+'</button></div></div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', function(e){ if(e.target===ov) closeOverlay(ov); });
    ov.querySelector('[data-cancel]').onclick = function(){ closeOverlay(ov); };
    ov.querySelectorAll('input').forEach(function(inp){ inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); ov.querySelector('[data-save]').click(); } }); });
    ov.querySelector('[data-save]').onclick = function(){
      var vals = {};
      fields.forEach(function(fl){ vals[fl.name] = ov.querySelector('[data-f="'+fl.name+'"]').value.trim(); });
      closeOverlay(ov, function(){ onSave(vals); });
    };
    return ov;
  }
