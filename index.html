<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.I.C.E.R.Y // Papan Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050a12;
  --bg-grid:#08111c;
  --panel:#0a1622;
  --panel-2:#0d1c2b;
  --cyan:#2be3ff;
  --cyan-dim:#0f7c94;
  --violet:#7b61ff;
  --amber:#ffb020;
  --red:#ff4d5e;
  --text:#d6f2ff;
  --muted:#5b7c95;
  --line:#173347;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse at top, #0a1826 0%, var(--bg) 55%),
    repeating-linear-gradient(0deg, rgba(43,227,255,.025) 0px, rgba(43,227,255,.025) 1px, transparent 1px, transparent 3px);
  color:var(--text);
  font-family:'Share Tech Mono', monospace;
  min-height:100vh;
  overflow-x:hidden;
}
.hud-font{font-family:'Orbitron', sans-serif;}

/* scanline sweep, one orchestrated moment on load */
.boot{
  position:fixed;inset:0;background:#020508;z-index:999;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;
  animation:bootOut .6s ease 1.4s forwards;
}
.boot-line{font-family:'Orbitron',sans-serif;color:var(--cyan);letter-spacing:.12em;font-size:13px;opacity:0;animation:bootIn .5s ease forwards;text-shadow:0 0 12px rgba(43,227,255,.7);}
.boot-line:nth-child(1){animation-delay:.1s;}
.boot-line:nth-child(2){animation-delay:.5s;}
.boot-line:nth-child(3){animation-delay:.9s;}
@keyframes bootIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
@keyframes bootOut{to{opacity:0;visibility:hidden;pointer-events:none;}}
.boot-ring{width:64px;height:64px;border-radius:50%;border:2px solid var(--cyan-dim);border-top-color:var(--cyan);animation:spin 1s linear infinite;box-shadow:0 0 24px rgba(43,227,255,.35);}
@keyframes spin{to{transform:rotate(360deg);}}

header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg, rgba(5,10,18,.97), rgba(5,10,18,.9));
  border-bottom:1px solid var(--line);
  padding:12px 16px 10px;
}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1100px;margin:0 auto 10px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:26px;height:26px;position:relative;flex-shrink:0;}
.brand-mark svg{width:100%;height:100%;}
.brand h1{font-size:15px;margin:0;letter-spacing:.16em;font-weight:700;color:var(--cyan);text-shadow:0 0 10px rgba(43,227,255,.5);}
.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:.14em;margin-top:1px;}
.status{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);cursor:pointer;padding:6px 10px;border:1px solid var(--line);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);background:var(--panel);}
.status:hover{border-color:var(--cyan-dim);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;}
.dot.online{background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse 2s ease-in-out infinite;}
.dot.local{background:var(--amber);box-shadow:0 0 8px var(--amber);}
.dot.error{background:var(--red);box-shadow:0 0 8px var(--red);}
.dot.sync{background:var(--violet);box-shadow:0 0 8px var(--violet);animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

.menu-row{display:flex;gap:8px;overflow-x:auto;max-width:1100px;margin:0 auto;padding-bottom:2px;}
.menu-tab{
  position:relative;padding:8px 26px 8px 14px;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  white-space:nowrap;cursor:pointer;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.08em;
  clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px);flex-shrink:0;
}
.menu-tab.active{color:var(--cyan);border-color:var(--cyan-dim);background:var(--panel-2);box-shadow:inset 0 0 12px rgba(43,227,255,.12);}
.menu-del{position:absolute;right:8px;top:50%;transform:translateY(-50%);opacity:.5;font-size:13px;}
.menu-del:hover{opacity:1;color:var(--red);}
#add-menu-btn{flex-shrink:0;padding:8px 14px;border:1px dashed var(--line);background:transparent;color:var(--muted);cursor:pointer;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.08em;}
#add-menu-btn:hover{color:var(--cyan);border-color:var(--cyan-dim);}

main{padding:20px 16px 60px;max-width:1100px;margin:0 auto;}
.add-panel-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 18px;padding:11px 16px;
  border:1px dashed var(--line);background:transparent;color:var(--muted);cursor:pointer;width:100%;
  font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.1em;
}
.add-panel-btn:hover{color:var(--cyan);border-color:var(--cyan-dim);}
.panels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;}

.panel-card{
  background:var(--panel);border:1px solid var(--line);padding:0;position:relative;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
}
.panel-card::before{
  content:'';position:absolute;top:0;left:0;width:100%;height:2px;
  background:linear-gradient(90deg, var(--cyan), transparent 60%);opacity:.6;
}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 10px;border-bottom:1px solid var(--line);}
.panel-head h3{margin:0;font-size:13px;font-family:'Orbitron',sans-serif;letter-spacing:.06em;color:var(--text);}
.icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:2px 6px;line-height:1;}
.icon-btn:hover{color:var(--red);}
.panel-body{padding:4px 14px 12px;}
.sub-card{border-top:1px solid var(--line);padding:10px 0;}
.sub-card:first-child{border-top:none;}
.sub-card img{max-width:100%;display:block;margin-top:8px;border:1px solid var(--line);filter:saturate(.85) contrast(1.05);}
.sub-title{font-weight:700;font-size:13px;color:var(--text);}
.sub-subtitle{color:var(--muted);font-size:11.5px;margin-top:2px;}
.sub-link{color:var(--cyan);font-size:11.5px;display:inline-block;margin-top:7px;text-decoration:none;border-bottom:1px solid var(--cyan-dim);}
.sub-link:hover{text-shadow:0 0 6px rgba(43,227,255,.6);}
.add-sub-btn{margin-top:8px;font-size:11px;background:none;border:1px dashed var(--line);color:var(--muted);padding:7px 10px;cursor:pointer;font-family:'Orbitron',sans-serif;letter-spacing:.06em;width:100%;}
.add-sub-btn:hover{color:var(--cyan);border-color:var(--cyan-dim);}
.empty{color:var(--muted);text-align:center;padding:60px 20px;font-size:12px;letter-spacing:.04em;border:1px dashed var(--line);grid-column:1/-1;}

/* Announcement (pengumuman) panel variant */
.panel-card.type-announcement{border-color:var(--amber);}
.panel-card.type-announcement::before{background:linear-gradient(90deg, var(--amber), transparent 60%);opacity:.75;}
.panel-card.type-announcement.expired{border-color:var(--line);}
.panel-card.type-announcement.expired::before{background:linear-gradient(90deg, var(--muted), transparent 60%);opacity:.35;}
.new-badge{
  position:absolute;top:-1px;right:14px;background:var(--amber);color:#1a0f00;font-family:'Orbitron',sans-serif;
  font-size:9.5px;font-weight:900;letter-spacing:.08em;padding:3px 9px 4px;
  clip-path:polygon(0 0,100% 0,100% 100%,6px 100%,0 60%);
  box-shadow:0 0 10px rgba(255,176,32,.6);animation:pulse 1.4s ease-in-out infinite;
}
.ann-body{font-size:12.5px;line-height:1.6;color:var(--text);white-space:pre-wrap;}
.ann-meta{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:10.5px;letter-spacing:.03em;}
.status-pill{font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:.07em;padding:3px 8px;border:1px solid var(--cyan-dim);color:var(--cyan);}
.status-pill.expired{border-color:var(--line);color:var(--muted);}
.ann-deadline{color:var(--muted);}
.panel-type-tag{font-size:9px;color:var(--muted);letter-spacing:.06em;font-family:'Orbitron',sans-serif;}

/* Type chooser modal */
.type-choice{display:flex;gap:10px;margin-top:4px;}
.type-choice button{
  flex:1;padding:16px 10px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer;
  font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.05em;display:flex;flex-direction:column;gap:6px;align-items:center;
}
.type-choice button:hover{border-color:var(--cyan);color:var(--cyan);}
.type-choice .ico{font-size:20px;}
.modal textarea{width:100%;padding:9px 10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:13px;font-family:'Share Tech Mono',monospace;resize:vertical;min-height:70px;}
.modal textarea:focus{outline:none;border-color:var(--cyan);}
.modal input[type="date"]{color-scheme:dark;}

/* Drag & drop */
.drag-handle{cursor:grab;color:var(--muted);font-size:15px;padding:6px 8px;user-select:none;touch-action:none;flex-shrink:0;line-height:1;}
.drag-handle:hover{color:var(--cyan);}
.drag-handle:active{cursor:grabbing;}
.move-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;padding:4px 5px;line-height:1;}
.move-btn:hover{color:var(--cyan);}
.move-btn:disabled{opacity:.25;cursor:default;}
.move-btn:disabled:hover{color:var(--muted);}
.panel-head-right{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.panel-head-left{display:flex;align-items:center;gap:6px;min-width:0;}
.panel-head-left h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.panel-card.type-info.dragging{opacity:.35;}
.panel-card.type-info.drag-over{outline:2px dashed var(--cyan);outline-offset:-3px;}
.sub-card{position:relative;}
.sub-card.dragging{opacity:.35;}
.sub-card.drag-over{outline:2px dashed var(--cyan);outline-offset:-2px;}
.sub-head-left{display:flex;align-items:flex-start;gap:6px;min-width:0;}
.sub-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}

.modal-overlay{position:fixed;inset:0;background:rgba(2,5,8,.75);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;}
.modal{
  background:var(--panel-2);border:1px solid var(--cyan-dim);padding:22px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto;
  box-shadow:0 0 40px rgba(43,227,255,.12);clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
}
.modal h4{margin:0 0 4px;font-family:'Orbitron',sans-serif;font-size:14px;letter-spacing:.08em;color:var(--cyan);}
.modal .sub{font-size:11px;color:var(--muted);margin-bottom:6px;}
.modal label{display:block;font-size:10.5px;color:var(--muted);margin:12px 0 5px;letter-spacing:.06em;font-family:'Orbitron',sans-serif;}
.modal input{width:100%;padding:9px 10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:13px;font-family:'Share Tech Mono',monospace;}
.modal input:focus{outline:none;border-color:var(--cyan);}
.modal-actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;}
.btn{padding:9px 16px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.06em;}
.btn:hover{color:var(--text);border-color:var(--muted);}
.btn-primary{background:var(--cyan-dim);border-color:var(--cyan);color:#02141a;font-weight:700;}
.btn-primary:hover{color:#02141a;box-shadow:0 0 14px rgba(43,227,255,.4);}
.hint{font-size:10.5px;color:var(--muted);margin-top:10px;line-height:1.5;}
.hint code{color:var(--cyan);}
/* Riwayat pengumuman */
.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.hist-btn{display:flex;align-items:center;gap:8px;font-family:'Orbitron',sans-serif;font-size:9.5px;letter-spacing:.07em;color:var(--amber);cursor:pointer;padding:6px 10px;border:1px solid var(--line);background:var(--panel);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);}
.hist-btn:hover{border-color:var(--amber);box-shadow:0 0 10px rgba(255,176,32,.2);}
.hist-count{background:var(--amber);color:#1a0f00;font-weight:900;padding:1px 6px;font-size:9px;min-width:16px;text-align:center;}
.modal.wide{max-width:560px;}
.hist-list{margin-top:10px;}
.hist-item{border-top:1px solid var(--line);padding:12px 0;}
.hist-item:first-child{border-top:none;}
.hist-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.hist-title{font-family:'Orbitron',sans-serif;font-size:12.5px;letter-spacing:.04em;color:var(--text);}
.hist-body{font-size:12px;line-height:1.6;color:var(--muted);white-space:pre-wrap;margin-top:6px;}
.hist-meta{font-size:10.5px;color:var(--muted);margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 12px;}
.hist-menu{color:var(--cyan);}
.hist-empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:12px;border:1px dashed var(--line);margin-top:10px;}
/* Peran guru / murid */
.header-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
.role-pill{font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:.07em;padding:5px 8px;border:1px solid var(--line);color:var(--muted);}
.role-pill.active{color:var(--violet);border-color:var(--violet);box-shadow:0 0 8px rgba(123,97,255,.25);}
.role-btn{font-family:'Orbitron',sans-serif;font-size:9.5px;letter-spacing:.07em;color:var(--cyan);cursor:pointer;padding:6px 10px;border:1px solid var(--line);background:var(--panel);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);}
.role-btn:hover{border-color:var(--cyan-dim);box-shadow:0 0 10px rgba(43,227,255,.2);}
.status.readonly{cursor:default;}
.status.readonly:hover{border-color:var(--line);}
/* Tombol segitiga 3-warna: biru = murid, ungu = petugas, kuning = hanya guru */
.vis-tri{position:relative;display:inline-block;vertical-align:middle;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid var(--cyan);cursor:pointer;flex-shrink:0;filter:drop-shadow(0 0 5px rgba(43,227,255,.75));transition:filter .15s,border-bottom-color .15s;}
.vis-tri:hover{filter:drop-shadow(0 0 9px rgba(43,227,255,.95));}
.vis-tri.staff{border-bottom-color:var(--violet);filter:drop-shadow(0 0 5px rgba(123,97,255,.8));}
.vis-tri.staff:hover{filter:drop-shadow(0 0 9px rgba(123,97,255,1));}
.vis-tri.teacher{border-bottom-color:var(--amber);filter:drop-shadow(0 0 5px rgba(255,176,32,.8));}
.vis-tri.teacher:hover{filter:drop-shadow(0 0 9px rgba(255,176,32,1));}
.menu-tab .vis-tri{margin-left:8px;}
.sub-head-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.panel-head-right .vis-tri{margin-right:6px;}
.teacher-only{opacity:.72;}
.panel-card.teacher-only,.menu-tab.teacher-only{border-style:dashed;}
.sub-card.teacher-only{background:repeating-linear-gradient(135deg, rgba(255,176,32,.05) 0 6px, transparent 6px 12px);}
.panel-card.staff-only,.menu-tab.staff-only{border-style:dashed;border-color:var(--violet);}
.sub-card.staff-only{background:repeating-linear-gradient(135deg, rgba(123,97,255,.06) 0 6px, transparent 6px 12px);}
.vis-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:10.5px;color:var(--muted);margin:0 0 14px;letter-spacing:.02em;}
.vis-legend .vis-tri{cursor:default;}
/* Label BARU! inline + feed pembaruan otomatis */
.new-tag{display:inline-block;flex-shrink:0;margin-left:7px;background:var(--amber);color:#1a0f00;font-family:'Orbitron',sans-serif;font-size:8.5px;font-weight:900;letter-spacing:.06em;padding:2px 6px 2px;line-height:1.3;vertical-align:middle;box-shadow:0 0 8px rgba(255,176,32,.55);animation:pulse 1.4s ease-in-out infinite;clip-path:polygon(0 0,100% 0,100% 100%,4px 100%,0 65%);}
.update-feed{border:1px solid var(--violet);background:linear-gradient(180deg,rgba(123,97,255,.09),rgba(10,22,34,.9));margin:0 0 16px;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);}
.uf-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:10px 14px 8px;border-bottom:1px solid var(--line);}
.uf-title{font-size:12px;letter-spacing:.1em;color:var(--violet);text-shadow:0 0 10px rgba(123,97,255,.5);}
.uf-sub{font-size:10.5px;color:var(--muted);}
.uf-list{max-height:176px;overflow-y:auto;padding:2px 14px 6px;}
.uf-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer;font-size:12px;}
.uf-item:first-child{border-top:none;}
.uf-item:hover .uf-strong{color:var(--cyan);}
.uf-kind{flex-shrink:0;font-family:'Orbitron',sans-serif;font-size:8.5px;letter-spacing:.06em;color:var(--violet);border:1px solid var(--violet);padding:2px 6px;}
.uf-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.uf-strong{color:var(--text);font-weight:700;}
.uf-where{color:var(--muted);}
.uf-left{flex-shrink:0;font-size:10.5px;color:var(--muted);}
.panel-card.flash{animation:flashCard 2.4s ease-in-out;}
/* menyala 2 kali: puncak di 18% dan 68%, redup di 43% */
@keyframes flashCard{0%,43%,100%{box-shadow:none;}18%,68%{box-shadow:inset 0 0 0 2px var(--violet),inset 0 0 34px rgba(123,97,255,.4);}}
/* Geser menu (guru) */
.menu-tab{user-select:none;}
.menu-tab[draggable="true"]{cursor:grab;}
.menu-tab.dragging{opacity:.35;}
.menu-tab.drag-over{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan),inset 0 0 12px rgba(43,227,255,.3);}
.menu-move{display:inline-block;margin-left:6px;padding:0 3px;font-size:9px;line-height:1;opacity:.65;cursor:pointer;}
.menu-move:hover{opacity:1;color:var(--cyan);}
.menu-move.disabled{opacity:.2;cursor:default;}
.menu-move.disabled:hover{color:inherit;opacity:.2;}
</style>
</head>
<body>
<div class="boot">
  <div class="boot-ring"></div>
  <div class="boot-line hud-font">INITIALIZING INTERFACE</div>
  <div class="boot-line hud-font">LINKING MAINFRAME</div>
  <div class="boot-line hud-font">J.A.R.V.I.S.I.C.E.R.Y // PAPAN PANEL</div>
</div>
<div id="app"></div>

<script>
(function(){
  // Guru: isi URL Web App Apps Script di bawah ini sebelum file dibagikan ke murid,
  // supaya murid otomatis terhubung tanpa perlu mengatur apa pun.
  var DEFAULT_API_URL = '';

  var STORAGE_KEY = 'papan-panel-state-v1';
  var CONFIG_KEY = 'papan-panel-config-v1';
  var defaultState = {menus:[{id:'m1', name:'Umum'}], activeMenu:'m1', panels:[]};
  var state = normalizeState(loadState());
  var config = loadConfig();
  var syncStatus = 'idle'; // idle | local | online | syncing | error
  var syncTimer = null;

  // ---- Peran: 'murid' (hanya lihat), 'petugas' (lihat item yang diizinkan), atau 'guru' (bisa mengubah semua) ----
  var role = 'murid';
  var actorPw = ''; // kata sandi guru ATAU petugas, tergantung peran saat ini
  try{
    var savedRole = sessionStorage.getItem('papan-panel-role');
    if(savedRole==='guru' || savedRole==='petugas'){
      role = savedRole;
      actorPw = sessionStorage.getItem('papan-panel-pw') || '';
    }
  }catch(e){}
  function isGuru(){ return role==='guru'; }
  function isPetugas(){ return role==='petugas'; }
  var fullLoaded = false; // true jika state di memori adalah data lengkap (bukan versi yang sudah disaring untuk peran ini)
  var JSON_HDR = {'Content-Type':'text/plain;charset=utf-8'}; // avoids CORS preflight on Apps Script

  // ---- Visibilitas 3 jalur: setiap item punya SATU pemilik akses -----
  // 'student' (biru, murid) | 'staff' (ungu, petugas) | 'teacher' (kuning, hanya guru)
  // Item ITU dan SEMUA induknya harus termasuk akses yang diizinkan untuk peran penonton.
  // Murid diizinkan: biru saja. Petugas diizinkan: biru + ungu (petugas tetap dianggap murid).
  function itemAccess(item){ return item.access || (item.hidden ? 'teacher' : 'student'); }
  // Petugas juga murid: boleh lihat item biru (murid) DAN ungu (petugas). Murid hanya biru.
  function viewerAllowedAccess(){ return isPetugas() ? ['student','staff'] : ['student']; } // hanya relevan saat bukan guru
  function menuVisible(id){
    if(isGuru()) return true;
    var m = state.menus.find(function(x){ return x.id===id; });
    return !!m && viewerAllowedAccess().indexOf(itemAccess(m))!==-1;
  }
  function panelVisible(p){ return isGuru() || (viewerAllowedAccess().indexOf(itemAccess(p))!==-1 && menuVisible(p.menuId)); }
  var ACCESS_LABEL = {student:'BIRU: murid (petugas ikut lihat)', staff:'UNGU: khusus petugas', teacher:'KUNING: hanya guru'};
  var ACCESS_NEXT = {student:'staff', staff:'teacher', teacher:'student'};
  function visToggle(kind, id, access, panelId){
    access = access || 'student';
    return '<span class="vis-tri'+(access!=='student'?' '+access:'')+'" role="button" data-vis="'+kind+'" data-id="'+id+'"'+(panelId?' data-panel="'+panelId+'"':'')+
      ' title="'+ACCESS_LABEL[access]+' (klik untuk ganti ke '+ACCESS_LABEL[ACCESS_NEXT[access]]+')"></span>';
  }
  // ---- Label BARU! & feed pembaruan (3 hari sejak item dibuat / mulai tampil ke murid) ----
  function inNewWindow(ts){ return !!ts && (Date.now() - ts) < NEW_BADGE_DURATION_MS; }
  function newTag(ts, eff){ return (eff && inNewWindow(ts)) ? '<span class="new-tag">BARU!</span>' : ''; }
  function menuById(id){ return state.menus.find(function(m){ return m.id===id; }); }
  function panelEff(p){ var m = menuById(p.menuId); return !!m && itemAccess(m)==='student' && itemAccess(p)==='student'; } // benar-benar bisa dilihat murid
  function timeLeft(ts){
    var h = Math.max(1, Math.ceil((ts + NEW_BADGE_DURATION_MS - Date.now()) / 3600000));
    return h>=24 ? Math.ceil(h/24)+' hari lagi' : h+' jam lagi';
  }
  var SAME_SESSION_MS = 60 * 60 * 1000; // anak yang dibuat <1 jam setelah induknya tidak dibuatkan baris sendiri
  function updateItems(){
    var items = [];
    state.menus.forEach(function(m){
      if(itemAccess(m)==='student' && inNewWindow(m.newAt)) items.push({kind:'menu', ts:m.newAt, title:m.name, menuId:m.id});
    });
    state.panels.forEach(function(p){
      if(p.type==='announcement' || !panelEff(p)) return; // pengumuman biasa sudah punya label BARU! sendiri
      var m = menuById(p.menuId);
      if(inNewWindow(p.newAt) && !(m.newAt && p.newAt - m.newAt < SAME_SESSION_MS)){
        items.push({kind:'panel', ts:p.newAt, title:p.title, where:'di menu '+m.name, menuId:m.id, panelId:p.id});
      }
      (p.subpanels||[]).forEach(function(sp){
        if(itemAccess(sp)!=='student' || !inNewWindow(sp.newAt)) return;
        if(p.newAt && sp.newAt - p.newAt < SAME_SESSION_MS) return;
        items.push({kind:'sub', ts:sp.newAt, title:sp.title, where:'di panel '+p.title+' · menu '+m.name, menuId:m.id, panelId:p.id});
      });
    });
    return items.sort(function(a, b){ return b.ts - a.ts; });
  }
  function updateFeedHtml(){
    var items = updateItems();
    if(!items.length) return '';
    var labels = {menu:'MENU BARU', panel:'PANEL BARU', sub:'SUB-PANEL BARU'};
    var rows = items.map(function(it){
      return '<div class="uf-item" data-goto-menu="'+it.menuId+'"'+(it.panelId?' data-goto-panel="'+it.panelId+'"':'')+'>'+
        '<span class="uf-kind">'+labels[it.kind]+'</span>'+
        '<span class="uf-text"><span class="uf-strong">'+esc(it.title)+'</span>'+(it.where?'<span class="uf-where"> · '+esc(it.where)+'</span>':'')+'</span>'+
        '<span class="uf-left">'+timeLeft(it.ts)+'</span></div>';
    }).join('');
    return '<div class="update-feed"><div class="uf-head"><div class="uf-title hud-font">PEMBARUAN</div>'+
      '<div class="uf-sub">Otomatis dari menu, panel &amp; sub-panel baru · berlaku 3 hari</div></div>'+
      '<div class="uf-list">'+rows+'</div></div>';
  }
  function goToItem(menuId, panelId){
    state.activeMenu = menuId; render(); persistLocal();
    if(panelId){
      var el = document.querySelector('.panel-card[data-pid="'+panelId+'"]');
      if(el){ el.scrollIntoView({behavior:'smooth', block:'center'}); el.classList.add('flash'); setTimeout(function(){ el.classList.remove('flash'); }, 2500); }
    }
  }

  function toggleVisibility(kind, id, panelId){
    if(!isGuru()) return;
    var item = null;
    if(kind==='menu') item = state.menus.find(function(m){ return m.id===id; });
    else if(kind==='panel') item = state.panels.find(function(p){ return p.id===id; });
    else { var pp = state.panels.find(function(x){ return x.id===panelId; }); item = pp && pp.subpanels.find(function(x){ return x.id===id; }); }
    if(!item) return;
    var next = ACCESS_NEXT[itemAccess(item)];
    item.access = next;
    delete item.hidden;
    if(next==='student') item.newAt = Date.now(); // baru diizinkan dilihat murid -> dianggap baru lagi
    save();
  }
  function setRole(r, pw){
    role = r; actorPw = pw || '';
    if(r==='murid') fullLoaded = false;
    try{
      if(r==='guru' || r==='petugas'){ sessionStorage.setItem('papan-panel-role', r); sessionStorage.setItem('papan-panel-pw', actorPw); }
      else { sessionStorage.removeItem('papan-panel-role'); sessionStorage.removeItem('papan-panel-pw'); }
    }catch(e){}
    render();
  }
  function hashPw(str){ var h=5381; for(var i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))|0; } return String(h); }

  // Migrasi: panel yang dibuat versi file lama belum punya field "type"/"subpanels".
  // Tanpa ini, filter berbasis type==='info' akan mengabaikan panel lama tsb sepenuhnya
  // sehingga tombol panah & drag terlihat tidak merespons pada panel-panel tersebut.
  function normalizeState(s){
    if(s){
      (s.menus||[]).forEach(function(m){ m.access = itemAccess(m); delete m.hidden; });
      if(Array.isArray(s.panels)){
        s.panels.forEach(function(p){
          if(p.type !== 'announcement') p.type = 'info';
          if(!Array.isArray(p.subpanels)) p.subpanels = [];
          p.access = itemAccess(p); delete p.hidden;
          p.subpanels.forEach(function(sp){ sp.access = itemAccess(sp); delete sp.hidden; });
        });
      }
    }
    return s;
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){ console.error(e); }
    return JSON.parse(JSON.stringify(defaultState));
  }
  function loadConfig(){
    try{
      var raw = localStorage.getItem(CONFIG_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return {apiUrl:''};
  }
  function persistLocal(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ console.error(e); }
  }
  function persistConfig(){
    try{ localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); }catch(e){}
  }

  function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
  function esc(s){ return (s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // ---- Pengumuman: label "BARU!" hilang otomatis setelah 3 hari ----
  var NEW_BADGE_DURATION_MS = 3 * 24 * 60 * 60 * 1000;
  function isFresh(p){
    var ts = p.newAt || p.createdAt; // newAt di-reset saat item diubah jadi tampil ke murid
    if(!ts) return false;
    return (Date.now() - ts) < NEW_BADGE_DURATION_MS;
  }
  function isExpired(p){
    if(!p.deadline) return false;
    // deadline disimpan sebagai 'YYYY-MM-DD'; anggap berakhir di akhir hari itu
    var end = new Date(p.deadline+'T23:59:59').getTime();
    return Date.now() > end;
  }
  function formatDate(dstr){
    if(!dstr) return '';
    var d = new Date(dstr+'T00:00:00');
    if(isNaN(d.getTime())) return dstr;
    var bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    return d.getDate()+' '+bulan[d.getMonth()]+' '+d.getFullYear();
  }

  // ---- Google Apps Script sync layer ----
  function apiUrl(){ return ((config.apiUrl||'').trim()) || (DEFAULT_API_URL||'').trim(); }
  function hasApi(){ return !!apiUrl(); }

  // Guru memuat data LENGKAP; petugas memuat versi yang sudah disaring server (hanya item akses "petugas");
  // murid memuat lewat GET (server sudah membuang item yang bukan akses "murid").
  function fetchState(){
    if(isGuru() || isPetugas()){
      var act = isGuru() ? 'load' : 'load_staff';
      return fetch(apiUrl(), {method:'POST', headers:JSON_HDR, body:JSON.stringify({action:act, password:actorPw})})
        .then(function(r){ return r.json(); })
        .then(function(res){
          if(res && res.error==='unauthorized') throw {unauthorized:true};
          if(res && res.ok && res.state) return res.state;
          throw new Error((res && res.error) || 'Gagal memuat data');
        });
    }
    return fetch(apiUrl(), {method:'GET'}).then(function(r){ return r.json(); });
  }

  function loadFromApi(silent){
    if(!hasApi()){ syncStatus='local'; render(); return; }
    if(!silent){ syncStatus='syncing'; render(); }
    fetchState()
      .then(function(data){
        var changed = false;
        if(data && typeof data==='object' && data.menus){
          var fresh = normalizeState(data);
          var keep = state.activeMenu; // menu aktif bersifat lokal per pengguna
          changed = JSON.stringify(fresh.panels)!==JSON.stringify(state.panels) || JSON.stringify(fresh.menus)!==JSON.stringify(state.menus);
          state = fresh;
          if(isGuru()) fullLoaded = true; // petugas & murid selalu menerima versi yang sudah disaring server (bukan data lengkap)
          if(keep && state.menus.some(function(m){ return m.id===keep; })) state.activeMenu = keep;
          persistLocal();
        }
        syncStatus='online';
        render();
      })
      .catch(function(err){
        if(err && err.unauthorized){
          alert('Sesi '+(isGuru()?'guru':'petugas')+' tidak valid (kata sandi ditolak server). Kamu dikembalikan ke mode murid.');
          setRole('murid');
          loadFromApi();
          return;
        }
        console.error('Gagal memuat dari mainframe:', err);
        syncStatus='error';
        if(silent) renderStatusOnly(); else render();
      });
  }

  function pushToApi(){
    if(!hasApi() || !isGuru()) return;
    if(!fullLoaded){ // jangan menimpa server dengan data yang belum lengkap
      syncStatus='error'; renderStatusOnly(); return;
    }
    syncStatus='syncing'; renderStatusOnly();
    fetch(apiUrl(), {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // avoids CORS preflight on Apps Script
      body: JSON.stringify({action:'save', password:actorPw, state:state})
    })
      .then(function(r){ return r.json(); })
      .then(function(res){
        if(res && res.error==='unauthorized'){
          alert('Sesi guru tidak valid (kata sandi ditolak server). Kamu dikembalikan ke mode murid.');
          setRole('murid');
          loadFromApi();
          return;
        }
        syncStatus = (res && res.ok) ? 'online' : 'error';
        renderStatusOnly();
      })
      .catch(function(err){
        console.error('Gagal menyimpan ke mainframe:', err);
        syncStatus='error';
        renderStatusOnly();
      });
  }

  function queueSync(){
    if(!hasApi() || !isGuru()) return;
    if(syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(pushToApi, 500); // debounce rapid edits
  }

  function statusLabel(){
    if(!hasApi()) return {cls:'local', text: (isGuru()||isPetugas()) ? 'MODE LOKAL' : 'HUBUNGKAN MAINFRAME'};
    if(syncStatus==='syncing') return {cls:'sync', text:'SYNCING...'};
    if(syncStatus==='online') return {cls:'online', text:'MAINFRAME ONLINE'};
    if(syncStatus==='error') return {cls:'error', text:'SYNC GAGAL'};
    return {cls:'local', text:'MENGHUBUNGKAN...'};
  }

  function renderStatusOnly(){
    var el = document.getElementById('status-dot');
    var lb = document.getElementById('status-label');
    if(!el||!lb) return;
    var s = statusLabel();
    el.className = 'dot '+s.cls;
    lb.textContent = s.text;
  }

  // ---- Render ----
  function render(){
    var app = document.getElementById('app');
    var s = statusLabel();
    var g = isGuru();
    if(state.menus.length && !state.menus.some(function(m){ return m.id===state.activeMenu; })) state.activeMenu = state.menus[0].id;
    var menusList = g ? state.menus : state.menus.filter(function(m){ return viewerAllowedAccess().indexOf(itemAccess(m))!==-1; });
    if(!menusList.some(function(m){ return m.id===state.activeMenu; })) state.activeMenu = menusList.length ? menusList[0].id : null;
    var menusHtml = menusList.map(function(m){
      var idx = state.menus.indexOf(m);
      var arrows = (g && m.id===state.activeMenu) ?
        '<span class="menu-move'+(idx<=0?' disabled':'')+'" data-movemenu="left" data-id="'+m.id+'" title="Geser menu ke kiri">\u25c0</span>'+
        '<span class="menu-move'+(idx>=state.menus.length-1?' disabled':'')+'" data-movemenu="right" data-id="'+m.id+'" title="Geser menu ke kanan">\u25b6</span>' : '';
      var mAcc = itemAccess(m);
      return '<div role="button" tabindex="0" class="menu-tab'+(m.id===state.activeMenu?' active':'')+(g&&mAcc==='teacher'?' teacher-only':'')+(g&&mAcc==='staff'?' staff-only':'')+'"'+(g?' draggable="true" title="Seret untuk mengubah urutan menu"':'')+' data-switch="'+m.id+'">'+esc(m.name)+newTag(m.newAt, mAcc==='student')+arrows+(g?visToggle('menu',m.id,mAcc)+'<span class="menu-del" data-delmenu="'+m.id+'">\u00d7</span>':'')+'</div>';
    }).join('');
    var histCount = historyItems().length;
    // Pengumuman yang sudah lewat batas waktu dipindahkan ke riwayat (tidak tampil di papan)
    var panels = state.panels.filter(function(p){ return p.menuId===state.activeMenu && panelVisible(p) && !(p.type==='announcement' && isExpired(p)); });
    // Panel pengumuman selalu tampil lebih dulu (kiri atas), urutan lain dipertahankan
    panels = panels.map(function(p, i){ return {p:p, i:i}; }).sort(function(a, b){
      var aAnn = (a.p.type==='announcement') ? 0 : 1;
      var bAnn = (b.p.type==='announcement') ? 0 : 1;
      if(aAnn !== bAnn) return aAnn - bAnn;
      return a.i - b.i;
    }).map(function(x){ return x.p; });
    var panelsHtml = panels.length ? panels.map(panelHtml).join('') : (!g && !hasApi() ? '<div class="empty">BELUM TERHUBUNG KE MAINFRAME<br>Klik "HUBUNGKAN MAINFRAME" di kanan atas, lalu tempel URL yang diberikan gurumu.</div>' : '<div class="empty">TIDAK ADA PANEL TERDETEKSI'+(g?'<br>Klik "+ TAMBAH PANEL" untuk memulai':'')+'</div>');
    app.innerHTML =
      '<header>'+
        '<div class="title-row">'+
          '<div class="brand">'+
            '<div class="brand-mark"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="#2be3ff" stroke-width="1.4" opacity="0.55"/><circle cx="20" cy="20" r="11" fill="none" stroke="#2be3ff" stroke-width="1.2" opacity="0.8"/><circle cx="20" cy="20" r="3.2" fill="#2be3ff"/><line x1="20" y1="1" x2="20" y2="7" stroke="#2be3ff" stroke-width="1.2"/><line x1="20" y1="33" x2="20" y2="39" stroke="#2be3ff" stroke-width="1.2"/><line x1="1" y1="20" x2="7" y2="20" stroke="#2be3ff" stroke-width="1.2"/><line x1="33" y1="20" x2="39" y2="20" stroke="#2be3ff" stroke-width="1.2"/></svg></div>'+
            '<div><h1 class="hud-font">J.A.R.V.I.S.I.C.E.R.Y</h1><small>PAPAN PANEL — ANTARMUKA KONTROL</small></div>'+
          '</div>'+
          '<div class="header-right">'+
            '<div class="header-row"><span class="role-pill'+(role!=='murid'?' active':'')+'">'+(g?'MODE GURU':isPetugas()?'MODE PETUGAS':'MODE MURID')+'</span>'+
            '<div class="status" id="status-toggle" title="Pengaturan koneksi mainframe"><span class="dot '+s.cls+'" id="status-dot"></span><span id="status-label">'+s.text+'</span></div></div>'+
            '<div class="header-row">'+
              '<div class="hist-btn" id="hist-btn" title="Lihat riwayat pengumuman">RIWAYAT PENGUMUMAN'+(histCount?'<span class="hist-count">'+histCount+'</span>':'')+'</div>'+
              (role==='murid' ?
                '<div class="role-btn" id="role-btn-guru">MASUK GURU</div><div class="role-btn" id="role-btn-petugas">MASUK PETUGAS</div>' :
                '<div class="role-btn" id="role-btn-logout">'+(g?'KELUAR GURU':'KELUAR PETUGAS')+'</div>') +
            '</div>'+
          '</div>'+
        '</div>'+
        '<div class="menu-row">'+menusHtml+(g?'<button id="add-menu-btn" data-addmenu>+ MENU</button>':'')+'</div>'+
      '</header>'+
      '<main>'+
        updateFeedHtml()+
        (g?'<div class="vis-legend"><span class="vis-tri"></span>Biru: murid (petugas ikut lihat)<span class="vis-tri staff"></span>Ungu: khusus petugas<span class="vis-tri teacher"></span>Kuning: hanya guru<span>· Klik segitiga untuk gonta-ganti akses. Menu/panel kuning menyembunyikan dari murid & petugas; ungu menyembunyikan dari murid saja. · Seret tab menu (atau pakai panah ◀ ▶ di menu aktif) untuk mengatur urutan.</span></div>':'')+
        (g?'<button class="add-panel-btn" data-addpanel>+ TAMBAH PANEL</button>':'')+
        '<div class="panels-grid">'+panelsHtml+'</div>'+
      '</main>';
    app.querySelectorAll('[data-switch]').forEach(function(el){ el.addEventListener('click', function(){ state.activeMenu = el.getAttribute('data-switch'); render(); persistLocal(); }); });
    app.querySelectorAll('[data-delmenu]').forEach(function(el){ el.addEventListener('click', function(e){ e.stopPropagation(); delMenu(el.getAttribute('data-delmenu')); }); });
    var am = document.getElementById('add-menu-btn'); if(am) am.addEventListener('click', addMenuModal);
    var ap = app.querySelector('[data-addpanel]'); if(ap) ap.addEventListener('click', addPanelModal);
    app.querySelectorAll('[data-delpanel]').forEach(function(el){ el.addEventListener('click', function(){ delPanel(el.getAttribute('data-delpanel')); }); });
    app.querySelectorAll('[data-addsub]').forEach(function(el){ el.addEventListener('click', function(){ addSubModal(el.getAttribute('data-addsub')); }); });
    app.querySelectorAll('[data-delsub]').forEach(function(el){ el.addEventListener('click', function(){ delSub(el.getAttribute('data-delsub'), el.getAttribute('data-panel')); }); });
    app.querySelectorAll('[data-movepanel]').forEach(function(el){ el.addEventListener('click', function(){ movePanelPosition(el.getAttribute('data-pid'), el.getAttribute('data-movepanel')==='up'?-1:1); }); });
    var st = document.getElementById('status-toggle'); if(st) st.addEventListener('click', settingsModal);
    app.querySelectorAll('.menu-tab').forEach(function(el){ el.addEventListener('keydown', function(e){ if((e.key==='Enter'||e.key===' ') && e.target===el){ e.preventDefault(); el.click(); } }); });
    app.querySelectorAll('[data-movemenu]').forEach(function(el){ el.addEventListener('click', function(e){ e.stopPropagation(); moveMenuPosition(el.getAttribute('data-id'), el.getAttribute('data-movemenu')==='left'?-1:1); }); });
    app.querySelectorAll('[data-goto-menu]').forEach(function(el){ el.addEventListener('click', function(){ goToItem(el.getAttribute('data-goto-menu'), el.getAttribute('data-goto-panel')); }); });
    app.querySelectorAll('[data-vis]').forEach(function(el){ el.addEventListener('click', function(e){ e.stopPropagation(); toggleVisibility(el.getAttribute('data-vis'), el.getAttribute('data-id'), el.getAttribute('data-panel')); }); });
    var rbg = document.getElementById('role-btn-guru'); if(rbg) rbg.addEventListener('click', function(){ loginModal('guru'); });
    var rbp = document.getElementById('role-btn-petugas'); if(rbp) rbp.addEventListener('click', function(){ loginModal('petugas'); });
    var rbo = document.getElementById('role-btn-logout'); if(rbo) rbo.addEventListener('click', function(){ setRole('murid'); if(hasApi()) loadFromApi(); });
    var hb = document.getElementById('hist-btn'); if(hb) hb.addEventListener('click', historyModal);
    wireDragAndDrop(app);
  }

  // ---- Drag & drop wiring (native HTML5 DnD) ----
  function wireDragAndDrop(app){
    var draggedPanelId = null;
    app.querySelectorAll('[data-dragpanel]').forEach(function(handle){
      handle.addEventListener('dragstart', function(e){
        draggedPanelId = handle.getAttribute('data-dragpanel');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', draggedPanelId);
        var card = handle.closest('.panel-card');
        if(card) setTimeout(function(){ card.classList.add('dragging'); }, 0);
      });
      handle.addEventListener('dragend', function(){
        var card = handle.closest('.panel-card');
        if(card) card.classList.remove('dragging');
        draggedPanelId = null;
        app.querySelectorAll('.panel-card.drag-over').forEach(function(c){ c.classList.remove('drag-over'); });
      });
    });
    app.querySelectorAll('.panel-card.type-info').forEach(function(card){
      card.addEventListener('dragover', function(e){
        if(!draggedPanelId) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        card.classList.add('drag-over');
      });
      card.addEventListener('dragleave', function(){ card.classList.remove('drag-over'); });
      card.addEventListener('drop', function(e){
        e.preventDefault();
        card.classList.remove('drag-over');
        var targetId = card.getAttribute('data-pid');
        var dragId = draggedPanelId || e.dataTransfer.getData('text/plain');
        if(dragId) reorderInfoPanels(dragId, targetId);
      });
    });

    var draggedSubId = null, draggedSubPanel = null;
    app.querySelectorAll('[data-dragsub]').forEach(function(handle){
      handle.addEventListener('dragstart', function(e){
        draggedSubId = handle.getAttribute('data-dragsub');
        draggedSubPanel = handle.getAttribute('data-panel');
        e.stopPropagation();
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', draggedSubId);
        var sub = handle.closest('.sub-card');
        if(sub) setTimeout(function(){ sub.classList.add('dragging'); }, 0);
      });
      handle.addEventListener('dragend', function(){
        var sub = handle.closest('.sub-card');
        if(sub) sub.classList.remove('dragging');
        draggedSubId = null; draggedSubPanel = null;
        app.querySelectorAll('.sub-card.drag-over').forEach(function(c){ c.classList.remove('drag-over'); });
      });
    });
    app.querySelectorAll('.sub-card').forEach(function(sub){
      sub.addEventListener('dragover', function(e){
        if(!draggedSubId || draggedSubPanel!==sub.getAttribute('data-panel')) return;
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = 'move';
        sub.classList.add('drag-over');
      });
      sub.addEventListener('dragleave', function(){ sub.classList.remove('drag-over'); });
      sub.addEventListener('drop', function(e){
        e.preventDefault();
        e.stopPropagation();
        sub.classList.remove('drag-over');
        var targetId = sub.getAttribute('data-subid');
        var panelId = sub.getAttribute('data-panel');
        var dragId = draggedSubId || e.dataTransfer.getData('text/plain');
        if(dragId && panelId===draggedSubPanel) reorderSubpanels(panelId, dragId, targetId);
      });
    });

    // ---- Geser tab menu (guru) ----
    var draggedMenuId = null;
    app.querySelectorAll('.menu-tab[draggable="true"]').forEach(function(tab){
      tab.addEventListener('dragstart', function(e){
        draggedMenuId = tab.getAttribute('data-switch');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', draggedMenuId);
        setTimeout(function(){ tab.classList.add('dragging'); }, 0);
      });
      tab.addEventListener('dragend', function(){
        draggedMenuId = null;
        app.querySelectorAll('.menu-tab.dragging, .menu-tab.drag-over').forEach(function(t){ t.classList.remove('dragging','drag-over'); });
      });
      tab.addEventListener('dragover', function(e){
        if(!draggedMenuId) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        tab.classList.add('drag-over');
      });
      tab.addEventListener('dragleave', function(){ tab.classList.remove('drag-over'); });
      tab.addEventListener('drop', function(e){
        e.preventDefault();
        tab.classList.remove('drag-over');
        var dragId = draggedMenuId || e.dataTransfer.getData('text/plain');
        if(dragId) reorderMenus(dragId, tab.getAttribute('data-switch'));
      });
    });
  }

  function panelHtml(p){
    return (p.type==='announcement') ? announcementPanelHtml(p) : infoPanelHtml(p);
  }

  function infoPanelHtml(p){
    var g = isGuru();
    var subsList = g ? p.subpanels : p.subpanels.filter(function(x){ return viewerAllowedAccess().indexOf(itemAccess(x))!==-1; });
    var subs = subsList.map(function(s){
      var sAcc = itemAccess(s);
      return '<div class="sub-card'+(g&&sAcc==='teacher'?' teacher-only':'')+(g&&sAcc==='staff'?' staff-only':'')+'" data-subid="'+s.id+'" data-panel="'+p.id+'">'+
        '<div class="sub-head">'+
          '<div class="sub-head-left">'+(g?'<span class="drag-handle" draggable="true" data-dragsub="'+s.id+'" data-panel="'+p.id+'" title="Seret untuk urutkan">\u283f</span>':'')+
          '<div><div class="sub-title">'+esc(s.title)+newTag(s.newAt, panelEff(p) && sAcc==='student')+'</div>'+(s.subtitle?'<div class="sub-subtitle">'+esc(s.subtitle)+'</div>':'')+'</div></div>'+
          (g?'<div class="sub-head-right">'+visToggle('sub',s.id,sAcc,p.id)+'<button class="icon-btn" data-delsub="'+s.id+'" data-panel="'+p.id+'">\u00d7</button></div>':'')+
        '</div>'+
        (s.image?'<img src="'+esc(s.image)+'" alt="">':'')+
        (s.linkUrl?'<a class="sub-link" href="'+esc(s.linkUrl)+'" target="_blank" rel="noopener">'+esc(s.linkLabel||s.linkUrl)+'</a>':'')+
      '</div>';
    }).join('');
    var pAcc = itemAccess(p);
    return '<div class="panel-card type-info'+(g&&pAcc==='teacher'?' teacher-only':'')+(g&&pAcc==='staff'?' staff-only':'')+'" data-pid="'+p.id+'">'+
      '<div class="panel-head"><div class="panel-head-left">'+(g?'<span class="drag-handle" draggable="true" data-dragpanel="'+p.id+'" title="Seret untuk urutkan">\u283f</span>':'')+'<h3 class="hud-font">'+esc(p.title)+'</h3>'+newTag(p.newAt, panelEff(p))+'</div>'+
      (g?'<div class="panel-head-right">'+visToggle('panel',p.id,pAcc)+
        '<button class="move-btn" data-movepanel="up" data-pid="'+p.id+'" title="Pindah ke atas">\u25b2</button>'+
        '<button class="move-btn" data-movepanel="down" data-pid="'+p.id+'" title="Pindah ke bawah">\u25bc</button>'+
        '<button class="icon-btn" data-delpanel="'+p.id+'">\u00d7</button>'+
      '</div>':'')+'</div>'+
      '<div class="panel-body" data-panelbody="'+p.id+'">'+subs+
      (g?'<button class="add-sub-btn" data-addsub="'+p.id+'">+ SUB-PANEL</button>':'')+'</div>'+
    '</div>';
  }

  function announcementPanelHtml(p){
    var expired = isExpired(p);
    var fresh = isFresh(p) && !expired && panelEff(p);
    var annAcc = itemAccess(p);
    return '<div class="panel-card type-announcement'+(expired?' expired':'')+(isGuru()&&annAcc==='teacher'?' teacher-only':'')+(isGuru()&&annAcc==='staff'?' staff-only':'')+'">'+
      (fresh?'<div class="new-badge">BARU!</div>':'')+
      '<div class="panel-head"><h3 class="hud-font">'+esc(p.title)+'</h3>'+(isGuru()?'<div class="panel-head-right">'+visToggle('panel',p.id,annAcc)+'<button class="icon-btn" data-delpanel="'+p.id+'">\u00d7</button></div>':'')+'</div>'+
      '<div class="panel-body">'+
        '<div class="ann-body">'+esc(p.body)+'</div>'+
        '<div class="ann-meta">'+
          '<span class="status-pill'+(expired?' expired':'')+'">'+(expired?'SUDAH DIUMUMKAN':'AKTIF')+'</span>'+
          (p.deadline?'<span class="ann-deadline">Batas waktu: '+formatDate(p.deadline)+'</span>':'')+
        '</div>'+
      '</div>'+
    '</div>';
  }

  function openModal(title, sub, fields, onSave, saveLabel){
    var ov = document.createElement('div'); ov.className='modal-overlay';
    var f = fields.map(function(fl){
      if(fl.type==='textarea'){
        return '<label>'+fl.label+'</label><textarea data-f="'+fl.name+'" placeholder="'+(fl.placeholder||'')+'">'+esc(fl.value||'')+'</textarea>';
      }
      return '<label>'+fl.label+'</label><input data-f="'+fl.name+'" type="'+(fl.type||'text')+'" value="'+esc(fl.value||'')+'" placeholder="'+(fl.placeholder||'')+'">';
    }).join('');
    ov.innerHTML = '<div class="modal"><h4 class="hud-font">'+title+'</h4>'+(sub?'<div class="sub">'+sub+'</div>':'')+f+'<div class="modal-actions"><button class="btn" data-cancel>BATAL</button><button class="btn btn-primary" data-save>'+(saveLabel||'SIMPAN')+'</button></div></div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', function(e){ if(e.target===ov) ov.remove(); });
    ov.querySelector('[data-cancel]').onclick = function(){ ov.remove(); };
    ov.querySelectorAll('input').forEach(function(inp){ inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); ov.querySelector('[data-save]').click(); } }); });
    ov.querySelector('[data-save]').onclick = function(){
      var vals = {};
      fields.forEach(function(fl){ vals[fl.name] = ov.querySelector('[data-f="'+fl.name+'"]').value.trim(); });
      ov.remove();
      onSave(vals);
    };
    return ov;
  }

  function openChoice(title, sub, choices){
    var ov = document.createElement('div'); ov.className='modal-overlay';
    var btns = choices.map(function(c, i){ return '<button data-c="'+i+'"><span class="ico">'+c.icon+'</span>'+c.label+'</button>'; }).join('');
    ov.innerHTML = '<div class="modal"><h4 class="hud-font">'+title+'</h4>'+(sub?'<div class="sub">'+sub+'</div>':'')+'<div class="type-choice">'+btns+'</div><div class="modal-actions"><button class="btn" data-cancel>BATAL</button></div></div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', function(e){ if(e.target===ov) ov.remove(); });
    ov.querySelector('[data-cancel]').onclick = function(){ ov.remove(); };
    ov.querySelectorAll('[data-c]').forEach(function(btn){
      btn.onclick = function(){ var idx = +btn.getAttribute('data-c'); ov.remove(); choices[idx].onPick(); };
    });
    return ov;
  }

  function addMenuModal(){

      if(!v.name) return;
      var id = uid();
      state.menus.push({id:id, name:v.name, newAt:Date.now()});

    });

  function delMenu(id){
    if(!isGuru()) return;
    if(!confirm('Hapus menu ini beserta semua panelnya?')) return;
    state.menus = state.menus.filter(function(m){ return m.id!==id; });
    state.panels = state.panels.filter(function(p){ return p.menuId!==id; });

    if(!isGuru()) return;

    openChoice('PILIH TIPE PANEL', 'Panel pengumuman selalu tampil di posisi kiri atas.', [
      {icon:'\u26a0', label:'PENGUMUMAN', onPick: addAnnouncementModal},

      {name:'title', label:'Judul pengumuman', placeholder:'Contoh: Libur Nasional'},

    ], function(v){

  function addSubModal(panelId){

    if(!isGuru()) return;
    var p = state.panels.find(function(p){ return p.id===panelId; });
    if(!p) return;
    p.subpanels = p.subpanels.filter(function(s){ return s.id!==subId; });

  }

  // ---- Reorder via drag & drop ----
  function reorderInfoPanels(draggedId, targetId){
    if(!isGuru()) return;
    if(draggedId===targetId) return;
    var idxs = [];
    state.panels.forEach(function(p, i){ if(p.menuId===state.activeMenu && p.type!=='announcement') idxs.push(i); });
    var items = idxs.map(function(i){ return state.panels[i]; });
    var di = items.findIndex(function(p){ return p.id===draggedId; });
    var ti = items.findIndex(function(p){ return p.id===targetId; });
    if(di<0 || ti<0 || di===ti) return;
    var moved = items.splice(di, 1)[0];
    // ti is the target's index BEFORE removal; splicing at that same numeric
    // index on the shortened array correctly places moved right after the
    // target when dragging forward, and right before it when dragging
    // backward. Recomputing ti via findIndex after the splice (as before)
    // breaks the forward case and made adjacent-forward drags a no-op.
    items.splice(ti, 0, moved);
    idxs.forEach(function(origIdx, k){ state.panels[origIdx] = items[k]; });
    save();
  }
  function reorderSubpanels(panelId, draggedId, targetId){
    if(!isGuru()) return;
    if(draggedId===targetId) return;
    var p = state.panels.find(function(x){ return x.id===panelId; });
    if(!p) return;
    var arr = p.subpanels;
    var di = arr.findIndex(function(s){ return s.id===draggedId; });
    var ti = arr.findIndex(function(s){ return s.id===targetId; });
    if(di<0 || ti<0 || di===ti) return;
    var moved = arr.splice(di, 1)[0];
    arr.splice(ti, 0, moved); // see note above in reorderInfoPanels
    save();
  }
  function reorderMenus(draggedId, targetId){
    if(!isGuru() || draggedId===targetId) return;
    var arr = state.menus;
    var di = arr.findIndex(function(m){ return m.id===draggedId; });
    var ti = arr.findIndex(function(m){ return m.id===targetId; });
    if(di<0 || ti<0 || di===ti) return;
    var moved = arr.splice(di, 1)[0];
    arr.splice(ti, 0, moved); // geser maju: tepat setelah target; geser mundur: tepat sebelum target
    save();
  }
  function moveMenuPosition(id, direction){
    if(!isGuru()) return;
    var arr = state.menus;
    var pos = arr.findIndex(function(m){ return m.id===id; });
    var np = pos + direction;
    if(pos<0 || np<0 || np>=arr.length) return;
    var tmp = arr[pos]; arr[pos] = arr[np]; arr[np] = tmp;
    save();
  }
  function movePanelPosition(panelId, direction){
    if(!isGuru()) return;
    // direction: -1 = naik satu posisi, +1 = turun satu posisi, di antara panel informasi lain saja
    var idxs = [];
    state.panels.forEach(function(p, i){ if(p.menuId===state.activeMenu && p.type!=='announcement') idxs.push(i); });
    var items = idxs.map(function(i){ return state.panels[i]; });
    var pos = items.findIndex(function(p){ return p.id===panelId; });
    var newPos = pos + direction;
    if(pos<0 || newPos<0 || newPos>=items.length) return;
    var tmp = items[pos]; items[pos] = items[newPos]; items[newPos] = tmp;
    idxs.forEach(function(origIdx, k){ state.panels[origIdx] = items[k]; });
    save();
  }

  // ---- Riwayat pengumuman ----
  function historyItems(){
    return state.panels.filter(function(p){ return p.type==='announcement' && isExpired(p) && panelVisible(p); })
      .sort(function(a, b){ return (b.deadline||'').localeCompare(a.deadline||''); });
  }
  function menuName(id){
    var m = state.menus.find(function(x){ return x.id===id; });
    return m ? m.name : '-';
  }
  function historyModal(){
    var ov = document.createElement('div'); ov.className = 'modal-overlay';
    document.body.appendChild(ov);
    ov.addEventListener('click', function(e){ if(e.target===ov) ov.remove(); });
    function draw(){
      var items = historyItems();
      var list = items.length ? items.map(function(p){
        return '<div class="hist-item">'+
          '<div class="hist-top"><div class="hist-title">'+esc(p.title)+'</div>'+(isGuru()?'<button class="icon-btn" data-delhist="'+p.id+'" title="Hapus dari riwayat">\u00d7</button>':'')+'</div>'+
          (p.body?'<div class="hist-body">'+esc(p.body)+'</div>':'')+
          '<div class="hist-meta"><span class="hist-menu">Menu: '+esc(menuName(p.menuId))+'</span>'+
            '<span>Batas waktu: '+formatDate(p.deadline)+'</span>'+
            (p.createdAt?'<span>Dibuat: '+formatDate(new Date(p.createdAt).toISOString().slice(0,10))+'</span>':'')+
          '</div></div>';
      }).join('') : '<div class="hist-empty">BELUM ADA RIWAYAT PENGUMUMAN<br>Pengumuman yang lewat batas waktu akan tersimpan di sini.</div>';
      ov.innerHTML = '<div class="modal wide"><h4 class="hud-font">RIWAYAT PENGUMUMAN</h4>'+
        '<div class="sub">'+items.length+' pengumuman sudah diumumkan (lewat batas waktu).</div>'+
        '<div class="hist-list">'+list+'</div>'+
        '<div class="modal-actions"><button class="btn" data-close>TUTUP</button></div></div>';
      ov.querySelector('[data-close]').onclick = function(){ ov.remove(); };
      ov.querySelectorAll('[data-delhist]').forEach(function(b){
        b.onclick = function(){
          if(!isGuru()) return;
          if(!confirm('Hapus pengumuman ini dari riwayat secara permanen?')) return;
          var id = b.getAttribute('data-delhist');
          state.panels = state.panels.filter(function(p){ return p.id!==id; });
          save();
          draw();
        };
      });
    }
    draw();
  }

  function settingsModal(){
    var g = isGuru();
    var ov = openModal('KONEKSI MAINFRAME',
      g ? 'Tempel URL Web App Google Apps Script untuk menyimpan data ke Google Sheets. Kosongkan untuk mode lokal (localStorage saja).'
        : 'Tempel URL mainframe yang diberikan gurumu. Kamu hanya bisa melihat isinya, tidak bisa mengubahnya.',
      [{name:'apiUrl', label:'Apps Script Web App URL', placeholder:'https://script.google.com/macros/s/.../exec', value:config.apiUrl||DEFAULT_API_URL}],
      function(v){
        config.apiUrl = v.apiUrl;
        persistConfig();
        if(hasApi()){ loadFromApi(); } else { syncStatus='local'; render(); }
      }, 'HUBUNGKAN');
    var hint = document.createElement('div');
    hint.className = 'hint';
    hint.innerHTML = g ? 'Deploy skrip Apps Script sebagai Web App (Execute as: Me, Access: Anyone), lalu tempel URL <code>/exec</code> di atas.'
                       : 'Alamat ini biasanya berakhiran <code>/exec</code>. Tanyakan ke gurumu jika belum punya.';
    ov.querySelector('.modal').appendChild(hint);
    if(g){
      var box = document.createElement('div');
      box.className = 'hint';
      box.style.borderTop = '1px solid var(--line)';
      box.style.paddingTop = '12px';
      box.innerHTML = '<b style="color:var(--cyan)">Bagikan ke murid</b><br>Unduh salinan halaman yang sudah terisi URL di atas, lalu kirim file itu ke murid. Murid langsung terhubung tanpa perlu mengetik URL. Kata sandi guru tidak ikut tersimpan di dalam file.<br>';
      var btn = document.createElement('button');
      btn.className = 'btn'; btn.style.marginTop = '8px'; btn.textContent = 'UNDUH FILE UNTUK MURID';
      btn.onclick = function(){ downloadStudentCopy(ov.querySelector('[data-f="apiUrl"]').value.trim()); };
      box.appendChild(btn);
      ov.querySelector('.modal').appendChild(box);
    }
  }

  // Salinan halaman untuk murid: sama persis, hanya DEFAULT_API_URL yang sudah terisi.
  function downloadStudentCopy(url){
    url = url || apiUrl();
    if(!url){ alert('Isi dan simpan URL mainframe terlebih dahulu.'); return; }
    var clone = document.documentElement.cloneNode(true);
    var appEl = clone.querySelector('#app'); if(appEl) appEl.innerHTML = '';
    clone.querySelectorAll('.modal-overlay').forEach(function(n){ n.remove(); });
    var html = '<!DOCTYPE html>\n' + clone.outerHTML;
    html = html.replace(/var DEFAULT_API_URL = '[^']*';/, function(){ return 'var DEFAULT_API_URL = ' + JSON.stringify(url) + ';'; });
    var blob = new Blob([html], {type:'text/html'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'papan-panel-murid.html';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 800);
  }

  function save(){ if(!isGuru()){ render(); return; } render(); persistLocal(); queueSync(); }

  // ---- Login guru / petugas ----
  function loginModal(kind){
    var hdr = {'Content-Type':'text/plain;charset=utf-8'};
    var isG = kind==='guru';
    var label = isG ? 'GURU' : 'PETUGAS';
    var loginAction = isG ? 'login' : 'login_staff';
    var localKey = isG ? 'localPw' : 'localStaffPw';
    if(hasApi()){
      openModal('MASUK SEBAGAI '+label, 'Kata sandi diperiksa oleh server (Google Apps Script).',
        [{name:'pw', label:'Kata sandi '+label.toLowerCase(), type:'password'}],
        function(v){
          if(!v.pw) return;
          fetch(apiUrl(), {method:'POST', headers:hdr, body:JSON.stringify({action:loginAction, password:v.pw})})
            .then(function(r){ return r.json(); })
            .then(function(res){
              if(res && res.ok){
                if(res.state && typeof res.state==='object' && res.state.menus){
                  var keep = state.activeMenu;
                  state = normalizeState(res.state);
                  if(keep && state.menus.some(function(m){ return m.id===keep; })) state.activeMenu = keep;
                  persistLocal();
                }
                fullLoaded = isG; // versi petugas tetap versi tersaring, bukan data lengkap
                setRole(kind, v.pw);
              }
              else alert('Kata sandi salah, atau Code.gs di server belum diperbarui ke versi yang mendukung peran '+label.toLowerCase()+'.');
            })
            .catch(function(){ alert('Tidak dapat menghubungi mainframe. Periksa koneksi internet dan URL Web App.'); });
        }, 'MASUK');
    } else if(!config[localKey]){
      openModal('BUAT KATA SANDI '+label, 'Mode lokal (belum terhubung ke Apps Script): kata sandi hanya disimpan di browser ini dan tidak mengamankan data dari orang lain yang memakai browser yang sama.',
        [{name:'pw', label:'Kata sandi baru', type:'password'}],
        function(v){
          if(!v.pw) return;
          config[localKey] = hashPw(v.pw); persistConfig();
          setRole(kind, '');
        }, 'SIMPAN & MASUK');
    } else {
      openModal('MASUK SEBAGAI '+label, null,
        [{name:'pw', label:'Kata sandi '+label.toLowerCase(), type:'password'}],
        function(v){
          if(hashPw(v.pw||'')===config[localKey]){ setRole(kind, ''); }
          else alert('Kata sandi salah.');
        }, 'MASUK');
    }
  }

  render();
  loadFromApi();
  setInterval(function(){
    // murid: ambil data terbaru dari mainframe secara berkala; guru: cukup segarkan tampilan
    if(!isGuru() && hasApi()) loadFromApi(true); else render();
  }, 60 * 1000);
})();
