  // ---- Highfive: tombol "colek" tanpa login, satu kali per pengguna per panel pengumuman ----
  var CLIENT_ID_KEY = 'papan-panel-clientid';
  var HF_DONE_KEY = 'papan-panel-hf-done';
  function clientId(){
    try{
      var id = localStorage.getItem(CLIENT_ID_KEY);
      if(!id){ id = uid()+uid(); localStorage.setItem(CLIENT_ID_KEY, id); }
      return id;
    }catch(e){ return 'anon-'+Date.now(); }
  }
  function hfDoneSet(){
    try{ return JSON.parse(localStorage.getItem(HF_DONE_KEY)||'[]'); }catch(e){ return []; }
  }
  function hfAlreadyDone(panelId){ return hfDoneSet().indexOf(panelId)!==-1; }
  function hfMarkDone(panelId){
    try{
      var arr = hfDoneSet();
      if(arr.indexOf(panelId)===-1){ arr.push(panelId); localStorage.setItem(HF_DONE_KEY, JSON.stringify(arr)); }
    }catch(e){}
  }
  function toggleHighfive(panelId){
    if(!isGuru()) return;
    var p = state.panels.find(function(x){ return x.id===panelId; });
    if(!p || p.type!=='announcement') return;
    p.highfiveEnabled = !p.highfiveEnabled;
    save();
  }
  function doHighfive(panelId, btn){
    if(hfAlreadyDone(panelId)) return;
    var p = state.panels.find(function(x){ return x.id===panelId; });
    if(!p || !p.highfiveEnabled) return;
    if(btn) btn.disabled = true;
    if(!hasApi()){
      // tanpa mainframe: hitung di perangkat ini saja supaya fitur tetap berfungsi
      p.highfiveCount = (p.highfiveCount||0) + 1;
      hfMarkDone(panelId);
      persistLocal();
      render();
      return;
    }
    fetch(apiUrl(), {method:'POST', headers:JSON_HDR, body:JSON.stringify({action:'highfive', panelId:panelId, clientId:clientId()})})
      .then(function(r){ return r.json(); })
      .then(function(res){
        if(res && res.ok){
          p.highfiveCount = res.count;
          hfMarkDone(panelId);
          persistLocal();
        }
        render();
      })
      .catch(function(){ if(btn) btn.disabled = false; });
  }
  function fetchHighfiveCounts(){
    if(!hasApi()) return;
    fetch(apiUrl()+(apiUrl().indexOf('?')===-1?'?':'&')+'counts=1', {method:'GET'})
      .then(function(r){ return r.json(); })
      .then(function(counts){
        if(!counts || typeof counts!=='object') return;
        var changed = false;
        state.panels.forEach(function(p){
          if(p.type==='announcement'){
            var c = counts[p.id]||0;
            if(p.highfiveCount!==c){ p.highfiveCount=c; changed=true; }
          }
        });
        if(changed){ persistLocal(); render(); }
      })
      .catch(function(){});
  }

  // ---- Komposisi panel per baris (per menu) ----
  // menu.rows = daftar jumlah panel untuk baris 1, 2, 3, ... (tiap nilai 1/2/3); menu.cols = jumlah untuk baris berikutnya (default 3).
  function currentMenu(){ return state.menus.find(function(x){ return x.id===state.activeMenu; }); }
  function menuPlan(m, rk, ck){
    rk = rk||'rows'; ck = ck||'cols';
    var rows = (m && Array.isArray(m[rk]) ? m[rk] : []).map(Number).filter(function(n){ return n===1||n===2||n===3; }).slice(0,50);
    var rest = m ? Number(m[ck]) : 3;
    if(!(rest===1||rest===2||rest===3)) rest = 3;
    return {rows:rows, rest:rest};
  }
  // Jumlah-panel-per-baris untuk tiap panel, berurutan (panel ke-i berada di baris berukuran sizes[i]).
  function planSizes(plan, n){
    var sizes = [], i = 0, r = 0;
    while(i < n){
      var k = r < plan.rows.length ? plan.rows[r] : plan.rest;
      for(var j=0; j<k && i<n; j++){ sizes.push(k); i++; }
      r++;
    }
    return sizes;
  }
  function planSummary(plan){
    return plan.rows.length ? plan.rows.join(' \u00b7 ')+' \u00b7 lalu '+plan.rest : plan.rest+' per baris';
  }
  var LAYOUT_ICONS = {
    1:'<svg viewBox="0 0 24 16" fill="currentColor" stroke="currentColor" stroke-width="1.2"><rect x="1" y="1.5" width="22" height="13" rx="1" fill-opacity=".22"/></svg>',
    2:'<svg viewBox="0 0 24 16" fill="currentColor" stroke="currentColor" stroke-width="1.2"><rect x="1" y="1.5" width="10.2" height="13" rx="1" fill-opacity=".22"/><rect x="12.8" y="1.5" width="10.2" height="13" rx="1" fill-opacity=".22"/></svg>',
    3:'<svg viewBox="0 0 24 16" fill="currentColor" stroke="currentColor" stroke-width="1.2"><rect x="1" y="1.5" width="6.4" height="13" rx="1" fill-opacity=".22"/><rect x="8.8" y="1.5" width="6.4" height="13" rx="1" fill-opacity=".22"/><rect x="16.6" y="1.5" width="6.4" height="13" rx="1" fill-opacity=".22"/></svg>'
  };
  var LAYOUT_NAMES = {1:'1 panel di baris ini', 2:'2 panel di baris ini', 3:'3 panel di baris ini'};
  function layoutButtonHtml(){
    return '<button class="layout-open" data-layout title="Atur jumlah panel di tiap baris">'+LAYOUT_ICONS[3]+'<span>TATA LETAK</span><span class="lo-sum">'+esc(planSummary(menuPlan(currentMenu())))+'</span></button>';
  }
  // cfg (opsional) memakai modal ini untuk objek lain: {obj, rows, cols, count, label, noun, title, hint, after}; tanpa cfg = tata letak panel di menu aktif
  function layoutModal(cfg){
    cfg = cfg || {};
    if(!isGuru()) return;
    var m0 = cfg.obj || currentMenu(); if(!m0) return;
    var menuId = m0.id;
    var rk = cfg.rows||'rows', ck = cfg.cols||'cols', noun = cfg.noun||'panel';
    var label = cfg.label || ('Menu "'+m0.name+'"');
    var plan0 = menuPlan(m0, rk, ck);
    var draft = {rows: plan0.rows.slice(), rest: plan0.rest};
    var count = cfg.count!=null ? cfg.count : document.querySelectorAll('.panels-grid > .panel-card').length;
    var ov = document.createElement('div'); ov.className = 'modal-overlay';
    ov.innerHTML = '<div class="modal layout-modal"><h4 class="hud-font">'+(cfg.title||'TATA LETAK PANEL')+'</h4><div class="sub" id="lm-sub"></div>'+
      '<div id="lm-body"></div>'+
      '<div class="modal-actions"><button class="btn ghost" data-reset title="Kembalikan ke 3 per baris">RESET</button><button class="btn" data-cancel>BATAL</button><button class="btn btn-primary" data-apply>TERAPKAN</button></div></div>';
    document.body.appendChild(ov);
    function seg(sel, attr){
      return '<div class="layout-picker" role="group">'+[1,2,3].map(function(n){
        return '<button class="lp-btn'+(sel===n?' active':'')+'" '+attr+'="'+n+'" aria-pressed="'+(sel===n)+'" title="'+n+' '+noun+' di baris ini">'+LAYOUT_ICONS[n]+'</button>';
      }).join('')+'</div>';
    }
    function draw(){
      ov.querySelector('#lm-sub').textContent = label+' punya '+count+' '+noun+'. Atur jumlah '+noun+' di tiap baris; baris yang tidak diatur memakai pengaturan "baris berikutnya".';
      var sizes = planSizes(draft, count);
      var prev = '<div class="lm-prev">'+(count ? sizes.map(function(k,i){ return '<span style="grid-column:span '+(6/k)+'">'+(i+1)+'</span>'; }).join('') : '<span style="grid-column:1/-1;border-style:dashed">belum ada '+noun+'</span>')+'</div>';
      var covered = 0, rowsHtml = '';
      draft.rows.forEach(function(k, i){
        var unused = covered >= count;
        covered += k;
        rowsHtml += '<div class="lm-row'+(unused?' unused':'')+'" data-ri="'+i+'"><span class="lm-rl">BARIS '+(i+1)+(unused?' (tak terpakai)':'')+'</span>'+seg(k,'data-rowsize')+'<button class="icon-btn" data-rowdel title="Hapus baris ini">\u00d7</button></div>';
      });
      ov.querySelector('#lm-body').innerHTML = prev + rowsHtml +
        (draft.rows.length < 50 ? '<button class="lm-add" data-addrow>+ TAMBAH BARIS</button>' : '')+
        '<div class="lm-sep"></div><div class="lm-row"><span class="lm-rl">BARIS BERIKUTNYA</span>'+seg(draft.rest,'data-restsize')+'</div>'+
        '<div class="lm-hint">'+(cfg.hint||'Default: 3 panel per baris. Panel pengumuman selalu menempati posisi pertama.')+'</div>';
    }
    draw();
    ov.addEventListener('click', function(e){
      if(e.target===ov){ closeOverlay(ov); return; }
      var t = e.target.closest('button'); if(!t) return;
      var row = t.closest('[data-ri]');
      if(t.hasAttribute('data-rowsize') && row){ draft.rows[Number(row.getAttribute('data-ri'))] = Number(t.getAttribute('data-rowsize')); draw(); }
      else if(t.hasAttribute('data-restsize')){ draft.rest = Number(t.getAttribute('data-restsize')); draw(); }
      else if(t.hasAttribute('data-rowdel') && row){ draft.rows.splice(Number(row.getAttribute('data-ri')), 1); draw(); }
      else if(t.hasAttribute('data-addrow')){ draft.rows.push(draft.rest); draw(); }
      else if(t.hasAttribute('data-reset')){ draft.rows = []; draft.rest = 3; draw(); }
      else if(t.hasAttribute('data-cancel')){ closeOverlay(ov); }
      else if(t.hasAttribute('data-apply')){
        var m = cfg.obj || state.menus.find(function(x){ return x.id===menuId; });
        if(m){
          if(draft.rows.length) m[rk] = draft.rows.slice(); else delete m[rk];
          if(draft.rest!==3) m[ck] = draft.rest; else delete m[ck];
          save();

  // ---- Reorder via drag & drop ----
  function reorderInfoPanels(draggedId, targetId){
    if(!isGuru()) return;
    if(draggedId===targetId) return;
    var idxs = [];
    state.panels.forEach(function(p, i){ if(p.menuId===state.activeMenu && p.type!=='announcement') idxs.push(i); });
    var items = idxs.map(function(i){ return state.panels[i]; });
    var di = items.findIndex(function(p){ return p.id===draggedId; });
    var ti = items.findIndex(function(p){ return p.id===targetId; });
    if(di<0 || ti<0 || di===ti) return;
    var moved = items.splice(di, 1)[0];
    // ti is the target's index BEFORE removal; splicing at that same numeric
    // index on the shortened array correctly places moved right after the
    // target when dragging forward, and right before it when dragging
    // backward. Recomputing ti via findIndex after the splice (as before)
    // breaks the forward case and made adjacent-forward drags a no-op.
    items.splice(ti, 0, moved);
    idxs.forEach(function(origIdx, k){ state.panels[origIdx] = items[k]; });
    save();
  }
  function reorderSubpanels(panelId, draggedId, targetId){
    if(!isGuru()) return;
    if(draggedId===targetId) return;
    var p = state.panels.find(function(x){ return x.id===panelId; });
    if(!p) return;
    var arr = p.subpanels;
    var di = arr.findIndex(function(s){ return s.id===draggedId; });
    var ti = arr.findIndex(function(s){ return s.id===targetId; });
    if(di<0 || ti<0 || di===ti) return;
    var moved = arr.splice(di, 1)[0];
    arr.splice(ti, 0, moved); // see note above in reorderInfoPanels
    save();
  }
  function reorderMenus(draggedId, targetId){
    if(!isGuru() || draggedId===targetId) return;
    var arr = state.menus;
    var di = arr.findIndex(function(m){ return m.id===draggedId; });
    var ti = arr.findIndex(function(m){ return m.id===targetId; });
    if(di<0 || ti<0 || di===ti) return;
    var moved = arr.splice(di, 1)[0];
    arr.splice(ti, 0, moved); // geser maju: tepat setelah target; geser mundur: tepat sebelum target
    save();
  }

  function movePanelPosition(panelId, direction){

    var idxs = [];
    state.panels.forEach(function(p, i){ if(p.menuId===state.activeMenu && p.type!=='announcement') idxs.push(i); });
    var items = idxs.map(function(i){ return state.panels[i]; });

    idxs.forEach(function(origIdx, k){ state.panels[origIdx] = items[k]; });
    save();
  }

  // ---- Gambar & hyperlink pada pengumuman ----
  // Hanya http/https yang diterima; alamat tanpa skema (mis. "contoh.com/a") otomatis diberi https://
  function safeHref(u){
    u = String(u||'').trim();
    if(!u) return '';
    if(/^https?:\/\//i.test(u)) return u;
    if(/^[a-z][a-z0-9+.-]*:/i.test(u) && !/^[^\s\/]+\.[a-z]{2,}(:\d+)?(\/|$)/i.test(u)) return '';
    return /^[^\s\/]+\.[a-z]{2,}(:\d+)?(\/|$)/i.test(u) ? 'https://'+u : '';
  }
  function annMediaHtml(p, imgCls){
    var img = safeHref(p.image), url = safeHref(p.linkUrl);

      (url ? '<a class="sub-link ann-link" href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(p.linkLabel||url)+'</a>' : '');
  }

        config.apiUrl = v.apiUrl;
        persistConfig();
        if(hasApi()){ loadFromApi(); } else { syncStatus='local'; render(); }
      }, 'HUBUNGKAN');
    var hint = document.createElement('div');
    hint.className = 'hint';
    hint.innerHTML = g ? 'Deploy skrip Apps Script sebagai Web App (Execute as: Me, Access: Anyone), lalu tempel URL <code>/exec</code> di atas.'
                       : 'Alamat ini biasanya berakhiran <code>/exec</code>. Tanyakan ke gurumu jika belum punya.';
    ov.querySelector('.modal').appendChild(hint);
    if(g){
      var box = document.createElement('div');
      box.className = 'hint';
      box.style.borderTop = '1px solid var(--line)';
      box.style.paddingTop = '12px';
      box.innerHTML = '<b style="color:var(--cyan)">Bagikan ke murid</b><br>Unduh salinan halaman yang sudah terisi URL di atas, lalu kirim file itu ke murid. Murid langsung terhubung tanpa perlu mengetik URL. Kata sandi guru tidak ikut tersimpan di dalam file.<br>';
      var btn = document.createElement('button');
      btn.className = 'btn'; btn.style.marginTop = '8px'; btn.textContent = 'UNDUH FILE UNTUK MURID';
      btn.onclick = function(){ downloadStudentCopy(ov.querySelector('[data-f="apiUrl"]').value.trim()); };
      box.appendChild(btn);
      ov.querySelector('.modal').appendChild(box);
    }
  }

  // Salinan halaman untuk murid: sama persis, hanya DEFAULT_API_URL yang sudah terisi.
  function downloadStudentCopy(url){
    url = url || apiUrl();
    if(!url){ alert('Isi dan simpan URL mainframe terlebih dahulu.'); return; }
    var clone = document.documentElement.cloneNode(true);
    var appEl = clone.querySelector('#app'); if(appEl) appEl.innerHTML = '';
    clone.querySelectorAll('.modal-overlay').forEach(function(n){ n.remove(); });
    var html = '<!DOCTYPE html>\n' + clone.outerHTML;
    html = html.replace(/var DEFAULT_API_URL = '[^']*';/, function(){ return 'var DEFAULT_API_URL = ' + JSON.stringify(url) + ';'; });
    var blob = new Blob([html], {type:'text/html'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'papan-panel-murid.html';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 800);
  }

  function save(){ if(!isGuru()){ render(); return; } render(); persistLocal(); queueSync(); }

  // ---- Login guru / petugas ----
  function loginModal(kind){
    var hdr = {'Content-Type':'text/plain;charset=utf-8'};
    var isG = kind==='guru';
    var label = isG ? 'GURU' : 'PETUGAS';
    var loginAction = isG ? 'login' : 'login_staff';
    var localKey = isG ? 'localPw' : 'localStaffPw';
    if(hasApi()){
      openModal('MASUK SEBAGAI '+label, 'Kata sandi diperiksa oleh server (Google Apps Script).',
        [{name:'pw', label:'Kata sandi '+label.toLowerCase(), type:'password'}],
        function(v){
          if(!v.pw) return;
          fetch(apiUrl(), {method:'POST', headers:hdr, body:JSON.stringify({action:loginAction, password:v.pw})})
            .then(function(r){ return r.json(); })
            .then(function(res){
              if(res && res.ok){
                if(res.state && typeof res.state==='object' && res.state.menus){
                  var keep = state.activeMenu;
                  state = normalizeState(res.state);
                  serverRev = Number(state.rev)||0; delete state.rev;
                  if(keep && state.menus.some(function(m){ return m.id===keep; })) state.activeMenu = keep;
                  persistLocal();
                }
                fullLoaded = isG; // versi petugas tetap versi tersaring, bukan data lengkap
                setRole(kind, v.pw);
              }
              else alert('Kata sandi salah, atau Code.gs di server belum diperbarui ke versi yang mendukung peran '+label.toLowerCase()+'.');
            })
            .catch(function(){ alert('Tidak dapat menghubungi mainframe. Periksa koneksi internet dan URL Web App.'); });
        }, 'MASUK');
    } else if(!config[localKey]){
      openModal('BUAT KATA SANDI '+label, 'Mode lokal (belum terhubung ke Apps Script): kata sandi hanya disimpan di browser ini dan tidak mengamankan data dari orang lain yang memakai browser yang sama.',
        [{name:'pw', label:'Kata sandi baru', type:'password'}],
        function(v){
          if(!v.pw) return;
          config[localKey] = hashPw(v.pw); persistConfig();
          setRole(kind, '');
        }, 'SIMPAN & MASUK');
    } else {
      openModal('MASUK SEBAGAI '+label, null,
        [{name:'pw', label:'Kata sandi '+label.toLowerCase(), type:'password'}],
        function(v){
          if(hashPw(v.pw||'')===config[localKey]){ setRole(kind, ''); }
          else alert('Kata sandi salah.');
        }, 'MASUK');
    }
  }

  window.addEventListener('resize', updateMenuOverflow);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(updateMenuOverflow);
  render();
  loadFromApi();
  fetchHighfiveCounts();
  setInterval(function(){
    // murid: ambil data terbaru dari mainframe secara berkala; guru: cukup segarkan tampilan
    if(!isGuru() && hasApi()) loadFromApi(true); else { render(); checkServerRev(); }
    fetchHighfiveCounts();
  }, 60 * 1000);
})();
</script>
</body>
</html>
