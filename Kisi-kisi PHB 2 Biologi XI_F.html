an konsep proses pembentukan urine (filtrasi, reabsorpsi, augmentasi) berdasarkan fungsi setiap bagian nefron.","ind":"Peserta didik dapat menjelaskan hubungan antara glomerulus dan kapsula Bowman","lc":"C2","ln":"Memahami","k":"Mudah","b":"Pilihan Ganda","no":27,"s":1},{"n":28,"m":"SISTEM EKSKRESI","tp":"Peserta didik mampu menerapkan konsep proses pembentukan urine (filtrasi, reabsorpsi, augmentasi) berdasarkan fungsi setiap bagian nefron.","ind":"Disajikan data kadar glukosa darah dan urine, peserta didik dapat menerapkan konsep reabsorpsi glukosa di tubulus kontortus proksimal untuk menentukan penyebab glukosa muncul dalam urine","lc":"C3","ln":"Menerapkan","k":"Sedang","b":"Pilihan Ganda","no":28,"s":1},{"n":29,"m":"SISTEM EKSKRESI","tp":"Peserta didik mampu menerapkan konsep proses pembentukan urine (filtrasi, reabsorpsi, augmentasi) berdasarkan fungsi setiap bagian nefron.","ind":"Disajikan kasus perubahan konsentrasi urine, siswa dapat menerapkan fungsi Lengkung Henle untuk menjelaskan perubahan tersebut","lc":"C3","ln":"Menerapkan","k":"Sedang","b":"Pilihan Ganda","no":29,"s":1},{"n":30,"m":"SISTEM EKSKRESI","tp":"Peserta didik mampu menerapkan konsep proses pembentukan urine (filtrasi, reabsorpsi, augmentasi) berdasarkan fungsi setiap bagian nefron.","ind":"Disajikan ilustrasi proses pembentukan urine, peserta didik dapat menerapkan pemahaman tentang fungsi tubulus kontortus distal dalam proses augmentasi dan pengaturan keseimbangan air serta ion dengan tepat.","lc":"C3","ln":"Menerapkan","k":"Sedang","b":"Pilihan Ganda","no":30,"s":1},{"n":31,"m":"SISTEM EKSKRESI","tp":"Peserta didik mampu mengidentifikasi organ-organ ekskresi dan menganalisis fungsinya, serta dampak gangguannya.","ind":"Disajikan kasus gangguan pada alveolus, siswa dapat memprediksi dampaknya terhadap pengeluaran karbon dioksida dan uap air","lc":"C3","ln":"Menerapkan","k":"Sedang","b":"Pilihan Ganda","no":31,"s":1},{"n":32,"m":"SISTEM EKSKRESI","tp":"Peserta didik mampu mengidentifikasi organ-organ ekskresi dan menganalisis fungsinya, serta dampak gangguannya.","ind":"Menganalisis dampak penyumbatan saluran keringat terhadap fungsi kulit sebagai organ ekskresi","lc":"C4","ln":"Menganalisis","k":"Sedang","b":"Pilihan Ganda","no":32,"s":1},{"n":33,"m":"SISTEM EKSKRESI","tp":"Peserta didik mampu menerapkan konsep proses pembentukan urine (filtrasi, reabsorpsi, augmentasi) berdasarkan fungsi setiap bagian nefron.","ind":"Menganalisis perbedaan perubahan osmolaritas filtrat pada lengkung Henle bagian desenden dan asenden berdasarkan permeabilitas terhadap air dan ion.","lc":"C4","ln":"Menganalisis","k":"Sedang","b":"Pilihan Ganda","no":33,"s":1},{"n":34,"m":"SISTEM EKSKRESI","tp":"Peserta didik mampu mengevaluasi kesimpulan eksperimen osmosis dan menilai hubungan kerusakan ginjal dengan gangguan fungsinya berdasarkan data dan kasus.","ind":"Menilai ketepatan kesimpulan eksperimen tentang perubahan massa atau volume sel setelah ditempatkan dalam larutan dengan konsentrasi berbeda, berdasarkan prinsip osmosis.","lc":"C5","ln":"Mengevaluasi","k":"Sukar","b":"Pilihan Ganda","no":34,"s":1},{"n":35,"m":"SISTEM EKSKRESI","tp":"Peserta didik mampu mengevaluasi kesimpulan eksperimen osmosis dan menilai hubungan kerusakan ginjal dengan gangguan fungsinya berdasarkan data dan kasus.","ind":"Diberikan kasus klinis yang disertai diagram nefron dan data perubahan tekanan atau aliran filtrat, peserta didik mampu menilai hubungan antara kerusakan pada bagian tertentu dari anatomi ginjal dan gangguan fungsi yang terjadi, lalu menentukan bagian yang paling mungkin terdampak beserta alasan berdasarkan fungsi struktur tersebut","lc":"C5","ln":"Mengevaluasi","k":"Sukar","b":"Pilihan Ganda Kompleks","no":35,"s":2}];

const KS=['Mudah','Sedang','Sukar'];
const BT=[...new Set(D.map(r=>r.b))];
const F={m:new Set(),l:new Set(),k:new Set(),b:new Set(),q:''};
const $=id=>document.getElementById(id);
const col=c=>`var(--c${c[1]})`;
const title=s=>s.toLowerCase().replace(/(^|[ &])\w/g,x=>x.toUpperCase()).replace(' & ',' dan ');
function chips(el,vals,set,label){
  $(el).innerHTML=vals.map(v=>`<button type="button" class="chip" aria-pressed="false" data-v="${v}">${label?label(v):v}</button>`).join('');
  $(el).onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const v=b.dataset.v;
    set.has(v)?set.delete(v):set.add(v);b.setAttribute('aria-pressed',set.has(v));render();};
}
function match(r){
  if(F.m.size&&!F.m.has(r.m))return false;
  if(F.l.size&&!F.l.has(r.lc))return false;
  if(F.k.size&&!F.k.has(r.k))return false;
  if(F.b.size&&!F.b.has(r.b))return false;
  if(F.q){const t=(r.ind+' '+r.tp+' '+r.m+' '+r.ln).toLowerCase();if(!F.q.split(/\s+/).every(w=>t.includes(w)))return false;}
  return true;
}
function summary(){
  const tot=D.reduce((a,r)=>a+r.s,0);
  const items=[[D.length,'butir soal'],[MAT.length,'materi'],[tot,'total skor'],[D.filter(r=>r.s>1).length,'soal pilihan ganda kompleks']];
  $('sum').innerHTML=items.map(([a,b])=>`<div><strong>${a}</strong><span>${b}</span></div>`).join('');
  $('leg').innerHTML=LV.map(l=>`<span><i style="background:${col(l)}"></i>${l} ${LN[l]}</span>`).join('')+'<span>Garis tebal: skor 2</span>';
  $('dist').innerHTML=MAT.map(m=>{const rs=D.filter(r=>r.m===m);
    return `<div class="d"><span>${title(m)}</span><div class="st" role="img" aria-label="Sebaran level ${title(m)}">${LV.map(l=>{const n=rs.filter(r=>r.lc===l).length;return n?`<span title="${l}: ${n}" style="flex:${n};background:${col(l)}"></span>`:''}).join('')}</div><span>${rs.length}</span></div>`}).join('');
}
function render(){
  const ok=new Set(D.filter(match).map(r=>r.n));
  $('map').innerHTML=D.map(r=>`<button type="button" data-n="${r.n}" data-s="${r.s}" class="${ok.has(r.n)?'':'off'}" style="background:${col(r.lc)}" title="Soal ${r.no}: ${r.lc} ${r.ln}, ${r.k}" aria-label="Soal ${r.no}">${r.no}</button>`).join('');
  const rs=D.filter(r=>ok.has(r.n));
  const sk=rs.reduce((a,r)=>a+r.s,0);
  $('cnt').textContent=`${rs.length} dari ${D.length} soal tampil, skor ${sk}`;
  $('list').innerHTML=rs.length?rs.map(r=>`<details id="s${r.no}"><summary><span class="no" style="background:${col(r.lc)}">${r.no}</span><span><p class="ind">${r.ind}</p><span class="tags"><span class="tag">${title(r.m)}</span><span class="tag">${r.lc} ${r.ln}</span><span class="tag">${r.k}</span><span class="tag">${r.b}</span><span class="tag">Skor ${r.s}</span></span></span></summary><div class="det"><b>Tujuan pembelajaran</b>${r.tp}</div></details>`).join(''):'<div class="empty">Tidak ada soal yang cocok. Longgarkan salah satu filter atau ubah kata kunci.</div>';
}
$('map').onclick=e=>{const b=e.target.closest('button');if(!b||b.classList.contains('off'))return;
  const el=$('s'+b.dataset.n);if(!el)return;el.open=true;el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'center'});
  el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');};
$('q').oninput=e=>{F.q=e.target.value.trim().toLowerCase();render();};
$('rst').onclick=()=>{Object.values(F).forEach(s=>s.clear&&s.clear());F.q='';$('q').value='';document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed','false'));render();};
$('th').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';};
chips('fm',MAT,F.m,title);chips('fl',LV,F.l,l=>l+' '+LN[l]);chips('fk',KS,F.k);chips('fb',BT,F.b);
summary();render();
</script>
</body>
</html>
