<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. // KEGIATAN AKAN DATANG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#03070f; --bg2:#050d1a;
    --panel: rgba(8,22,40,.55); --panel-solid:#08182b;
    --border: rgba(70,190,255,.28); --border-strong: rgba(90,220,255,.55);
    --cyan:#4fe6ff; --cyan-soft:#8fefff; --cyan-dim:#1f7fa3;
    --amber:#ffb020; --red:#ff4d6a; --green:#34ff9e; --blue:#5aa7ff;
    --text:#d3edff; --text-dim:#5f84a8; --text-faint:#3a5470;
    --radius: 6px;
  }

  *{ box-sizing: border-box; }
  html, body{ margin: 0; padding: 0; }

  body{
    background:
      radial-gradient(ellipse at 20% -10%, rgba(30,100,150,.18), transparent 55%),
      radial-gradient(ellipse at 100% 10%, rgba(255,120,60,.06), transparent 45%),
      var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    position: relative;
    padding: 32px 16px 60px;
  }
  body::before{
    content: ""; position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(79,230,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,230,255,.035) 1px, transparent 1px);
    background-size: 42px 42px; pointer-events: none; z-index: 0;
    mask-image: radial-gradient(ellipse at 50% 0%, black 0%, transparent 75%);
  }
  body::after{
    content: ""; position: fixed; inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 3px, rgba(0,0,0,.14) 4px);
    pointer-events: none; z-index: 5; opacity: .3;
  }

  .page{ position: relative; z-index: 1; max-width: 820px; margin: 0 auto; }

  .tag{
    display: inline-flex; align-items: center; gap: 10px;
    border: 1px solid var(--border); color: var(--cyan-soft);
    font-family: 'Share Tech Mono', monospace; font-size: 11.5px;
    letter-spacing: 0.18em; text-transform: uppercase;
    padding: 7px 16px; border-radius: 999px; margin-bottom: 20px;
  }
  .tag::before{
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--cyan); box-shadow: 0 0 8px var(--cyan);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  header h1{
    font-family: 'Orbitron', sans-serif; font-weight: 700;
    font-size: clamp(20px, 3.4vw, 27px); letter-spacing: 1.5px; line-height: 1.3;
    margin: 0 0 8px; color: var(--cyan-soft);
    text-shadow: 0 0 18px rgba(79,230,255,.35); text-transform: uppercase;
  }
  header p{ margin: 0 0 24px; color: var(--text-dim); font-size: 14.5px; max-width: 60ch; }

  .toolbar{
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    margin-bottom: 18px;
  }
  .btn-refresh{
    background: rgba(79,230,255,.08); color: var(--cyan-soft);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 9px 16px; font-family: 'Orbitron', sans-serif; font-size: 11px;
    letter-spacing: 1px; text-transform: uppercase; font-weight: 600;
    cursor: pointer; transition: .15s;
  }
  .btn-refresh:hover{ border-color: var(--cyan); box-shadow: 0 0 12px rgba(79,230,255,.3); }
  .btn-refresh:disabled{ opacity: .5; cursor: not-allowed; }

  select#filterKelas, select#filterStatus{
    background: rgba(79,230,255,.04); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 9px 12px; font-family: 'Rajdhani', sans-serif; font-size: 13.5px;
  }
  select#filterKelas:focus, select#filterStatus:focus{ outline: none; border-color: var(--cyan); }
  select option{ background-color: #08182b; color: #d3edff; }

  .status-line{ font-family: 'Share Tech Mono', monospace; font-size: 12.5px; color: var(--text-dim); margin-bottom: 20px; }
  .status-line.err{ color: var(--red); }

  .kosong{
    font-family: 'Share Tech Mono', monospace; font-size: 13px; color: var(--text-dim);
    padding: 34px 0; text-align: center; border: 1px dashed var(--border); border-radius: var(--radius);
  }

  .kartu-kegiatan{
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 12px; backdrop-filter: blur(6px);
    position: relative; display: grid; grid-template-columns: 130px 1fr; gap: 16px;
  }
  .kartu-kegiatan::before{
    content: ""; position: absolute; top: -1px; left: -1px; width: 14px; height: 14px;
    border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan);
  }
  .kartu-kegiatan::after{
    content: ""; position: absolute; bottom: -1px; right: -1px; width: 14px; height: 14px;
    border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan);
  }
  .kartu-kegiatan.terlambat::before, .kartu-kegiatan.terlambat::after{ border-color: var(--red); }
  .kartu-kegiatan.hari-ini::before, .kartu-kegiatan.hari-ini::after{ border-color: var(--green); }

  .kk-waktu{ display: flex; flex-direction: column; gap: 4px; }
  .kk-tanggal{
    font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 700;
    letter-spacing: .5px; color: var(--cyan-soft); line-height: 1.35;
  }
  .kk-jam{ font-family: 'Share Tech Mono', monospace; font-size: 11.5px; color: var(--text-dim); }
  .kk-status{
    display: inline-flex; align-items: center; gap: 4px;
    font-family: 'Share Tech Mono', monospace; font-size: 10.5px;
    letter-spacing: .5px; text-transform: uppercase;
    padding: 2px 8px; border-radius: 999px; width: fit-content; margin-top: 2px;
  }
  .kk-status.terlambat{ background: rgba(255,77,106,.15); color: var(--red); border: 1px solid rgba(255,77,106,.4); }
  .kk-status.hari-ini{ background: rgba(52,255,158,.15); color: var(--green); border: 1px solid rgba(52,255,158,.4); }
  .kk-status.akan-datang{ background: rgba(90,167,255,.12); color: var(--blue); border: 1px solid rgba(90,167,255,.35); }

  .kk-body{ min-width: 0; }
  .kk-kelas{
    font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 700;
    color: var(--text); letter-spacing: .5px; margin-bottom: 8px;
  }

  .kk-terakhir{
    background: rgba(255,176,32,.04); border: 1px solid rgba(255,176,32,.2); border-radius: 4px;
    padding: 10px 12px; margin-bottom: 10px;
  }
  .kk-terakhir-label{
    font-family: 'Orbitron', sans-serif; font-size: 9.5px; letter-spacing: 1.2px;
    text-transform: uppercase; color: var(--amber); margin-bottom: 4px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .kk-terakhir-tanggal{ font-family: 'Share Tech Mono', monospace; font-weight: 400; color: var(--text-dim); text-transform: none; letter-spacing: 0; }
  .kk-terakhir-tp{ font-size: 13.5px; line-height: 1.4; color: var(--text); margin-bottom: 3px; }
  .kk-terakhir-materi{ font-size: 12.5px; line-height: 1.4; color: var(--text-dim); }
  .kk-terakhir.kosong{ color: var(--text-faint); font-family: 'Share Tech Mono', monospace; font-size: 12px; }

  .kk-lanjutan{
    display: inline-flex; align-items: center; gap: 4px;
    font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: .3px;
    padding: 2px 8px; border-radius: 999px; margin-top: 6px;
  }
  .kk-lanjutan.sama{ background: rgba(255,176,32,.15); color: var(--amber); border: 1px solid rgba(255,176,32,.4); }
  .kk-lanjutan.baru{ background: rgba(52,255,158,.15); color: var(--green); border: 1px solid rgba(52,255,158,.4); }

  .kk-saran{
    background: rgba(79,230,255,.05); border: 1px solid var(--border); border-radius: 4px;
    padding: 10px 12px; margin-bottom: 10px;
  }
  .kk-saran-label{
    font-family: 'Orbitron', sans-serif; font-size: 9.5px; letter-spacing: 1.2px;
    text-transform: uppercase; color: var(--cyan-dim); margin-bottom: 4px;
  }
  .kk-saran-teks{ font-size: 14px; line-height: 1.4; color: var(--text); }
  .kk-saran.tuntas{ border-color: rgba(52,255,158,.35); background: rgba(52,255,158,.05); }
  .kk-saran.tuntas .kk-saran-teks{ color: var(--green); }

  .kk-progres{ display: flex; align-items: center; gap: 10px; }
  .kk-progres-track{
    flex: 1; height: 6px; background: rgba(79,230,255,.08); border: 1px solid var(--border);
    border-radius: 999px; overflow: hidden;
  }
  .kk-progres-fill{
    height: 100%; background: linear-gradient(90deg, var(--cyan-dim), var(--cyan));
    box-shadow: 0 0 6px rgba(79,230,255,.5); border-radius: 999px;
  }
  .kk-progres-teks{ font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--text-dim); white-space: nowrap; }

  .kk-warning{ color: var(--amber); font-family: 'Share Tech Mono', monospace; font-size: 12px; }

  @media (max-width: 560px){
    .kartu-kegiatan{ grid-template-columns: 1fr; }
  }

  ::-webkit-scrollbar{ height: 8px; width: 8px; }
  ::-webkit-scrollbar-track{ background: rgba(255,255,255,.03); }
  ::-webkit-scrollbar-thumb{ background: var(--cyan-dim); border-radius: 4px; }
</style>

<!-- ══ J.A.R.V.I.S. NAVIGATION BAR ══ -->
<style>
  .jarvis-nav{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    z-index:9999;
    display:flex; gap:8px;
    background:rgba(4,14,28,.85);
    border:1px solid rgba(79,230,255,.38);
    border-radius:999px;
    padding:8px 14px;
    backdrop-filter:blur(16px);
    box-shadow:0 0 28px rgba(79,230,255,.14), 0 6px 32px rgba(0,0,0,.7);
  }
  .jarvis-nav a{
    display:flex; align-items:center; gap:7px;
    font-family:'Share Tech Mono','Courier New',monospace;
    font-size:11.5px; letter-spacing:.12em; text-transform:uppercase;
    color:#4a7fa0; text-decoration:none;
    padding:7px 16px; border-radius:999px;
    border:1px solid transparent;
    transition:color .2s, border-color .2s, background .2s, box-shadow .2s;
    white-space:nowrap;
  }
  .jarvis-nav a:hover{
    color:#4fe6ff;
    border-color:rgba(79,230,255,.45);
    background:rgba(79,230,255,.08);
  }
  .jarvis-nav a.nav-active{
    color:#03070f;
    background:#4fe6ff;
    border-color:#4fe6ff;
    box-shadow:0 0 16px rgba(79,230,255,.6);
    font-weight:700;
  }
  body{ padding-bottom: 80px !important; }
  @media(max-width:520px){
    .jarvis-nav{bottom:12px;padding:6px 8px;gap:4px;}
    .jarvis-nav a{padding:6px 10px;font-size:10px;gap:5px;}

  }

<body>
  <div class="page">
    <span class="tag">J.A.R.V.I.S. // MODUL AGENDA</span>
    <header>
      <h1>Kegiatan Akan Datang</h1>
      <p>Sesi yang belum diisi jurnalnya — diurutkan dari yang paling mendesak, lengkap dengan saran Tujuan Pembelajaran berikutnya untuk tiap kelas.</p>
    </header>

    <div class="toolbar">
      <button class="btn-refresh" id="refreshBtn">⟳ Muat Ulang Data</button>
      <select id="filterKelas">
        <option value="semua">Semua Kelas</option>
      </select>
      <select id="filterStatus">
        <option value="semua">Semua Status</option>
        <option value="terlambat">🔴 Terlambat</option>
        <option value="hari-ini">🟢 Hari Ini</option>
        <option value="akan-datang">⚪ Akan Datang</option>
      </select>
    </div>
    <div class="status-line" id="statusLine">Memuat data...</div>

    <div id="hasil"></div>
  </div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxQRNsIZtMSnqqLBNBa3V0_CaEUaC1SQjNr8kgOlW7e-k7Ss8-5RDRBOZj27dwVvBn2/exec";

  let cacheJadwal = [];

  const statusLine = document.getElementById('statusLine');
  const hasil = document.getElementById('hasil');
  const refreshBtn = document.getElementById('refreshBtn');
  const filterKelas = document.getElementById('filterKelas');
  const filterStatus = document.getElementById('filterStatus');

  refreshBtn.addEventListener('click', muatData);
  filterKelas.addEventListener('change', renderDaftar);
  filterStatus.addEventListener('change', renderDaftar);
  muatData();

  async function muatData() {
    refreshBtn.disabled = true;
    statusLine.textContent = 'Memuat data...';
    statusLine.className = 'status-line';
    hasil.innerHTML = '';

    try {
      const res = await fetch(`${APPS_SCRIPT_URL}?action=akan-datang`);
      const data = await res.json();
      cacheJadwal = data.jadwal || [];

      isiFilterKelas();
      renderDaftar();

      statusLine.textContent = `Terakhir dimuat: ${new Date().toLocaleTimeString('id-ID')} · ${cacheJadwal.length} sesi belum diisi`;
    } catch (err) {
      statusLine.textContent = 'Gagal memuat data. Periksa koneksi atau URL Web App.';
      statusLine.className = 'status-line err';
    } finally {
      refreshBtn.disabled = false;
    }
  }

  function isiFilterKelas() {
    const kelasUnik = [...new Set(cacheJadwal.map(j => j.kelas))].sort();
    const nilaiTerpilih = filterKelas.value;
    filterKelas.innerHTML = '<option value="semua">Semua Kelas</option>' +
      kelasUnik.map(k => `<option value="${k}">${k}</option>`).join('');
    if (kelasUnik.includes(nilaiTerpilih)) filterKelas.value = nilaiTerpilih;
  }

  function formatTanggalIndo(isoDate) {
    const hariList = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    const bulanList = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    const d = new Date(isoDate + 'T00:00:00');
    if (isNaN(d)) return null;
    return { teks: `${hariList[d.getDay()]}, ${d.getDate()} ${bulanList[d.getMonth()]} ${d.getFullYear()}`, waktu: d.getTime() };
  }

  function tentukanStatus(isoDate) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const tgl = new Date(isoDate + 'T00:00:00');
    if (isNaN(tgl)) return null;
    if (tgl.getTime() === today.getTime()) return { kelas: 'hari-ini', label: 'Hari Ini' };
    if (tgl.getTime() < today.getTime()) return { kelas: 'terlambat', label: 'Terlambat' };
    return { kelas: 'akan-datang', label: 'Akan Datang' };
  }

  function renderDaftar() {
    const kelasTerpilih = filterKelas.value;
    const statusTerpilih = filterStatus.value;
    let daftar = kelasTerpilih === 'semua' ? cacheJadwal : cacheJadwal.filter(j => j.kelas === kelasTerpilih);

    if (daftar.length === 0) {
      hasil.innerHTML = '<div class="kosong">Tidak ada sesi yang belum diisi untuk kelas ini — semua sudah tercatat, atau belum ada jadwal ditambahkan.</div>';
      return;
    }

    // Baris dengan tanggal bermasalah (⚠️...) ditaruh paling atas; sisanya diurutkan kronologis (terlambat dulu)
    const bermasalah = [];
    let valid = [];
    daftar.forEach(j => {
      const info = formatTanggalIndo(j.tanggal);
      if (!info) bermasalah.push(j);
      else {
        const status = tentukanStatus(j.tanggal);
        valid.push({ ...j, _waktu: info.waktu, _tanggalTeks: info.teks, _statusKelas: status ? status.kelas : '' });
      }
    });

    if (statusTerpilih !== 'semua') {
      valid = valid.filter(j => j._statusKelas === statusTerpilih);
    }
    // Tanggal bermasalah statusnya tidak diketahui — hanya ditampilkan saat filter "Semua Status"
    const bermasalahTampil = statusTerpilih === 'semua' ? bermasalah : [];

    valid.sort((a, b) => a._waktu - b._waktu);

    if (bermasalahTampil.length === 0 && valid.length === 0) {
      hasil.innerHTML = '<div class="kosong">Tidak ada sesi yang cocok dengan filter ini.</div>';
      return;
    }

    let html = '';

    bermasalahTampil.forEach(j => {
      html += `
        <div class="kartu-kegiatan">
          <div class="kk-waktu"><span class="kk-warning">⚠</span></div>
          <div class="kk-body">
            <div class="kk-kelas">${j.kelas}</div>
            <div class="kk-warning">${j.tanggal}</div>
          </div>
        </div>
      `;
    });

    valid.forEach(j => {
      const status = tentukanStatus(j.tanggal);
      const statusKelas = status ? status.kelas : '';
      const statusLabel = status ? status.label : '';

      let terakhirHtml;
      if (j.terakhirTujuan) {
        const infoTgl = formatTanggalIndo(j.terakhirTanggal);
        const tglTeks = infoTgl ? infoTgl.teks : j.terakhirTanggal;
        const samaTP = j.saranTP && j.terakhirTujuan.trim() === j.saranTP.trim();
        const lanjutanHtml = j.saranTP
          ? (samaTP
              ? `<span class="kk-lanjutan sama">🔁 Lanjutan TP yang sama</span>`
              : `<span class="kk-lanjutan baru">➡️ TP baru dimulai</span>`)
          : '';
        terakhirHtml = `
          <div class="kk-terakhir">
            <div class="kk-terakhir-label">🕐 Pertemuan Terakhir <span class="kk-terakhir-tanggal">${tglTeks}</span></div>
            <div class="kk-terakhir-tp">${j.terakhirTujuan}</div>
            ${j.terakhirMateri ? `<div class="kk-terakhir-materi">Materi: ${j.terakhirMateri}</div>` : ''}
            ${lanjutanHtml}
          </div>
        `;
      } else {
        terakhirHtml = `
          <div class="kk-terakhir kosong">🕐 Belum ada pertemuan tercatat sebelumnya untuk kelas ini.</div>
        `;
      }

      let saranHtml;
      if (j.saranTP) {
        saranHtml = `
          <div class="kk-saran">
            <div class="kk-saran-label">📖 Saran TP Berikutnya</div>
            <div class="kk-saran-teks">${j.saranTP}</div>
          </div>
        `;
      } else {
        saranHtml = `
          <div class="kk-saran tuntas">
            <div class="kk-saran-label">📖 Saran TP Berikutnya</div>
            <div class="kk-saran-teks">🎉 Semua TP untuk tingkat ini sudah tuntas diajarkan</div>
          </div>
        `;
      }

      const persen = j.progresTotal > 0 ? Math.round((j.progresSelesai / j.progresTotal) * 100) : 0;

      html += `
        <div class="kartu-kegiatan ${statusKelas}">
          <div class="kk-waktu">
            <span class="kk-tanggal">${j._tanggalTeks}</span>
            <span class="kk-jam">Jam ${j.jamKe}${j.waktu ? ' (' + j.waktu + ')' : ''}</span>
            <span class="kk-status ${statusKelas}">${statusLabel}</span>
          </div>
          <div class="kk-body">
            <div class="kk-kelas">${j.kelas}</div>
            ${terakhirHtml}
            ${saranHtml}
            <div class="kk-progres">
              <div class="kk-progres-track"><div class="kk-progres-fill" style="width:${persen}%"></div></div>
              <span class="kk-progres-teks">${j.progresSelesai}/${j.progresTotal} TP (${persen}%)</span>
            </div>
          </div>
        </div>
      `;
    });

    hasil.innerHTML = html;
  }
</script>
