<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perancang Soal & Kisi-kisi</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mu:#667085;--bd:#d9dde4;--ac:#0f766e;--ac2:#e6f4f2;--wr:#b42318;--ok:#15803d}
@media(prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--tx:#e8eaee;--mu:#9aa3b2;--bd:#343a46;--ac:#2dd4bf;--ac2:#16332f;--wr:#f97066;--ok:#4ade80}}
:root{color-scheme:light}@media(prefers-color-scheme:dark){:root{color-scheme:dark}}
select,option,optgroup{background-color:var(--card);color:var(--tx)}
td select{background-color:var(--card)}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:16px 20px;border-bottom:1px solid var(--bd);background:var(--card)}h1{margin:0;font-size:20px}header p{margin:2px 0 0;color:var(--mu);font-size:13px}
nav{display:flex;gap:4px;padding:8px 20px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
nav button{border:0;background:none;color:var(--mu);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit;white-space:nowrap}
nav button.on{background:var(--ac2);color:var(--ac);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:20px}section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit}
textarea{resize:vertical;min-height:60px}
button.b,label.b{display:inline-block;background:var(--ac);color:var(--bg);border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit;font-weight:600}
button.s,label.s{background:none;color:var(--tx);border:1px solid var(--bd)}button.d{background:none;border:0;color:var(--wr);cursor:pointer;font-size:18px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.w{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid var(--bd);padding:4px;vertical-align:top;text-align:left}th{background:var(--ac2);font-size:12px}
td input,td select,td textarea{border:0;background:transparent;padding:4px;min-height:0}td textarea{min-height:48px}
 #t2 textarea{overflow:hidden;resize:none;min-height:60px;line-height:1.5}
 #t1 td textarea{overflow:hidden;resize:none;min-height:34px;min-width:150px;line-height:1.4}
.pb{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;min-width:80px}.pb i{display:block;height:100%;background:var(--ac)}
.m{color:var(--mu);font-size:13px}.wr{color:var(--wr);font-weight:600}.ok{color:var(--ok);font-weight:600}
.q{border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:10px}.q .h{font-size:12px;color:var(--mu);margin-bottom:6px}
.q{position:relative;border:1px solid hsl(var(--c) 55% 50%);border-left-width:6px;background:hsl(var(--c) 70% 50%/.09)}
.q .h{padding-right:42%}.q .bd{position:absolute;top:8px;right:8px;max-width:40%;background:hsl(var(--c) 65% 34%);color:#fff;font-size:11px;font-weight:600;line-height:1.3;padding:3px 9px;border-radius:5px}
.q.nm{border-color:var(--bd);background:var(--card)}.q.nm .bd{background:var(--mu)}
.lg{display:inline-block;color:#fff;font-size:11px;font-weight:600;padding:2px 9px;border-radius:5px;margin:2px 4px 2px 0}
.o{display:grid;grid-template-columns:26px 1fr;gap:6px;align-items:center;margin-top:5px}
</style>
</head>
<body>
<header><h1>Perancang Soal &amp; Kisi-kisi</h1><p>Rencanakan kisi-kisi → susun soal → pantau persentase → ekspor ke Word / LMS. Data tersimpan otomatis di browser.</p></header>
<nav id="nav"></nav>
<main>
<section id="t0"></section><section id="t1"></section><section id="t2"></section><section id="t3"></section><section id="t4"></section>
</main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TABS=['1 · Identitas','2 · Kisi-kisi','3 · Input Soal','4 · Rekap Persentase','5 · Ekspor'];
const LV=['L1 Memahami','L2 Mengaplikasi','L3 Menalar'],DF=['Mudah','Sedang','Sukar'],BT=['Pilihan Ganda','Pilihan Ganda Kompleks','Benar-Salah','Isian Singkat','Uraian'],KT=['Pernah Diajarkan','Belum Pernah Diajarkan'];
const MF=[['sekolah','Satuan pendidikan'],['jenjang','Jenjang (mis. Madrasah Aliyah (MA))'],['mapel','Mata pelajaran'],['kelas','Kelas (mis. X)'],['semester','Semester'],['tahun','Tahun ajaran'],['jenis','Jenis asesmen (mis. Sumatif Akhir Semester)'],['kurikulum','Kurikulum'],['waktu','Alokasi waktu'],['penyusun','Penyusun'],['total','Target jumlah soal total']];
const KEY='perancang-soal-v1';let S;
const DLV={'L1 Memahami':30,'L2 Mengaplikasi':50,'L3 Menalar':20},DBT={'Pilihan Ganda':70,'Pilihan Ganda Kompleks':10,'Benar-Salah':0,'Isian Singkat':0,'Uraian':20},SKR={'Pilihan Ganda':1,'Pilihan Ganda Kompleks':2,'Benar-Salah':1,'Isian Singkat':2,'Uraian':5};
function norm(){S.meta=S.meta||{};S.rows=S.rows||[];S.soal=S.soal||{};S.materi=S.materi||[];S.target=S.target||{Mudah:30,Sedang:50,Sukar:20};const ok=Object.keys(S.tLv||{}).length===LV.length&&LV.every(k=>k in S.tLv);if(!ok)S.tLv={...DLV};
const old={C1:0,C2:0,C3:1,C4:2,C5:2,C6:2};S.rows.forEach(r=>{if(!LV.includes(r.level)){const c=old[(r.level||'').slice(0,2)];r.level=LV[c??1]}});S.tBt=S.tBt||{...DBT};BT.forEach(k=>{if(!(k in S.tBt))S.tBt[k]=DBT[k]});S.tKet=S.tKet||{'Pernah Diajarkan':70,'Belum Pernah Diajarkan':30}}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{};norm();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const uid=()=>'r'+Math.random().toString(36).slice(2,8);
const isPG=b=>b==='Pilihan Ganda'||b==='Pilihan Ganda Kompleks';
const sel=(arr,v,attr)=>`<select ${attr}>${arr.map(x=>`<option${x===v?' selected':''}>${x}</option>`).join('')}</select>`;
const J=r=>Math.max(0,+r.jumlah||0);
function starts(){let n=1;return S.rows.map(r=>{const s=n;n+=J(r);return s})}
const noTxt=(r,s)=>J(r)<=1?`${s}`:`${s}–${s+J(r)-1}`;
const tot=()=>S.rows.reduce((a,r)=>a+J(r),0);
function filled(r,i){const q=(S.soal[r.id]||[])[i]||{};if(!(q.q||'').trim())return false;if(isPG(r.bentuk))return !!q.key&&['a','b','c','d'].every(k=>(q[k]||'').trim());return !!(q.key||'').trim()}

/* NAV */
$('#nav').innerHTML=TABS.map((t,i)=>`<button data-tab="${i}">${t}</button>`).join('');
function go(i){document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('on',i===j));document.querySelectorAll('section').forEach((s,j)=>s.classList.toggle('on',i===j));[r0,r1,r2,r3,r4][i]();scrollTo(0,0)}

/* 1 IDENTITAS */
const tgrid=(o,list,at)=>`<div class="g">${list.map(d=>`<div><label>${d}</label><input type="number" min="0" max="100" ${at}="${d}" value="${o[d]??0}"></div>`).join('')}</div>`;
function r0(){$('#t0').innerHTML=`<div class="card"><h2>Identitas Perangkat Soal</h2><div class="g">${MF.map(([k,l])=>`<div><label>${l}</label><input data-m="${k}" ${k==='total'?'type="number" min="0"':''} value="${esc(S.meta[k])}"></div>`).join('')}</div></div>
<div class="card"><h2>Materi</h2><p class="m">Tulis satu materi per baris. Daftar ini menjadi pilihan di tab Kisi-kisi dan disebar merata saat generate.</p><textarea data-mat rows="5" placeholder="Satu materi per baris">${esc(S.materi.join('\n'))}</textarea><p class="m">${S.materi.length} materi</p></div>
<div class="card"><h2>Target Proporsi &amp; Generate Otomatis</h2><p class="m">Atur persentase tiap kelompok (masing-masing berjumlah 100%), lalu klik generate. Jumlah soal mengikuti “Target jumlah soal total” di panel Identitas.</p>
<h3>Tingkat Kesulitan (%)</h3>${tgrid(S.target,DF,'data-t')}<p id="s1" class="m"></p>
<h3>Level Kognitif (%)</h3>${tgrid(S.tLv,LV,'data-tl')}<p id="s2" class="m"></p>
<h3>Bentuk Soal (%)</h3>${tgrid(S.tBt,BT,'data-tb')}<p id="s3" class="m"></p>
<h3>Keterangan Soal bagi Siswa (%)</h3><p class="m">Proporsi soal yang isinya pernah diajarkan vs baru bagi siswa. Berlaku per soal, jadi satu materi bisa memuat keduanya; dapat diatur per baris di tab Kisi-kisi. Hanya untuk perencanaan, tidak tampil di dokumen Word.</p>${tgrid(S.tKet,KT,'data-tk')}<p id="s4" class="m"></p>
<div class="bar"><button class="b" data-act="gen">⚡ Generate kisi-kisi otomatis</button></div>
<p class="m">Hasilnya: satu baris = satu soal (jumlah 1), dengan materi, level, kesulitan, bentuk, dan skor awal terisi, diurutkan per materi. Soal tingkat tinggi cenderung dipasangkan dengan kesulitan sukar dan bentuk uraian. Semua dapat diubah di tab Kisi-kisi.</p></div>
<div class="card"><h2>Proyek</h2><div class="bar" style="margin:0"><button class="b s" data-act="exp-json">Simpan proyek (.json)</button><label class="b s" style="margin:0;cursor:pointer">Buka proyek<input type="file" accept=".json" id="imp" hidden></label><button class="b s" data-act="reset">Mulai baru</button></div></div>`;tsum()}
function tsum(){[['s1',S.target,DF],['s2',S.tLv,LV],['s3',S.tBt,BT],['s4',S.tKet,KT]].forEach(([id,o,l])=>{const e=$('#'+id);if(!e)return;const t=l.reduce((a,k)=>a+(+o[k]||0),0);e.innerHTML=`Jumlah: <span class="${t===100?'ok':'wr'}">${t}%</span>`})}
function apportion(o,list,N){const t=list.reduce((a,k)=>a+(+o[k]||0),0);if(!t)return null;const q=list.map(k=>(+o[k]||0)/t*N),c=q.map(Math.floor);let r=N-c.reduce((a,b)=>a+b,0);q.map((v,i)=>[v-c[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,r).forEach(([,i])=>c[i]++);return list.flatMap((k,i)=>Array(c[i]).fill(k))}
function gen(){const N=+S.meta.total||0,M=S.materi;
if(N<1)return alert('Isi dulu “Target jumlah soal total” pada panel Identitas.');
if(!M.length)return alert('Isi dulu daftar Materi.');
const d=apportion(S.target,DF,N),l=apportion(S.tLv,LV,N),b=apportion(S.tBt,BT,N);
const ka=apportion(S.tKet,KT,N);if(!d||!l||!b||!ka)return alert('Setiap kelompok target harus berjumlah lebih dari 0%.');
const bad=[[S.target,DF],[S.tLv,LV],[S.tBt,BT],[S.tKet,KT]].some(([o,x])=>x.reduce((a,k)=>a+(+o[k]||0),0)!==100);
if(bad&&!confirm('Ada kelompok target yang totalnya bukan 100%; akan dinormalkan otomatis. Lanjutkan?'))return;
if(S.rows.length&&!confirm('Kisi-kisi dan soal yang sudah ada akan diganti. Lanjutkan?'))return;
const cP=ka.filter(x=>x===KT[0]).length,idx=M.map(()=>[]);
for(let i=0;i<N;i++)idx[i%M.length].push(i);
const qs=idx.map(x=>x.length*cP/N),fl=qs.map(Math.floor);
qs.map((v,j)=>[v-fl[j],j]).sort((x,y)=>y[0]-x[0]).slice(0,cP-fl.reduce((x,y)=>x+y,0)).forEach(([,j])=>fl[j]++);
const kt=Array(N);
idx.forEach((x,j)=>{let u=0;x.forEach((i,k)=>{if(Math.round(fl[j]*(k+1)/x.length)>u){kt[i]=KT[0];u++}else kt[i]=KT[1]})});
const rw=M.length&&Array.from({length:N},(_,i)=>({id:uid(),materi:M[i%M.length],ket:kt[i],tp:'',indikator:'',level:l[i],diff:d[i],bentuk:b[i],jumlah:1,skor:SKR[b[i]]}));
S.rows=rw.sort((x,y)=>M.indexOf(x.materi)-M.indexOf(y.materi)||LV.indexOf(x.level)-LV.indexOf(y.level)||DF.indexOf(x.diff)-DF.indexOf(y.diff));
S.soal={};resetFL();resetFL2();resetFLE();save();go(1)}
const getKet=r=>r.ket||KT[0];
const matCell=r=>{const L=S.materi;return L.length?`<select data-r="${r.id}" data-f="materi">${[...(L.includes(r.materi)?[]:[r.materi||'']),...L].map(x=>`<option${x===r.materi?' selected':''}>${esc(x)}</option>`).join('')}</select>`:`<textarea data-r="${r.id}" data-f="materi">${esc(r.materi)}</textarea>`};

/* 2 KISI-KISI */
const autosize=el=>{el.style.height='auto';el.style.height=el.scrollHeight+'px'};
const fit=()=>document.querySelectorAll('#t1 textarea').forEach(el=>{const tr=el.closest('tr');if(!tr||tr.style.display!=='none')autosize(el)});
const blankFL=()=>({q:'',materi:'',level:'',diff:'',bentuk:'',ket:'',kosong:false});let FL=blankFL();const resetFL=()=>{FL=blankFL()};
const fmatch=r=>{const q=FL.q.trim().toLowerCase();if(q&&!(((r.tp||'')+' '+(r.indikator||'')).toLowerCase().includes(q)))return false;
if(FL.materi&&r.materi!==FL.materi)return false;if(FL.level&&r.level!==FL.level)return false;if(FL.diff&&r.diff!==FL.diff)return false;if(FL.bentuk&&r.bentuk!==FL.bentuk)return false;if(FL.ket&&getKet(r)!==FL.ket)return false;
if(FL.kosong&&(r.tp||'').trim()&&(r.indikator||'').trim())return false;return true};
function applyFilter(){let n=0;document.querySelectorAll('#t1 tr[data-rid]').forEach(tr=>{const r=S.rows.find(x=>x.id===tr.dataset.rid),ok=!!r&&fmatch(r);tr.style.display=ok?'':'none';if(ok)n++});const e=$('#fcnt');if(e)e.textContent='Menampilkan '+n+' dari '+S.rows.length+' baris · tombol Ekspor mengikuti filter ini';fit()}
const fsel=(k,list)=>`<select data-fl="${k}"><option value="">Semua</option>${list.map(x=>`<option${x===FL[k]?' selected':''}>${esc(x)}</option>`).join('')}</select>`;
const fit2=()=>document.querySelectorAll('#t2 textarea').forEach(el=>{const card=el.closest('.q');if(!card||card.style.display!=='none')autosize(el)});
addEventListener('resize',()=>{if($('#t1').classList.contains('on'))fit();if($('#t2').classList.contains('on'))fit2()});
function r1(){const st=starts();
$('#t1').innerHTML=`<div class="card"><h2>Kisi-kisi Soal</h2><p class="m">Satu baris = satu indikator. Isi jumlah butir soal per indikator; nomor soal dihitung otomatis.</p>
<div class="g" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:8px;align-items:end"><div style="grid-column:span 2"><label>Cari (TP / indikator)</label><input data-fq placeholder="Ketik kata kunci" value="${esc(FL.q)}"></div>
<div><label>Materi</label>${fsel('materi',[...new Set([...S.materi,...S.rows.map(r=>r.materi)].filter(Boolean))])}</div><div><label>Level</label>${fsel('level',LV)}</div><div><label>Kesulitan</label>${fsel('diff',DF)}</div><div><label>Bentuk</label>${fsel('bentuk',BT)}</div><div><label>Keterangan</label>${fsel('ket',KT)}</div>
<div><label style="display:flex;gap:6px;align-items:center;font-size:13px;color:var(--tx)"><input type="checkbox" data-fk style="width:auto"${FL.kosong?' checked':''}>TP / indikator kosong</label></div><div><button class="b s" data-act="fl-reset">Reset filter</button></div><div><button class="b" data-act="x-fkisi" title="Mengikuti filter di atas">Ekspor Word</button></div><div><button class="b s" data-act="x-fcsv" title="Mengikuti filter di atas">Ekspor CSV</button></div></div>
<p id="fcnt" class="m"></p>
<div class="w"><table><tr><th>No</th><th>Tujuan Pembelajaran</th><th>Materi Esensial</th><th>Indikator</th><th>Level Kognitif</th><th>Kesulitan</th><th>Bentuk</th><th>Jml</th><th>Skor/butir</th><th>Keterangan</th><th></th></tr>
${S.rows.map((r,i)=>`<tr data-rid="${r.id}"><td>${noTxt(r,st[i])}</td>
<td><textarea data-r="${r.id}" data-f="tp">${esc(r.tp)}</textarea></td>
<td>${matCell(r)}</td>
<td><textarea data-r="${r.id}" data-f="indikator">${esc(r.indikator)}</textarea></td>
<td>${sel(LV,r.level,`data-r="${r.id}" data-f="level"`)}</td><td>${sel(DF,r.diff,`data-r="${r.id}" data-f="diff"`)}</td><td>${sel(BT,r.bentuk,`data-r="${r.id}" data-f="bentuk"`)}</td>
<td style="width:60px"><input type="number" min="0" data-r="${r.id}" data-f="jumlah" value="${r.jumlah}"></td>
<td style="width:70px"><input type="number" min="0" data-r="${r.id}" data-f="skor" value="${r.skor}"></td>
<td>${sel(KT,getKet(r),`data-r="${r.id}" data-f="ket"`)}</td>
<td><button class="d" data-del="${r.id}" title="Hapus">×</button></td></tr>`).join('')||'<tr><td colspan="10" class="m">Belum ada baris. Klik “Tambah indikator”.</td></tr>'}</table></div>
<p id="ksum" class="m"></p><div class="bar"><button class="b" data-act="add">+ Tambah indikator</button><button class="b s" data-act="dup">Gandakan baris terakhir</button></div></div>`;ksum();applyFilter()}
function ksum(){const e=$('#ksum');if(!e)return;const t=+S.meta.total||0,n=tot();e.innerHTML=`Total soal terencana: <b>${n}</b>${t?` dari target ${t} (<span class="${n===t?'ok':'wr'}">${n-t>0?'+':''}${n-t}</span>)`:''} · Total skor: <b>${S.rows.reduce((a,r)=>a+J(r)*(+r.skor||0),0)}</b>`}

/* 3 INPUT SOAL */
const hc=m=>{const i=S.materi.indexOf((m||'').trim()),n=S.materi.length;return i<0?null:Math.round(210-210*(n>1?i/(n-1):0))};
const blankFL2=()=>({q:'',materi:'',level:'',diff:'',bentuk:'',ket:'',belum:false});let FL2=blankFL2();const resetFL2=()=>{FL2=blankFL2()};
const fsel2=(k,list)=>`<select data-fl2="${k}"><option value="">Semua</option>${list.map(x=>`<option${x===FL2[k]?' selected':''}>${esc(x)}</option>`).join('')}</select>`;
function fmatch2(r,i,no){
  const qStr=FL2.q.trim().toLowerCase();
  if(qStr){
    const obj=(S.soal[r.id]||[])[i]||{};
    const hay=[String(no),r.indikator,r.tp,obj.q,obj.a,obj.b,obj.c,obj.d,obj.e,obj.key].join(' ').toLowerCase();
    if(!hay.includes(qStr))return false;
  }
  if(FL2.materi&&r.materi!==FL2.materi)return false;
  if(FL2.level&&r.level!==FL2.level)return false;
  if(FL2.diff&&r.diff!==FL2.diff)return false;
  if(FL2.bentuk&&r.bentuk!==FL2.bentuk)return false;
  if(FL2.ket&&getKet(r)!==FL2.ket)return false;
  if(FL2.belum&&filled(r,i))return false;
  return true;
}
function applyFilter2(){
  let shown=0,total=0;
  document.querySelectorAll('#t2 .q[data-rid]').forEach(card=>{
    total++;
    const rid=card.dataset.rid,idx=+card.dataset.idx,no=+card.dataset.no;
    const r=S.rows.find(x=>x.id===rid);
    const ok=!!r&&fmatch2(r,idx,no);
    card.style.display=ok?'':'none';
    if(ok)shown++;
  });
  const e=$('#fcnt2');
  if(e)e.textContent='Menampilkan '+shown+' dari '+total+' soal';
  const emp=$('#femp2');
  if(emp)emp.style.display=(total>0&&shown===0)?'':'none';
  updEx2();
  fit2();
}
function r2(){if(!S.rows.length){$('#t2').innerHTML='<div class="card">Susun kisi-kisi dulu pada tab 2.</div>';return}
const st=starts();let done=0;
const body=S.rows.map((r,ri)=>{const arr=S.soal[r.id]=S.soal[r.id]||[];let h='';
for(let i=0;i<J(r);i++){const q=arr[i]=arr[i]||{};if(filled(r,i))done++;const no=st[ri]+i;
h+=`<div class="q${hc(r.materi)===null?' nm':''}" data-rid="${r.id}" data-idx="${i}" data-no="${no}" style="--c:${hc(r.materi)??0}"><span class="bd">${esc(r.materi)||'Materi belum dipilih'}</span><div class="h"><b>Soal No. ${no}</b> · ${esc(r.level.split(' ')[0])} · ${r.diff} · ${r.bentuk} · skor ${r.skor||0} · <i>${esc(getKet(r))}</i><br>Indikator: ${esc(r.indikator)||'<i>(belum diisi)</i>'}</div>

/* DOCX BUILDER (ZERO-DEPENDENCY ZIP + OOXML) */
function makeCrcTable(){const t=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);t[i]=c}return t}
const CRC_TBL=makeCrcTable();
function crc32(buf){let c=0xffffffff;for(let i=0;i<buf.length;i++)c=CRC_TBL[(c^buf[i])&0xff]^(c>>>8);return(c^0xffffffff)>>>0}
function buildZip(files){
  const nw=new Date(),DT=[(nw.getHours()<<11)|(nw.getMinutes()<<5)|(nw.getSeconds()>>1),((nw.getFullYear()-1980)<<9)|((nw.getMonth()+1)<<5)|nw.getDate()];
  const enc=new TextEncoder(),parts=[],central=[];let offset=0;
  for(const f of files){
    const name=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(data);
    const lh=new Uint8Array(30+name.length),lv=new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0x0800,true);lv.setUint16(8,0,true);lv.setUint16(10,DT[0],true);lv.setUint16(12,DT[1],true);
    lv.setUint32(14,crc,true);lv.setUint32(18,data.length,true);lv.setUint32(22,data.length,true);
    lv.setUint16(26,name.length,true);lh.set(name,30);
    parts.push(lh,data);
    const cd=new Uint8Array(46+name.length),cv=new DataView(cd.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x0800,true);cv.setUint16(12,DT[0],true);cv.setUint16(14,DT[1],true);
    cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);
    cv.setUint16(28,name.length,true);cv.setUint32(42,offset,true);cd.set(name,46);
    central.push(cd);
    offset+=lh.length+data.length;
  }
  const cdSize=central.reduce((a,b)=>a+b.length,0);
  const eocd=new Uint8Array(22),ev=new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true);ev.setUint32(16,offset,true);
  return new Blob([...parts,...central,eocd],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

function mcqProblems(items,kompleks){
  const out=[];
  items.forEach(({q},idx)=>{
    const p=[],kl=keyLetters(q.key);
    if(!(q.q||'').trim())p.push('teks soal kosong');
    if(['a','b','c','d'].filter(x=>(q[x]||'').trim()).length<4)p.push('opsi A–D belum lengkap');
    if(!kl.length)p.push('kunci jawaban kosong');
    else{
      if(kl.some(x=>!(q[x]||'').trim()))p.push('kunci menunjuk opsi kosong');
      if(kompleks&&kl.length<2)p.push('PGK sebaiknya punya minimal 2 kunci');
      if(!kompleks&&kl.length>1)p.push('kunci lebih dari satu huruf (dipakai huruf pertama)');
    }
    if(p.length)out.push(`No. ${idx+1} (di proyek: ${items[idx].no}): ${p.join(', ')}`);
  });
  return out;
}

function mcqDocxBlob(items,kompleks){
  /* Paket dikloning dari IMPORT_QUESTION_TEMPLATE_MCQ_V3: header, styles, settings, theme, numbering, sectPr identik; hanya isi soal yang diganti. */
  const clean=x=>String(x??'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
  const B='<w:rPr><w:b w:val="1"/><w:bCs w:val="1"/><w:rtl w:val="0"/></w:rPr>',N='<w:rPr><w:rtl w:val="0"/></w:rPr>';
  const t=x=>clean(x).split(/\r?\n/).map((l,i)=>(i?'<w:br/>':'')+`<w:t xml:space="preserve">${xmlEsc(l)}</w:t>`).join('');
  const run=(x,bold)=>`<w:r>${bold?B:N}${x===''?'':t(x)}</w:r>`;
  const P0='<w:pPr><w:spacing w:after="160" w:lineRule="auto"/><w:rPr/></w:pPr>';
  const line=(label,text)=>`<w:p>${P0}${run(label,true)}${run(text===undefined?'':text,false)}</w:p>`;
  const opt=(x,n)=>`<w:p><w:pPr><w:numPr><w:ilvl w:val="0"/><w:numId w:val="${n}"/></w:numPr><w:ind w:left="720" w:hanging="360"/><w:rPr><w:u w:val="none"/></w:rPr></w:pPr><w:r>${N}${t(x)}</w:r></w:p>`;
  const blocks=items.map(({r,q},idx)=>{

      line('Soal: ',(q.q||'').trim()||'Tulis pertanyaan di sini.'),
      `<w:p><w:pPr><w:spacing w:after="160" w:lineRule="auto"/><w:rPr><w:b w:val="1"/><w:bCs w:val="1"/></w:rPr></w:pPr>${run('Opsi:',true)}</w:p>`,

  });
  const blank=`<w:p>${P0}<w:r>${N}</w:r></w:p>`;
  const docXml=TPL.xmlhead+TPL.docRoot+'<w:body>'+blocks.join(blank)+TPL.sect+'</w:body></w:document>';
  const numXml=TPL.xmlhead+TPL.numRoot+items.map((_,i)=>TPL.abs.replace('@@',i+1)).join('')+items.map((_,i)=>`<w:num w:numId="${i+1}"><w:abstractNumId w:val="${i+1}"/></w:num>`).join('')+'</w:numbering>';
  const P={...TPL.parts,...(kompleks?TPLK:{})};
  return buildZip([
    {name:'[Content_Types].xml',data:P['[Content_Types].xml']},{name:'_rels/.rels',data:P['_rels/.rels']},
    {name:'word/document.xml',data:docXml},{name:'word/_rels/document.xml.rels',data:P['word/_rels/document.xml.rels']},
    {name:'word/numbering.xml',data:numXml},{name:'word/styles.xml',data:P['word/styles.xml']},
    {name:'word/settings.xml',data:P['word/settings.xml']},{name:'word/fontTable.xml',data:P['word/fontTable.xml']},
    {name:'word/header1.xml',data:P['word/header1.xml']},{name:'word/theme/theme1.xml',data:P['word/theme/theme1.xml']}]);
}
function exportMcqDocx(items,label,kompleks){
  if(!items.length)return alert('Tidak ada soal Pilihan Ganda yang cocok dengan filter.');
  const pr=mcqProblems(items,kompleks);
  if(pr.length&&!confirm('Ditemukan '+pr.length+' soal bermasalah:\n\n'+pr.slice(0,12).join('\n')+(pr.length>12?'\n… dan '+(pr.length-12)+' lainnya':'')+'\n\nKunci kosong akan diisi otomatis ('+(kompleks?'a,b':'a')+'). Tetap ekspor?'))return;
  const MAX=50,base=fn(label||'IMPORT_MCQ_LMS');
  if(items.length<=MAX){dl(mcqDocxBlob(items,kompleks),base+'.docx');return}
  const parts=Math.ceil(items.length/MAX);
  if(!confirm('Template LMS berisi 50 soal per file. '+items.length+' soal akan dipecah menjadi '+parts+' file (maks. 50 soal per file, nomor tiap file mulai dari 1). Jika browser menanyakan izin unduhan banyak file, pilih Izinkan. Lanjutkan?'))return;
  for(let p=0;p<parts;p++)setTimeout(()=>dl(mcqDocxBlob(items.slice(p*MAX,(p+1)*MAX),kompleks),base+'_bagian'+(p+1)+'.docx'),p*700);
}

function head(t){const m=S.meta;return `<h3 style="text-align:center;margin:0">${t}</h3><p style="text-align:center;margin:0">${esc(m.jenis)} ${esc(m.mapel)} · ${esc(m.kelas)} · Semester ${esc(m.semester)} · TA ${esc(m.tahun)}</p><p style="text-align:center;margin:0 0 8px">${esc(m.sekolah)}</p>`}
function kisiHtml(sub){const rs=sub||S.rows,st=starts(),m=S.meta,tn=(m.jenis||'').trim().toUpperCase(),nb=x=>esc(x).replace(/\n/g,'<br>');
const kv=(a,v)=>`<td style="border:none;padding:2px 4px;width:17%">${a}</td><td style="border:none;padding:2px 4px;width:2%">:</td><td style="border:none;padding:2px 4px">${nb(v)}</td>`;
const hd=['NO.','TUJUAN PEMBELAJARAN','MATERI ESENSIAL','INDIKATOR','LEVEL KOGNITIF'],wd=[7,33,20,28,12];
return `<div style="page:Kisi;font-family:Arial,sans-serif"><p style="text-align:center;margin:0;font-size:12pt"><b>KISI-KISI ASESMEN${tn?' '+esc(tn):''}</b></p><p style="text-align:center;margin:0 0 14pt;font-size:12pt"><b>TAHUN AJARAN ${esc(m.tahun)}</b></p>
<table style="margin-bottom:10pt"><tr>${kv('Jenjang',m.jenjang)}${kv('Kelas',m.kelas)}</tr><tr>${kv('Mata Pelajaran',m.mapel)}${kv('Jumlah Soal',rs.reduce((a,r)=>a+J(r),0))}</tr></table>
<table><tr>${hd.map((h,i)=>`<th bgcolor="#2E75B6" style="background:#2E75B6;color:#FFFFFF;border:1px solid #FFFFFF;text-align:center;padding:5px;width:${wd[i]}%">${h}</th>`).join('')}</tr>
${rs.map((r,i)=>{const bg=i%2?'#DDEBF7':'#FFFFFF',c=`bgcolor="${bg}" style="background:${bg};border:1px solid #9DC3E6;padding:5px;`;return `<tr><td ${c}text-align:center">${noTxt(r,st[S.rows.indexOf(r)])}.</td><td ${c}">${nb(r.tp)}</td><td ${c}">${nb(r.materi)}</td><td ${c}">${nb(r.indikator)}</td><td ${c}text-align:center">${r.level.split(' ')[0]}</td></tr>`}).join('')}</table></div>`}
function flat(){const st=starts(),o=[];S.rows.forEach((r,ri)=>{for(let i=0;i<J(r);i++)o.push({n:st[ri]+i,r,q:(S.soal[r.id]||[])[i]||{}})});return o}
function soalHtml(){return `<div style="page:Soal">${head('NASKAH SOAL')}<hr>${flat().map(({n,r,q})=>`<p style="margin:10px 0 2px">${n}.&nbsp; ${esc(q.q).replace(/\n/g,'<br>')}</p>${isPG(r.bentuk)?['a','b','c','d','e'].filter(k=>(q[k]||'').trim()).map(k=>`<p style="margin:0 0 0 28px">${k.toUpperCase()}.&nbsp; ${esc(q[k])}</p>`).join(''):r.bentuk==='Benar-Salah'?'<p style="margin:0 0 0 28px">○ Benar &nbsp;&nbsp;&nbsp; ○ Salah</p>':''}`).join('')}</div>`}
function kunciHtml(){return `<div style="page:Soal">${head('KUNCI JAWABAN & PEDOMAN PENSKORAN')}<table><tr><th>No</th><th>Level</th><th>Kesulitan</th><th>Kunci / Pedoman</th><th>Skor</th></tr>${flat().map(({n,r,q})=>`<tr><td>${n}</td><td>${r.level.split(' ')[0]}</td><td>${r.diff}</td><td>${esc(q.key).replace(/\n/g,'<br>')}</td><td>${r.skor||0}</td></tr>`).join('')}</table></div>`}
function exportDoc(parts,name){const brk='<br clear="all" style="page-break-before:always;mso-break-type:section-break">';
const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${name}</title><style>@page Kisi{size:21cm 29.7cm;margin:2cm}@page Soal{size:21cm 29.7cm;margin:2cm}body{font-family:'Times New Roman',serif;font-size:12pt}table{border-collapse:collapse;width:100%}td,th{border:1px solid #000;padding:4px;font-size:10pt;vertical-align:top}th{background:#d9e2f3}</style></head><body>${parts.join(brk)}</body></html>`;
dl(new Blob(['\ufeff'+html],{type:'application/msword'}),name+'.doc')}
function exportCsv(rs,name){const st=starts(),q=v=>'"'+String(v??'').replace(/"/g,'""').replace(/\r?\n/g,' ')+'"';
const L=[['No Soal','Tujuan Pembelajaran','Materi Esensial','Indikator','Level Kognitif','Tingkat Kesulitan','Bentuk Soal','Jumlah Soal','Skor per Butir','Keterangan'].map(q).join(';')];
rs.forEach(r=>L.push([noTxt(r,st[S.rows.indexOf(r)]),r.tp,r.materi,r.indikator,r.level,r.diff,r.bentuk,J(r),r.skor,getKet(r)].map(q).join(';')));
dl(new Blob(['\ufeff'+L.join('\r\n')],{type:'text/csv;charset=utf-8'}),name+'.csv')}
function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const fn=s=>((S.meta.mapel||'soal')+'-'+s).replace(/[^\w-]+/g,'_');

/* EVENTS */
document.addEventListener('input',e=>{const d=e.target.dataset;if(!d)return;
if(e.target.tagName==='TEXTAREA'&&e.target.closest('#t1,#t2'))autosize(e.target);
if(d.fq!==undefined){FL.q=e.target.value;applyFilter();return}if(d.fl){FL[d.fl]=e.target.value;applyFilter();return}if(d.fk!==undefined){FL.kosong=e.target.checked;applyFilter();return}
if(d.fkx!==undefined){EX2.lengkap=e.target.checked;updEx2();return}
if(d.fq2!==undefined){FL2.q=e.target.value;applyFilter2();return}if(d.fl2){FL2[d.fl2]=e.target.value;applyFilter2();return}if(d.fk2!==undefined){FL2.belum=e.target.checked;applyFilter2();return}
if(d.fqe!==undefined){FLE.q=e.target.value;updExpCount();return}if(d.fle){FLE[d.fle]=e.target.value;updExpCount();return}if(d.fke!==undefined){FLE.lengkap=e.target.checked;updExpCount();return}
if(d.m!==undefined){S.meta[d.m]=e.target.value}
else if(d.t){S.target[d.t]=+e.target.value;tsum()}
else if(d.tl){S.tLv[d.tl]=+e.target.value;tsum()}
else if(d.tb){S.tBt[d.tb]=+e.target.value;tsum()}
else if(d.tk){S.tKet[d.tk]=+e.target.value;tsum()}
else if(d.mat!==undefined){S.materi=e.target.value.split('\n').map(x=>x.trim()).filter(Boolean)}
else if(d.r){const r=S.rows.find(x=>x.id===d.r);r[d.f]=e.target.value;if(['jumlah'].includes(d.f))ksum();if(d.f==='skor')ksum()}
else if(d.s){const a=S.soal[d.s];a[+d.i]=a[+d.i]||{};a[+d.i][d.f]=e.target.value;upd2()}
else return;save()});
document.addEventListener('change',e=>{if(e.target.dataset.r&&e.target.tagName==='SELECT'||e.target.dataset.f==='jumlah'&&e.target.dataset.r)r1()});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
if(t.dataset.tab!==undefined)return go(+t.dataset.tab);
if(t.dataset.del){S.rows=S.rows.filter(r=>r.id!==t.dataset.del);delete S.soal[t.dataset.del];save();return r1()}
const a=t.dataset.act;if(!a)return;
if(a==='gen')gen();
if(a==='fl-reset'){resetFL();r1()}
if(a==='fl2-reset'){resetFL2();r2()}
if(a==='fle-reset'){resetFLE();r4()}
if(a==='add'){resetFL();S.rows.push({id:uid(),materi:S.materi[0]||'',ket:KT[0],tp:'',indikator:'',level:LV[1],diff:'Sedang',bentuk:BT[0],jumlah:1,skor:1});save();r1()}
if(a==='dup'&&S.rows.length){resetFL();S.rows.push({...S.rows[S.rows.length-1],id:uid()});save();r1()}
if(a==='exp-json')dl(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),fn('proyek')+'.json');
if(a==='reset'&&confirm('Hapus semua data dan mulai baru?')){S={};norm();resetFL();resetFL2();resetFLE();save();r0()}
if(a==='x-all')exportDoc([kisiHtml(),soalHtml(),kunciHtml()],fn('lengkap'));
if(a==='x-kisi')exportDoc([kisiHtml()],fn('kisi-kisi'));
if(a==='x-fkisi'||a==='x-fcsv'){const rs=S.rows.filter(fmatch);if(!rs.length)return alert('Tidak ada baris yang cocok dengan filter.');a==='x-fkisi'?exportDoc([kisiHtml(rs)],fn('kisi-kisi-terfilter')):exportCsv(rs,fn('kisi-kisi-terfilter'))}
if(a==='x-soal')exportDoc([soalHtml()],fn('naskah'));
if(a==='x-kunci')exportDoc([kunciHtml()],fn('kunci'));
if(a==='x-lms')exportMcqDocx(getFilteredMcq(),'IMPORT_MCQ_LMS');
if(a==='x-lms2')exportMcqDocx(getMcq2(false),'IMPORT_MCQ_LMS_filter',false);
if(a==='x-lmsk')exportMcqDocx(getMcq2(true),'IMPORT_MCQ_PGK_LMS_filter',true)});
document.addEventListener('change',e=>{if(e.target.id!=='imp')return;const f=e.target.files[0];if(!f)return;if((S.rows.length||S.materi.length)&&!confirm('Data saat ini akan diganti dengan isi file. Lanjutkan?')){e.target.value='';return}const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||typeof o!=='object'||!Array.isArray(o.rows||[]))throw 0;S=o;norm();resetFL();resetFL2();resetFLE();save();r0();alert('Proyek berhasil dimuat.')}catch(x){alert('File proyek tidak valid.')}};rd.readAsText(f);e.target.value=''});
go(0);
</script>
